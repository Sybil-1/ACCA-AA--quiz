{"id":340,"points":5,"type":"case","category":"SP","title":"Heron Co — Legal claim provision (5 marks)","caseText":"It is 1 July 20X5. You are an audit supervisor of Owl & Co, responsible for the final audit of Heron Co for the year ended 31 May 20X5 which is due to commence shortly. Heron Co is a manufacturer of colour dyes used in the textile industry. Its draft financial statements show total assets of $65.4m and profit before tax of $8.9m.\nProvision for legal claim: Parrot Co, a customer of Heron Co, has made a claim for $0.8m against the company. Parrot Co is claiming that a customised yellow dye purchased from Heron Co in March 20X5 was sub-standard and that, as a result, Parrot Co had to scrap a large batch of clothes it was producing. The finance director has included a provision of $0.6m in the draft financial statements for the year ended 31 May 20X5 as she believes that this is the likely sum to be paid to settle the claim. The yellow dye was not sold to any other customers and Heron Co does not hold any inventory of the dye at the year end.","question":"Required: (c) Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to Heron Co's provision for the legal claim. (5 marks)","modelAnswer":["Review the board minutes and discuss with management to assess whether Heron Co has a present obligation as a result of a past event.","Inspect correspondence received from the customer regarding the claim in order to assess whether a provision should be recognised and, if so, whether the amount of the provision is reasonable.","Review the correspondence from Heron Co's lawyer to ensure the existence and probability of payment.","Obtain a written representation from management to confirm the completeness of the provision.","Review the after-date payment and compare the actual payment to the amount recorded to assess the reasonableness of the provision.","Review the disclosure of the provision to ensure it is in accordance with IAS 37 Provisions, Contingent Liabilities and Contingent Assets."],"keywords":[["board minutes","present obligation"],["correspondence","customer","claim"],["lawyer","probability"],["written representation","completeness"],["after-date payment","after date payment","reasonable"],["disclosure","IAS 37"]]},
{"id":341,"points":7,"type":"case","category":"SP","title":"Canopus Co — Restructuring provision (5 marks)","caseText":"Canopus Co manufactures paint at seven factories across the country and its year end is 31 March 20X5. Due to a change in business focus, the directors decided to carry out a fundamental reorganisation of the production process and have included a restructuring provision of $2.1m in the financial statements. The restructure involves modification of factory premises, the purchase of new plant and equipment and the retraining of existing employees. The plan was finalised at a board meeting in March 20X5 and was announced to shareholders and employees shortly before the year end.","question":"Describe the substantive procedures the auditor should perform in respect of the restructuring provision.","modelAnswer":["Review the board minutes where the decision to restructure the production process was taken and confirm the decision was made in March 20X5, before the year end.","Discuss with the directors the detail of the restructure to confirm that a present obligation exists at the year end (there must be a detailed formal plan which has been announced to those affected).","Discuss with management the detail of the restructure to ensure it is probable that the obligation will be paid.","Cast the breakdown of the restructuring provision and agree the total to the trial balance and financial statements.","Obtain a written representation from management to confirm the completeness of the provision.","For the costs included within the provision, agree to supporting documentation such as purchase invoices to confirm accuracy — note that the purchase of new plant and equipment and retraining of staff are not eligible for inclusion in a restructuring provision.","Review the after-date payments and compare the actual payments to the amounts recorded to assess whether the provision is reasonable; review the disclosure of the provision to ensure it is in accordance with IAS 37."],"keywords":[["board minutes","March 20X5"],["present obligation","detailed formal plan"],["probable"],["cast","agree"],["written representation","completeness"],["plant","retraining","not eligible"],["after-date payment","after date payment","IAS 37"]]},
{"id":342,"points":5,"type":"case","category":"SP","title":"Cookit Co — Redundancy provision (5 marks)","caseText":"It is 1 July 20X5. Cookit Co owns ten shops selling kitchen equipment. Your firm, Beeny & Co, is about to commence the final audit for the year ended 31 May 20X5.\nInventory: Cookit Co sells a range of cookery products endorsed by a famous TV chef, Remy Gusteau. In February 20X5, the TV company that produced his show cancelled the programme which led to a reduction in demand for Remy Gusteau products. Cookit Co stopped purchasing these goods in March 20X5. Total inventory in the draft financial statements for the year ended 31 May 20X5 is $4.25m. Cookit Co's system-generated inventory valuation report shows that this includes Remy Gusteau products at a cost of $1.7m. A member of the audit team attended the year-end inventory count of Cookit Co.\n(c) Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to Cookit Co's redundancy provision. (5 marks)","question":"Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to Cookit Co's redundancy provision. (5 marks)","modelAnswer":["Review the official announcement of the redundancy on the website on 28 May 20X5 to assess whether a present obligation exists as a result of a past event.","Review the board minutes to confirm whether the plan for the shop closure was discussed and agreed before the year end.","Discuss with management the details of the redundancy to assess whether a present obligation exists and whether payment is probable.","Obtain a list of the 32 employees to be made redundant, cast the schedule and agree to the trial balance and draft financial statements to confirm completeness and accuracy.","Obtain a written representation from management to confirm the completeness of the provision.","Recalculate the redundancy provision of $1.8m and agree to the employment contracts to confirm accuracy.","Review the after-date payments and compare the actual amounts paid to the provision recorded to assess reasonableness; review the disclosure of the provision to ensure it is in accordance with IAS 37."],"keywords":[["announcement","present obligation"],["board minutes","before the year end"],["probable","discuss"],["32","cast","agree"],["written representation"],["recalculate","employment contract"],["after-date payment","after date payment","IAS 37"]]},
{"id":343,"points":4,"type":"case","category":"SP","title":"Encore Co — Contingent liability: breach of transport regulations (4 marks)","caseText":"It is 1 July 20X5. You are an audit supervisor with Velo & Co and you are working on the final audit of Encore Co for the year ended 30 April 20X5. Encore Co is a waste management company, supplying its services to a variety of governmental and business organisations. Encore Co's draft profit before tax is $5.3m (20X4: $4.6m) and total assets are $40.1m (20X4 $33.9m). You have been provided with the following information regarding the draft financial statements.\nPotential breach of transport regulations: In March 20X5, a former employee of Encore Co made a complaint to the transport authority, alleging that Encore Co has breached the regulations concerning maximum driving hours and compulsory rest breaks for drivers on a number of occasions. The transport authority has launched an investigation but the directors of Encore Co are not intending to disclose this issue or make any provision as they do not believe that the potential fine, which is $50,000 per breach, is material.","question":"Required: (c) Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to the potential breach of transport regulations by Encore Co. (4 marks)","modelAnswer":["Review correspondence with the transport authority to establish the details of the complaint and assess whether there is a present obligation as a result of a past event.","Review correspondence with the lawyers to establish their assessment of the likelihood of payment and the possible amount of the fine.","Obtain a written representation from the directors as to the reason they are unwilling to provide for or disclose the issue.","Inspect the post year-end cash book and bank statements to identify whether any fines have been paid.","Consider whether the potential fine of $50,000 per breach is material, and review the disclosure of the contingent liability to ensure it is in accordance with IAS 37 Provisions, Contingent Liabilities and Contingent Assets."],"keywords":[["transport authority","correspondence"],["lawyers","likelihood"],["written representation","unwilling"],["post year-end cash book","post year-end","fines"],["material","ias 37","contingent liabilit"]]},
{"id":344,"points":5,"type":"case","category":"SP","title":"Danube Co — Provision + contingent receivable (defective goods) (5 marks)","caseText":"It is 1 July 20x5. Danube Co is listed on a stock exchange and sells consumer goods to wholesale customers. The company has a large head office and 18 warehouses. You are an audit supervisor of Mississippi & Co and the final audit for the year ended 31 March 20x5 is due to commence shortly. The draft financial statements show total assets of $198.5m and profit before tax of $56.1m.\nProvision and receivable arising from the sale of defective goods: In December 20X4 Danube Co sold a number of hoverboards to a customer, Kalama Kids Co. It is alleged by Kalama Kids Co that these hoverboards are faulty, as there have been a few instances of the hoverboards overheating and catching fire. As a result, Kalama Kids Co is suing Danube Co for $3.9m. The court case is due to take place in August 20x5 and management believes that Kalama Kids Co's claim is likely to be successful. No hoverboards remain in Danube Co's inventory at the year end.\nDanube Co purchased the hoverboards from a supplier, Thames Co. In February 20x5 Danube Co contacted Thames Co and requested that they reimburse Danube Co for damages which may become payable as a result of the sale of defective hoverboards. Danube Co is requesting a sum of $3.9m from Thames Co. The draft financial statements contain a provision of $3.9m in respect of the customer's claim and a receivable of $3.9m in respect of Danube Co's counter-claim against its supplier.\nc) Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to the PROVISION and the RECEIVABLE arising from the sale of defective goods. (5 marks)","question":"Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to the PROVISION and the RECEIVABLE arising from the sale of defective goods. (5 marks)","modelAnswer":["Obtain a written representation confirming management's view that the lawsuit by Kalama Kids Co is likely to be successful and the claim against Thames Co is virtually certain, so that both a provision and a receivable are required to be included.","Review the correspondence with Kalama Kids Co and establish the details of the claim to assess whether a present obligation as a result of a past event has occurred.","Review board minutes to establish whether the directors believe the customer's claim will be successful.","Review correspondence with the legal advisers as to the probability of the customer's legal claim and the likely amounts to be paid.","Review the post year-end cash book to assess whether any payments have been made to the customer and compare with the provision recognised in the financial statements.","Discuss with management why they have included a receivable for the claim against the supplier, as this is possibly a contingent asset which can only be recognised as an asset when receipt is virtually certain, and consider the reasonableness of the proposed treatment.","Review correspondence with the legal advisers as to the probability of the reimbursement from the supplier being successful; review the post year-end cash book to assess whether any cash has been received from the supplier and compare with the receivable recognised."],"keywords":[["written representation","virtually certain"],["correspondence","Kalama Kids","present obligation"],["board minutes"],["legal advisers","probability"],["post year-end cash book","payments"],["contingent asset","virtually certain","receivable"],["reimbursement","received"]]},
{"id":345,"points":4,"type":"case","category":"SP","title":"Hyacinth Co — Research & development expenditure (4 marks)","caseText":"Hyacinth Co develops and manufactures computer components and its year end was 31 December 20X8. The company has a large factory, and two warehouses, one of which is off-site. The following three matters have been brought to your attention:\nResearch and development: Hyacinth Co includes expenditure incurred in developing new products within intangible assets once the recognition criteria under IAS38 Intangible Assets have been met. Intangible assets are amortised on a straight line basis over four years once production commences. The amortisation policy is based on past experience of the likely useful lives of the products. The opening balance of intangible assets is $1.9m.\nIn the current year, Hyacinth Co spent $0.8m developing three new products which are all at different stages of development.","question":"Required: (b) Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to Hyacinth Co's research and development expenditure. (4 marks)","modelAnswer":["Obtain and cast a schedule of intangible assets and agree the closing balances to the general ledger, trial balance and draft financial statements.","For the new projects, discuss with management the details of each project, the stage of development and whether the costs have been capitalised or expensed.","For those costs capitalised as development expenditure, agree the costs incurred to invoices and confirm feasibility by reviewing the feasibility report; confirm that the IAS 38 recognition criteria have been met.","Discuss with the finance director the rationale for the four-year useful life and consider its reasonableness.","Recalculate the amortisation charge for a sample of intangible assets which have commenced production and confirm that it is in line with the policy of straight line over four years."],"keywords":[["cast","agree","intangible"],["stage of development","capitalised","expensed"],["invoices","feasibility","IAS 38"],["useful life","four-year"],["recalculate","amortisation","straight line"]]},
{"id":346,"points":5,"type":"case","category":"SP","title":"Chandler Co — Rights issue: share capital (5 marks)","caseText":"Chandler Co purchases and distributes organic fruit and vegetables to individuals and companies. Fruit and vegetables are purchased from farms, predominantly from local farms, although some seasonal produce is imported. Goods are delivered to customers on a weekly basis using Chandler Co's own vehicles. Individual customers are required to pay by credit card when placing an order. Corporate customers are given credit terms of 30 days. The company's financial year ended on 30 April 20X5.\nShare capital: The board of Chandler Co decided to make a rights issue of shares on 31 January 20X5. Existing shareholders were offered one new share for every five shares held.\nDescribe substantive procedures the auditor should perform to obtain sufficient and appropriate evidence in relation share capital. (5 marks)","question":"Describe substantive procedures the auditor should perform to obtain sufficient and appropriate evidence in relation to share capital. (5 marks)","modelAnswer":["Obtain legal documentation of the share capital and confirm the rights issue terms of one new share for every five shares held.","Agree the number of shares in issue at the start of the year to the prior year financial statements.","Recalculate the number of shares in issue at the end of the year based on the take-up of the one-for-five rights issue and agree the total number of shares to the financial statements.","Recalculate the expected proceeds from the rights issue and agree this to the cash book and bank statement.","Review the financial statement disclosure to ensure appropriate disclosure has been made in accordance with the financial reporting framework, including the split between share capital and share premium."],"keywords":[["legal documentation","one for five"],["prior year","shares in issue"],["recalculate","take up"],["proceeds","cash book","bank statement"],["disclosure","share premium"]]},
{"id":347,"points":4,"type":"case","category":"SP","title":"Spinach Co — Shares issued at a premium (4 marks)","caseText":"It is 1 July 20X5. You are an audit supervisor with Sweetcorn & Co and are responsible for the final audit of your existing client Spinach Co, which is due to commence in September 20X5. Spinach Co is a listed company which manufactures garden furniture. Its draft financial statements for the year ending 31 July 20X5 show revenue of $65.1m and profit before tax of $18.2m. The following matters have been brought to your attention:\nIssue of share capital: The company is looking to expand its operations by securing an additional factory site in January 20X6. In order to raise sufficient capital to fund the factory purchase, Spinach Co issued ordinary shares at a premium in May 20X5, raising a sum of $4.3m.\n(c) Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to Spinach Co's issue of share capital. (4 marks)","question":"Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to Spinach Co's issue of share capital. (4 marks)","modelAnswer":["Review board minutes to confirm the number of additional shares issued in May 20X5 and the issue price.","Review legal documentation, correspondence or the share issue prospectus to confirm the details of the share issue.","Inspect the cash book and bank statements for evidence of the $4.3m of cash received from the share issue.","Recalculate the split of the proceeds between the nominal value of the shares and the premium on issue and agree it is correctly recorded within share capital and the share premium account.","Review the disclosure of the share issue in the draft financial statements to ensure it is in line with relevant accounting standards and local legislation."],"keywords":[["board minutes","issue price"],["prospectus","legal documentation"],["cash book","bank statement","4.3m"],["nominal value","premium","split"],["disclosure","legislation"]]},
{"id":348,"points":6,"type":"case","category":"SP","title":"Curly's Current Co — Insurance claim receivable (6 marks)","caseText":"It is 1 July 20X5. You are an audit supervisor of Olympus & Co, responsible for the final audits of three clients for the year ended 31 May 20X5.\nCurly's Current Co\nCurly's Current Co (CC) produces circuit boards which are sold to manufacturers of electrical equipment such as computers and mobile phones. One of the key materials used in production is copper wiring. In early May 20X5, production was halted for a week at the production facility as a number of customers had returned goods, claiming faults in the circuit boards supplied. On inspection, it was found that the copper used in the circuit boards was corroded and therefore unsuitable for use.\nCC's business insurance covers the company for specific occasions when business is interrupted. The finance director has informed you that a claim has been made on 28 May 20X5 for $5 million which she has estimated to cover the period when production was halted due to the problem with the corroded copper. An adjustment has been made to recognise the $5 million as a receivable as at 31 May 20X5.\n(b) With respect to the audit of Curly's Current Co, describe the audit procedures to be performed in respect of the insurance claim. (6 marks)","question":"With respect to the audit of Curly's Current Co, describe the audit procedures to be performed in respect of the insurance claim. (6 marks)","modelAnswer":["Review the insurance contract to determine the terms of the policy and confirm that the production stoppage caused by the corroded copper wire would be covered.","Obtain a list of receivables, cast the schedule to confirm its accuracy and agree to the trial balance and draft financial statements to confirm completeness.","Obtain a written representation confirming management's view that the insurance claim will be successful and hence a receivable should be recognised.","Discuss with management the basis on which they have included a $5m receivable in respect of the insurance claim, and evaluate the reasonableness of their conclusion, noting that a contingent asset can only be recognised when receipt is virtually certain.","Review any correspondence with the insurance company to evaluate the likelihood of the claim being settled in CC's favour.","Inspect the post-year-end bank statements to assess whether any cash has been received from the insurance company; review the adequacy of the disclosures of the insurance claim to ensure they are in accordance with the relevant standard."],"keywords":[["insurance contract","policy","covered"],["cast","agree","receivables"],["written representation"],["insurance claim","receivable","contingent asset"],["correspondence","likelihood"],["post-year-end","bank statement","disclosure"]]},
{"id":349,"points":4,"type":"case","category":"SP","title":"Hyacinth Co — Sales tax liability (4 marks)","caseText":"Hyacinth Co develops and manufactures computer components and its year end was 31 December 20X8. The company has a large factory, and two warehouses, one of which is offsite. You are an audit supervisor of Tulip & Co and the final audit is due to commence shortly. Draft financial statements show total assets of $23.2m and profit before tax of $6.4m. The following three matters have been brought to your attention:\nSales tax liability: Hyacinth Co is required by the relevant tax authority in the country in which it operates to charge sales tax at 15% on all products which it sells. This sales tax is payable to the tax authority. When purchasing raw materials and incurring expenses in the manufacturing process, the company pays 15% sales tax on any items purchased and this can be reclaimed from the tax authority. The company is required to report the taxes charged and incurred by completing a tax return on a quarterly basis, and the net amount owing to the tax authority must be remitted within four weeks of the quarter end. The draft financial statements contain a $1.1m liability for sales tax for the quarter ended 31 December 20X8.","question":"Required: (c) Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to Hyacinth Co's year-end sales tax liability. (4 marks)","modelAnswer":["Compare the year-end sales tax liability to the prior year balance or budget and investigate any significant differences.","Obtain a list of sales tax payable, cast and agree the total to the G/L, TB and F/S to ensure completeness.","Review correspondence with the tax authority to assess whether there are any additional outstanding payments due; if so, confirm they are included in the year-end liability.","Agree the after-date payment to the cash book and bank statements to confirm it has been paid in line with the terms of the tax authority.","Recalculate the amount payable to the tax authority as sales tax charged less sales tax incurred, and agree to the quarterly tax return."],"keywords":[["compare","prior year","budget"],["cast","agree","sales tax"],["tax authority","correspondence"],["after-date payment","after date payment","cash book"],["recalculate","charged less","incurred"]]},
{"id":350,"points":5,"type":"case","category":"SP","title":"Latte Co — Bank loan (5 marks)","caseText":"It is 1 July 20X5. You are an audit supervisor with Macchiato & Co currently working on the final audit of Latte Co, a supplier of catering equipment, for the year ended 31 March 20X5. Latte Co is a listed company with total assets of $22.7m and profit before tax of $3.2m. You are responsible for finalising the audit fieldwork in respect of the following:\nTrade receivables\nLatte Co's net trade receivables balance is $5.1m which comprises trade receivables of $5.5m and an allowance for receivables of $0.4m at 31 March 20X5 (20X4: receivables of $4.4m and an allowance of $0.6m). As a result of a lack of responses in prior years, the audit engagement partner has decided that a trade receivables circularisation will not be performed this year. Instead, he has asked you to identify alternative substantive procedures to confirm the existence and valuation of trade receivables.","question":"Required:\n(c) Describe substantive procedures the auditor should perform to obtain sufficient and appropriate evidence in relation to Latte Co's bank loan. (5 marks)","modelAnswer":["Obtain a list of loans, cast the schedule and agree the closing balances to the trial balance and draft financial statements to ensure completeness and accuracy.","Obtain direct confirmation at the year end from the loan provider of the outstanding balance and any security provided; agree the confirmed amounts to the loan schedule and financial statements.","For the new loan taken out in the year, review the loan agreement to confirm the amount borrowed, the repayment terms and the interest rate applicable.","For the new loan, agree the loan proceeds of $1m to the cash book and bank statements.","Recalculate the interest according to the terms of the loan agreement and agree to inclusion in the statement of profit or loss.","Review correspondence with the bank to identify whether any late payment penalties have been levied in respect of the payment made on 15 April instead of 31 March 20X5.","Review the disclosure of non-current liabilities to ensure the loan has been correctly classified between current and non-current liabilities."],"keywords":[["cast","agree","loans"],["direct confirmation","security"],["loan agreement","5%","105,000"],["proceeds","1m","cash book"],["recalculate","interest"],["late payment","penalt"],["classif","current","non-current"]]}
];


/* ==================== Category config ==================== */
const CATS = {
  objective: [
    { key: "IC", label: "IC – Internal Controls" },
    { key: "SP", label: "SP – Substantive Procedures" },
    { key: "OTHER", label: "Other Topics" }
  ],
  template: [
    { key: "IC", label: "IC – Internal Controls" },
    { key: "SP", label: "SP – Substantive Procedures" }
  ],
  case: [
    { key: "IC", label: "IC – Internal Controls" },
    { key: "SP", label: "SP – Substantive Procedures" }
  ]
};
const LS_KEY = "acca_aa_progress_v1";      // pass progress
const LS_OBJ_NOTES = "acca_aa_obj_notes_v1"; // MCQ notebook
const LS_SUB_NOTES = "noteBook";             // Written notebook (written questions + templates)
const LETTERS = ["A", "B", "C", "D", "E", "F"];

/* ==================== Safe storage layer (falls back to memory in sandbox/private mode) ==================== */
var MEM_STORE = {};
var LS_OK = (function () {
  try {
    var t = "__wb_probe__" + Date.now();
    localStorage.setItem(t, "1");
    localStorage.removeItem(t);
    return true;
  } catch (e) { return false; }
})();
function lsGet(k) {
  if (!LS_OK) return (k in MEM_STORE ? MEM_STORE[k] : null);
  try { return localStorage.getItem(k); } catch (e) { return null; }
}
function lsSet(k, v) {
  if (!LS_OK) { MEM_STORE[k] = String(v); return; }
  try { localStorage.setItem(k, v); } catch (e) { MEM_STORE[k] = String(v); }
}
function lsDel(k) {
  delete MEM_STORE[k];
  if (LS_OK) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
}

let state = { tab: "objective", cat: "IC", view: "list", q: null, sel: [] };

/* ==================== Storage ==================== */
function getProgress() {
  try { var p = JSON.parse(lsGet(LS_KEY)); return Array.isArray(p) ? p : []; } catch (e) { return []; }
}
function saveProgress(id) {
  const p = getProgress();
  if (!p.includes(id)) { p.push(id); lsSet(LS_KEY, JSON.stringify(p)); }
}
function getNotes(kind) {
  const key = kind === "obj" ? LS_OBJ_NOTES : LS_SUB_NOTES;
  try { var n = JSON.parse(lsGet(key)); return Array.isArray(n) ? n.filter(function (x) { return x && typeof x === "object"; }) : []; } catch (e) { return []; }
}
function setNotes(kind, n) {
  lsSet(kind === "obj" ? LS_OBJ_NOTES : LS_SUB_NOTES, JSON.stringify(n));
}
function resetProgress() {
  if (confirm("Clear all pass records? (Notebook entries are not affected)")) {
    lsDel(LS_KEY);
    state.view = "list"; state.q = null;
    render();
  }
}
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
}
function catLabel(type, category) {
  const list = CATS[type] || [];
  const c = list.find(function (x) { return x.key === category; });
  const prefix = type === "objective" ? "MCQ" : (type === "template" ? "Template" : "Written");
  return prefix + " · " + (c ? c.label : category);
}

/* ==================== Entry render ==================== */
function render() {
  const app = document.getElementById("app");
  /* 加宽布局仅用于 Written（case）板块 */
  const wrap = document.getElementById("wrap");
  if (wrap) wrap.className = "wrap" + (state.tab === "case" ? " wide" : "");
  if (state.view === "list") app.innerHTML = renderList();
  else if (state.view === "question") app.innerHTML = renderQuestion();
  else if (state.view === "notebook") app.innerHTML = renderNotebook();
  window.scrollTo(0, 0);
}

function renderTabs() {
  const nObj = getNotes("obj").length;
  const nSub = getNotes("sub").length;
  const t = function (key, label) {
    return '<button class="big-tab ' + (state.tab === key ? "active" : "") + '" onclick="switchTab(\'' + key + '\')">' + label + '</button>';
  };
  var html = "";
  if (!LS_OK) {
    html += '<div style="margin-bottom:14px;padding:10px 16px;border-radius:10px;font-size:12px;line-height:1.7;'
      + 'background:rgba(224,163,74,.10);border:1px solid rgba(224,163,74,.45);color:var(--orange)">'
      + '⚠️ Sandboxed preview: local storage is blocked. Progress and notes last only for this session. '
      + 'Open <b>index.html directly</b> in your browser for full saving.</div>';
  }
  return html + '<div class="big-tabs">'
    + t("objective", "📝 MCQs")
    + t("template", "🧠 Templates")
    + t("case", "✍️ Written")
    + t("nbObj", "📒 MCQ Notebook" + (nObj ? " (" + nObj + ")" : ""))
    + t("nbSub", "📓 Written Notebook" + (nSub ? " (" + nSub + ")" : ""))
    + '</div>';
}

function renderList() {
  const progress = getProgress();
  let html = renderTabs();

  html += '<div class="cat-row">';
  CATS[state.tab].forEach(function (c) {
    const items = questionBank.filter(function (q) { return q.type === state.tab && q.category === c.key; });
    const done = items.filter(function (q) { return progress.includes(q.id); }).length;
    html += '<button class="cat-btn ' + (state.cat === c.key ? "active" : "") + '" onclick="switchCat(\'' + c.key + '\')">'
      + c.label + '<span class="cat-progress">' + done + '/' + items.length + '</span></button>';
  });
  html += '</div>';

  const items = questionBank.filter(function (q) { return q.type === state.tab && q.category === state.cat; });
  html += '<div class="level-grid">';
  items.forEach(function (q) {
    const done = progress.includes(q.id);
    let meta;
    if (q.type === "objective") meta = (q.correct.length > 1 ? "Multiple choice" : "Single choice") + " · " + q.options.length + " options";
    else if (q.type === "template") meta = q.modelAnswer.length + " marking points · fill each blank";
    else meta = q.modelAnswer.length + " marking points · guided recall";
    html += '<button class="level-card ' + (done ? "done" : "") + '" onclick="openQuestion(' + q.id + ')">'
      + (done ? '<span class="done-badge">✓</span>' : '')
      + esc(q.title)
      + '<span class="meta">' + meta + '</span>'
      + '</button>';
  });
  html += '</div>';
  return html;
}

/* ==================== Answer screen ==================== */

/* 输入框数量 = 题目要求写几个点（例如 SEVEN deficiencies → 7 个框） */
function pointCount(q) {
  if (typeof q.points === "number" && q.points > 0) return q.points;
  return (q.modelAnswer || []).length;
}
/* 每个输入框写一个「完整作答点」的句式提示 */
function pointHint(q) {
  const t = ((q.question || "") + " " + (q.title || "")).toLowerCase();
  if (t.indexOf("deficienc") !== -1) return "Deficiency / Recommendation / Test of control";
  if (t.indexOf("test of control") !== -1) return "Control / Why it matters / Test of control";
  if (t.indexOf("substantive") !== -1) return "One complete substantive procedure";
  return "One complete marking point";
}

function renderQuestion() {
  const q = state.q;
  let html = renderTabs();
  html += '<button class="back-btn" onclick="backToList()">← Back to list</button>';
  const headBlock = '<div class="q-title">' + esc(q.title) + '</div>'
    + (q.caseText ? '<div class="q-case">📖 ' + esc(q.caseText) + '</div>' : '')
    + '<div class="q-question">❓ ' + esc(q.question) + '</div>';

  /* 主观题：左侧案例 / 右侧作答（对称双栏） */
  if (q.type === "case") {
    const n = pointCount(q);
    const hint = pointHint(q);
    html += '<div class="split-layout">';
    html += '<div class="split-left"><div class="q-card">' + headBlock + '</div></div>';
    html += '<div class="split-right"><div class="q-card">';
    html += '<div class="points-hint">✍️ Write <b>' + n + '</b> marking point' + (n > 1 ? "s" : "")
      + ' — ONE complete point per box:<br><span class="point-tip">' + esc(hint) + '</span></div>';
    for (let i = 0; i < n; i++) {
      html += '<div class="subj-row"><span class="num">' + (i + 1) + '</span>'
        + '<textarea class="subj-input" rows="5" placeholder="Marking point ' + (i + 1)
        + ' — ' + esc(hint) + '..."></textarea></div>';
    }
    html += '<button class="submit-btn" onclick="submitSubjective()">Submit &amp; compare answers</button>';
    html += '</div></div></div>';
    return html;
  }

  html += '<div class="q-card">';
  html += headBlock;

  if (q.type === "objective") {
    if (q.correct.length > 1) html += '<div class="multi-hint">⚠️ This is a multiple-choice question — select ' + q.correct.length + ' options</div>';
    q.options.forEach(function (opt, i) {
      html += '<div class="opt-row' + (state.sel.includes(i) ? " sel" : "") + '" onclick="toggleOpt(' + i + ')">'
        + '<div class="opt-letter">' + LETTERS[i] + '</div><div>' + esc(opt) + '</div></div>';
    });
    html += '<button class="submit-btn" onclick="submitObjective()">Confirm answer</button>';
  } else if (q.type === "template") {
    const hint2 = pointHint(q);
    html += '<div class="points-hint">✍️ Recall <b>' + q.modelAnswer.length + '</b> marking point'
      + (q.modelAnswer.length > 1 ? "s" : "") + ' — one per box (a keyword hit turns it green)'
      + '<br><span class="point-tip">' + esc(hint2) + '</span></div>';
    q.modelAnswer.forEach(function (_, i) {
      const label = (q.labels && q.labels[i]) ? q.labels[i] : ("Marking point " + (i + 1));
      html += '<div class="point-row"><label class="point-label">' + esc(label) + '</label>'
        + '<textarea class="point-input" rows="' + (q.rows && q.rows[i] ? q.rows[i] : 3)
        + '" placeholder="Recall marking point ' + (i + 1) + ' — ' + esc(hint2) + '..."></textarea></div>';
    });
    html += '<button class="submit-btn" onclick="submitTemplate()">Submit &amp; compare</button>';
  } else {
    html += '<div class="points-hint">' + q.modelAnswer.length + ' marking points — write full sentences in order</div>';
    q.modelAnswer.forEach(function (_, i) {
      html += '<div class="subj-row"><span class="num">' + (i + 1) + '</span>'
        + '<input type="text" class="subj-input" placeholder="Enter marking point ' + (i + 1) + '..." autocomplete="off"></div>';
    });
    html += '<button class="submit-btn" onclick="submitSubjective()">Submit &amp; compare answers</button>';
  }
  html += '</div>';
  return html;
}

/* ==================== MCQ: judgement + explanation ==================== */
function renderObjectiveResult(q) {
  const selSet = state.sel.slice().sort();
  const correctIdx = q.correct.map(function (l) { return LETTERS.indexOf(l); }).sort();
  const isRight = selSet.length === correctIdx.length && selSet.every(function (v, i) { return v === correctIdx[i]; });

  let html = renderTabs();
  html += '<button class="back-btn" onclick="backToList()">← Back to list</button>';
  html += '<div class="q-card">';
  html += '<div class="q-title">' + esc(q.title) + '</div>';
  if (q.caseText) html += '<div class="q-case">📖 ' + esc(q.caseText) + '</div>';
  html += '<div class="q-question">❓ ' + esc(q.question) + '</div>';
  html += '<div class="judge-banner ' + (isRight ? "right" : "wrong") + '">'
    + (isRight ? "🎉 Correct!" : "💪 Incorrect. Correct answer: " + q.correct.join(", ")) + '</div>';
  q.options.forEach(function (opt, i) {
    let cls = "locked";
    if (correctIdx.includes(i)) cls = "correct";
    else if (state.sel.includes(i)) cls = "wrong";
    html += '<div class="opt-row ' + cls + '"><div class="opt-letter">' + LETTERS[i] + '</div><div>' + esc(opt) + '</div></div>';
  });
  html += '<div class="explain-box"><div class="ex-title">📖 Explanation</div>';
  q.modelAnswer.forEach(function (a) { html += '<div class="ex-item">' + esc(a) + '</div>'; });
  html += '</div>';
  html += renderNoteBox(q, "obj");
  html += '<div class="result-actions">'
    + '<button class="act-btn pass" onclick="passLevel()">✅ Mastered — back to list</button>'
    + '<button class="act-btn retry" onclick="retryLevel()">❌ Answer again</button></div>';
  html += '</div>';
  return html;
}

/* ==================== Templates: hit/miss comparison ==================== */
function renderTemplateResult(q, userTexts, hits) {
  const score = hits.filter(Boolean).length;
  let html = renderTabs();
  html += '<button class="back-btn" onclick="backToList()">← Back to list</button>';
  html += '<div class="score-banner">Hit <span class="num">' + score + '</span> / ' + q.modelAnswer.length + ' marking points</div>';
  q.modelAnswer.forEach(function (ans, i) {
    const label = (q.labels && q.labels[i]) ? q.labels[i] : ("Marking point " + (i + 1));
    html += '<div class="result-item ' + (hits[i] ? "hit" : "miss") + '">';
    html += '<div class="r-head">' + (hits[i] ? "✅ Hit" : "❌ Missed") + ' · ' + esc(label) + '</div>';
    html += '<div class="r-answer">' + esc(ans) + '</div>';
    html += '<div class="r-user">Your input: ' + (esc(userTexts[i]) || "(blank)") + '</div>';
    if (!hits[i]) {
      html += '<div class="r-kw">Keyword hints: ' + q.keywords[i].map(function (k) { return '<span>' + esc(k) + '</span>'; }).join("") + '</div>';
    }
    html += '</div>';
  });
  html += renderNoteBox(q, "sub");
  html += '<div class="result-actions">'
    + '<button class="act-btn pass" onclick="passLevel()">✅ Perfect — back to list</button>'
    + '<button class="act-btn retry" onclick="retryLevel()">❌ Not yet — recall again</button></div>';
  return html;
}

/* ==================== Written: 采分点卡片式解析（左 Case 常驻） ==================== */

/* 在标准答案句子里把 keywords 标绿（命中）/ 标橙（未命中）；
   返回 { html, hitKw, missKw } —— missKw 含句中未出现的关键词，供底部补足提示 */
function highlightKeywords(ans, kw, userLow) {
  const low = String(ans).toLowerCase();
  const marks = [];
  const hitKw = [];
  const missKw = [];
  (kw || []).forEach(function (k) {
    const kk = String(k).toLowerCase();
    if (!kk) return;
    const hit = userLow.indexOf(kk) !== -1;
    if (hit) hitKw.push(k); else missKw.push(k);
    const pos = low.indexOf(kk);
    if (pos === -1) return;               /* 句中未出现，交给底部提示 */
    marks.push({ s: pos, e: pos + kk.length, hit: hit });
  });
  marks.sort(function (a, b) { return a.s - b.s; });
  let out = "", last = 0;
  marks.forEach(function (m) {
    if (m.s < last) return;               /* 跳过重叠 */
    out += esc(ans.slice(last, m.s));
    out += '<span class="' + (m.hit ? "kw-hit" : "kw-miss") + '">' + esc(ans.slice(m.s, m.e)) + '</span>';
    last = m.e;
  });
  out += esc(ans.slice(last));
  return { html: out, hitKw: hitKw, missKw: missKw };
}

function renderSubjectiveResult(q, userTexts, hits, match) {
  const total = userTexts.length || q.modelAnswer.length;
  const score = hits.filter(Boolean).length;
  const extra = q.modelAnswer.length - total;

  let html = renderTabs();
  html += '<button class="back-btn" onclick="backToList()">← Back to list</button>';

  /* 左侧：Case 常驻 + 独立滚动；右侧：采分点卡片 */
  const headBlock = '<div class="q-title">' + esc(q.title) + '</div>'
    + (q.caseText ? '<div class="q-case">📖 ' + esc(q.caseText) + '</div>' : '')
    + '<div class="q-question">❓ ' + esc(q.question) + '</div>';

  html += '<div class="split-layout">';
  html += '<div class="split-left"><div class="q-card">' + headBlock + '</div></div>';
  html += '<div class="split-right"><div class="q-card">';
  html += '<div class="score-banner">Hit <span class="num">' + score + '</span> / ' + total + ' marking points</div>';
  if (extra > 0) {
    html += '<div class="points-hint" style="margin-bottom:16px">💡 The official answer lists '
      + q.modelAnswer.length + ' points, but this requirement only needs ' + total
      + '. The extra ' + extra + ' are shown as alternative points — memorise the ones you find easiest.</div>';
  }

  /* 按 modelAnswer 长度循环生成卡片：第 j 张卡片 = 第 j 个标准采分点 */
  const revMap = {};                       /* 标准点 j → 用户输入框 i */
  (match || []).forEach(function (j, i) { if (typeof j === "number" && revMap[j] === undefined) revMap[j] = i; });

  q.modelAnswer.forEach(function (ans, j) {
    const i = revMap[j];
    const answered = (i !== undefined);
    const mine = answered ? (userTexts[i] || "") : "";
    const userLow = mine.toLowerCase();
    const kw = q.keywords[j] || [];
    const res = highlightKeywords(ans, kw, userLow);
    const isHit = answered ? !!hits[i] : false;

    const cls = !answered ? "alt" : (isHit ? "hit" : "miss");
    const badge = !answered
      ? "➕ Alternative point"
      : (isHit ? "✅ Hit · " + res.hitKw.length + "/" + kw.length
               : "⚠️ Missed · " + res.hitKw.length + "/" + kw.length);

    html += '<div class="pt-card ' + cls + '">';
    html += '<div class="pt-head"><span class="pt-no">Marking point ' + (j + 1) + '</span>'
      + '<span class="pt-badge">' + badge + '</span></div>';

    html += '<div class="pt-block user"><div class="pt-label">👤 My answer'
      + (answered ? " (box " + (i + 1) + ")" : "") + '</div>';
    html += '<div class="pt-text">' + (mine ? esc(mine) : '<span class="pt-empty">Not answered</span>') + '</div></div>';

    html += '<div class="pt-block model"><div class="pt-label">💡 Model answer</div>';
    html += '<div class="pt-text">' + res.html + '</div></div>';

    if (res.missKw.length) {
      html += '<div class="pt-kws"><span class="cap">🔑 Key words to include:</span>'
        + res.missKw.map(function (k) { return '<span class="kw-miss">' + esc(k) + '</span>'; }).join("")
        + '</div>';
    }
    html += '</div>';
  });

  html += '</div></div></div>';

  /* Review note */
  html += renderNoteBox(q, "sub", "📝 Write your own review note or mnemonic here...");
  html += '<div class="result-actions">'
    + '<button class="act-btn pass" onclick="passLevel()">✅ Perfect — back to list</button>'
    + '<button class="act-btn retry" onclick="retryLevel()">❌ Not yet — retry this level</button></div>';
  return html;
}

/* Note box: kind = obj (MCQ notebook) / sub (Written notebook) */
function renderNoteBox(q, kind, placeholder) {
  const ph = placeholder || "Note your weak points, mnemonics or approach…";
  return '<div class="note-box">'
    + '<div class="note-title">✍️ Personal summary (saved to the ' + (kind === "obj" ? "MCQ" : "Written") + ' notebook · ' + catLabel(q.type, q.category) + ')</div>'
    + '<textarea id="noteInput" class="note-area" placeholder="' + ph + '"></textarea>'
    + '<button class="note-save-btn" id="noteSaveBtn" onclick="saveNote(\'' + kind + '\')">Save note</button>'
    + '<div id="noteSavedTip"></div>'
    + '</div>';
}

/* ==================== Notebooks ==================== */
function renderNotebook() {
  const kind = state.tab === "nbObj" ? "obj" : "sub";
  const notes = getNotes(kind);
  let html = renderTabs();
  if (!notes.length) {
    return html + '<div class="nb-empty">📒 The ' + (kind === "obj" ? "MCQ" : "Written") + ' notebook is empty<br><br>'
      + 'After answering a question, write your review in the "Personal summary" box and click "Save note".<br>Entries are filed here automatically by topic.</div>';
  }
  const groups = {};
  notes.forEach(function (n) {
    const key = catLabel(n.qType, n.category);
    if (!groups[key]) groups[key] = [];
    groups[key].push(n);
  });
  Object.keys(groups).forEach(function (key) {
    html += '<div class="nb-group"><div class="nb-group-title">' + key + ' (' + groups[key].length + ')</div>';
    groups[key].forEach(function (n) {
      html += '<div class="nb-entry">'
        + '<div class="nb-entry-head"><div class="nb-entry-title">' + esc(n.title) + '</div>'
        + '<div class="nb-entry-time">' + esc(n.time) + '</div></div>'
        + '<div class="nb-entry-text">' + esc(n.summary) + '</div>'
        + '<button class="nb-del" onclick="delNote(\'' + kind + '\',' + n.id + ')">Delete</button>'
        + '</div>';
    });
    html += '</div>';
  });
  return html;
}

/* ==================== Interactions ==================== */
function switchTab(tab) {
  state.tab = tab;
  if (tab === "nbObj" || tab === "nbSub") { state.view = "notebook"; }
  else { state.cat = CATS[tab][0].key; state.view = "list"; }
  state.q = null; state.sel = [];
  render();
}
function switchCat(cat) { state.cat = cat; state.view = "list"; render(); }
function openQuestion(id) {
  state.q = questionBank.find(function (q) { return q.id === id; });
  state.sel = [];
  state.view = "question";
  render();
}
function backToList() {
  state.view = (state.tab === "nbObj" || state.tab === "nbSub") ? "notebook" : "list";
  state.q = null; state.sel = [];
  render();
}
function toggleOpt(i) {
  const multi = state.q.correct.length > 1;
  if (multi) {
    const idx = state.sel.indexOf(i);
    if (idx >= 0) state.sel.splice(idx, 1); else state.sel.push(i);
  } else { state.sel = [i]; }
  document.getElementById("app").innerHTML = renderQuestion();
}
function submitObjective() {
  if (!state.sel.length) { alert("Please select an option first"); return; }
  document.getElementById("app").innerHTML = renderObjectiveResult(state.q);
  window.scrollTo(0, 0);
}
function submitTemplate() {
  const q = state.q;
  const userTexts = [];
  document.querySelectorAll(".point-input").forEach(function (inp) { userTexts.push(inp.value.trim()); });
  const hits = q.modelAnswer.map(function (_, i) {
    const text = (userTexts[i] || "").toLowerCase();
    if (!text) return false;
    return q.keywords[i].some(function (k) { return text.indexOf(k.toLowerCase()) !== -1; });
  });
  document.getElementById("app").innerHTML = renderTemplateResult(q, userTexts, hits);
  window.scrollTo(0, 0);
}
function submitSubjective() {
  const q = state.q;
  const userTexts = [];
  document.querySelectorAll(".subj-input").forEach(function (inp) { userTexts.push(inp.value.trim()); });
  /* 每个作答框独立匹配：找出关键词命中率最高的参考答案点，且一个参考点只被占用一次 */
  const m = q.modelAnswer.length;
  const used = {};
  const match = [];
  const hits = [];
  for (let i = 0; i < userTexts.length; i++) {
    const low = userTexts[i].toLowerCase();
    let best = -1, bestRate = -1;
    for (let j = 0; j < m; j++) {
      if (used[j]) continue;
      const kw = q.keywords[j] || [];
      let c = 0;
      kw.forEach(function (k) { if (low.indexOf(k.toLowerCase()) !== -1) c++; });
      const rate = kw.length ? c / kw.length : 0;
      if (rate > bestRate) { bestRate = rate; best = j; }
    }
    if (best < 0) { best = 0; bestRate = 0; }
    used[best] = 1;
    match[i] = best;
    hits[i] = !!low && bestRate >= 0.5;
  }
  document.getElementById("app").innerHTML = renderSubjectiveResult(q, userTexts, hits, match);
  window.scrollTo(0, 0);
}
function saveNote(kind) {
  const ta = document.getElementById("noteInput");
  const text = ta.value.trim();
  if (!text) { alert("Please write your review note first"); return; }
  const q = state.q;
  const notes = getNotes(kind);
  const now = new Date();
  const pad = function (n) { return n < 10 ? "0" + n : n; };
  notes.unshift({
    id: Date.now(),
    qid: q.id,
    qType: q.type,
    category: q.category,
    title: q.title,
    summary: text,
    time: now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) + " " + pad(now.getHours()) + ":" + pad(now.getMinutes())
  });
  setNotes(kind, notes);
  document.getElementById("noteSavedTip").innerHTML =
    '<div class="note-saved-tip">✅ Saved to the ' + (kind === "obj" ? "MCQ" : "Written") + ' notebook (' + catLabel(q.type, q.category) + ')</div>';
  document.getElementById("noteSaveBtn").disabled = true;
  ta.value = "";
}
function delNote(kind, id) {
  if (!confirm("Delete this note?")) return;
  setNotes(kind, getNotes(kind).filter(function (n) { return n.id !== id; }));
  render();
}
function passLevel() { saveProgress(state.q.id); backToList(); }
function retryLevel() { state.sel = []; state.view = "question"; render(); }

/* ==================== Legacy note migration ==================== */
(function migrateOldNotes() {
  const old = lsGet("acca_aa_notes_v1");
  if (!old) return;
  try {
    const arr = JSON.parse(old) || [];
    if (!Array.isArray(arr)) return;
    const obj = getNotes("obj"), sub = getNotes("sub");
    arr.forEach(function (n) {
      if (!n || typeof n !== "object") return;
      const target = (n.qType === "objective" || n.qType === "case") ? obj : sub;
      if (!target.some(function (x) { return x.qid === n.qid && x.summary === n.summary; })) target.push(n);
    });
    setNotes("obj", obj); setNotes("sub", sub);
    lsDel("acca_aa_notes_v1");
  } catch (e) { /* ignore */ }
})();

/* ==================== Boot (with fallback — never blank) ==================== */
function boot() {
  try {
    if (typeof questionBank === "undefined" || !questionBank.length) {
      throw new Error("questionBank is empty");
    }
    render();
  } catch (e) {
    var el = document.getElementById("app");
    if (el) {
      el.innerHTML = '<div class="nb-empty" style="color:#e5534b;text-align:left;white-space:pre-wrap">'
        + '⚠️ Initialisation failed: ' + (e && (e.stack || e.message) || "unknown error")
        + '</div>'
        + '<div style="text-align:center;margin-top:16px">'
        + '<button class="note-save-btn" onclick="try{lsDel(LS_KEY);lsDel(LS_OBJ_NOTES);lsDel(LS_SUB_NOTES);}catch(x){};location.reload();">Clear local cache and reload</button>'
        + '</div>';
    }
    if (window.console) console.error(e);
  }
}
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", boot);
} else {
  boot();
}

</script>
