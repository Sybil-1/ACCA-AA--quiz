explain FIVE DEFICIENCIES in Francisco Co's system of internal control and provide a control recommendation to address each of these deficiencies. (10 marks)","modelAnswer":["Deficiency: the monthly payroll is generated automatically by the system with no checks being performed. Effect: system errors would not be identified, resulting in wages being over or underpaid. Recommendation: a senior member of the payroll team should select a sample and recalculate the gross to net pay, comparing the result to the system output.","Deficiency: the senior payroll manager amends payroll records and also reviews and authorises the bank transfer listing. Effect: there is a lack of segregation of duties and she could increase the amounts paid to certain employees. Recommendation: authorisation of the bank transfer listing should be performed by someone outside the payroll department, such as the finance director.","Deficiency: goods received are only checked to the supplier's delivery note and are not agreed to the purchase order. Effect: the company could pay for goods which were not ordered. Recommendation: goods received should be agreed to an authorised purchase order, with a signature as evidence.","Deficiency: purchase invoices are given a system-generated unique number based on the supplier code and date of entry rather than sequential numbers. Effect: the finance department cannot monitor whether all invoices have been recorded, which could result in late or missed payments. Recommendation: invoices should be sequentially numbered and the sequence checked on a regular basis.","Deficiency: invoices are not agreed to the goods received note (GRN) before entry, as they are only agreed to the purchase order and authorised. Effect: the company could pay for goods not received, resulting in overpayment to suppliers. Recommendation: invoices should be raised after the GRN and matched to the purchase order and the related GRN.","Deficiency: internal audit was unable to locate some lease agreements and ownership documents. Effect: with no evidence of ownership, the valuation and rights over property, plant and equipment could be affected. Recommendation: a register of ownership documents and lease agreements should be maintained, updated and reconciled on a regular basis.","Deficiency: capital expenditure in some cost centres has significantly exceeded the annual budget. Effect: there is a lack of control over the capital expenditure process, resulting in increased costs. Recommendation: capital purchase orders should be compared to the annual departmental budget at the authorisation stage, and expenditure in excess of budget should be specifically highlighted."],"keywords":[["automatically","payroll","check"],["segregation","senior payroll manager","authoris"],["purchase order","delivery note"],["sequential","invoice","sequence check"],["grn","match","overpay"],["ownership","register","reconcil"],["budget","capital expenditure","excess"]]},
{"id":314,"points":5,"type":"case","category":"IC","title":"Petra Co — Sales & purchases: 5 deficiencies (10 marks)","caseText":"It is 1 July 20X5. Petra Co is a company listed on a stock exchange. It manufactures handbags which it supplies to retailers across the country. The company's year end is 30 September 20X5. You are an audit supervisor with Babylon & Co, preparing the draft audit programmes and reviewing the internal controls documentation in preparation for the forthcoming interim audit.\nSales\nPetra Co carries out credit checks for all new customers. Upon passing these checks, new customers are set up by an accounting clerk in the receivables ledger master file and a credit limit is set by the finance director. The credit limits are only reviewed if an increase is requested by the customer.\nPetra Co generates revenue through visits by members of its sales department to customers' premises. When a customer places an order, sales staff check that the customer is within its credit limit and that the inventory is available and then complete a three-part pre-printed order form. One copy is left with the customer, the second is sent to the warehouse and the third to the finance department. The sales staff have monthly sales targets and are able to use their discretion in granting discounts up to a maximum of 8%. No review is undertaken of discounts granted.\nPurchases\nThe company has a purchasing department based at its head office. All members of this department have full access to the supplier master file data and are able to make changes. When goods are received from a supplier they are processed by the warehouse team, who agree the delivery to the purchase order, checking the quantity and the quality of goods, and complete a sequentially numbered goods received note (GRN). The GRNs are matched to the purchase orders and are filed in the warehouse.\nOn receipt of the purchase invoice from the supplier, a payables ledger clerk, logs them into the payables ledger using document count controls to ensure that the correct number of invoices has been input. The total on the payables ledger is not compared to the control account in the general ledger at the end of each month as the payables ledger clerk believes this process is unnecessary.","question":"[Required: (b) Identify and explain FIVE DEFICIENCIES in Petra Co's SALES AND PURCHASES systems and provide a recommendation to address each of these deficiencies. (10 marks)]","modelAnswer":["Deficiency: credit limits are only reviewed when a customer requests an increase. Effect: credit limits become out of date, which could result in irrecoverable debts or lost sales. Recommendation: credit limits should be reviewed regularly by a responsible official.","Deficiency: sales staff can grant discounts of up to 8% at their own discretion with no review. Effect: unauthorised discounts could be given, resulting in a loss of revenue. Recommendation: discounts should be authorised by a responsible official before they are granted, and discounts given should be reviewed regularly.","Deficiency: all staff in the purchasing department have full access to view and amend the supplier master file. Effect: unauthorised or incorrect changes could be made, resulting in incorrect payments. Recommendation: amendment rights should be restricted to senior staff and the monthly exception report of changes should be reviewed by a responsible official.","Deficiency: goods received notes (GRNs) are agreed to the purchase order and then filed in the warehouse, with no copy sent to the finance department. Effect: finance cannot verify goods received, so the company could pay for goods which were not received. Recommendation: a copy of the GRN should be sent to the finance department.","Deficiency: the payables ledger clerk only uses document count controls and does not reconcile the payables ledger total to the general ledger control account at the month end. Effect: document counts only confirm completeness and not accuracy; without a reconciliation errors would not be identified and payables could be misstated. Recommendation: application controls such as control totals should be used, and the payables ledger should be reconciled to the control account monthly and reviewed by a responsible official."],"keywords":[["credit limit","reviewed regularly"],["discount","authoris","8%"],["supplier master file","senior","exception report"],["grn","copy","finance"],["document count","reconcil","control totals"]]},
{"id":315,"points":5,"type":"case","category":"IC","title":"Whittaker Co — Payroll & bank: 5 deficiencies (10 marks)","caseText":"It is 1 July 20X5. You are an audit supervisor with Walsh & Co. You are currently reviewing notes in relation to the internal controls in place at your client, Whittaker Co. Whittaker Co manufactures and sells luxury bed linen wholesale to the hotel trade and direct to the public from its factory store. It has a year ending 31 August 20X5.\nPayroll\nWhittaker Co has a human resources (HR) department which is responsible for processing joiners and leavers, including preparing and sending authorised joiners forms to the payroll department so that new employees can be set up correctly on the payroll system. However, when additional staff are required at short notice, joiners forms are not completed and instead, the production supervisor notifies the payroll department by email on the day they commence employment.\nStaff are required to work overtime on a regular basis in order to meet production targets. Overtime is paid monthly in arrears, at the end of the month in which it is worked. All overtime reports are reviewed on a quarterly basis by the production supervisor after the overtime has been paid. Reviews of overtime reports are evidenced by signature of the production director.\nThe payroll system automatically calculates wages and deductions for all employees based on standing data. The standing data is reviewed regularly to ensure it is still accurate however no checks are performed on the monthly payroll calculations.\nIn May each year, all employees receive a bonus, the amount of which varies depending upon their performance. The payroll department receives written notification from the HR manager of the bonus, based only on his view of the employees' performance in the year. The bonuses for 20X5 were input into the payroll system by the payroll clerk. After May's payroll had been processed, a small number of employees notified the payroll department that the bonus they had been paid did not agree to their bonus confirmation letter. This was corrected in June 20X5.\nBank\nWhittaker Co uses an internet banking system which requires a two-step verification process. A password is required to log on to the system. An additional passcode is then required to set up new payees or to withdraw funds. The login details including the password and the passcode are saved in a shared file which is accessible to all payables ledger staff in the accounts department.\nThe accounts clerk undertakes the bank reconciliations on a weekly basis. The reconciling items are documented and sent to the financial controller for review. The financial controller only investigates the reconciling items if the sum of these items is significant.","question":"[Required: b) Identify and explain FIVE DEFICIENCIES in Whittaker Co's PAYROLL and BANK systems and provide a control recommendation to address each of these deficiencies. (10 marks)]","modelAnswer":["Deficiency: when temporary staff are taken on at short notice, no joiner form is completed and the production supervisor merely notifies the payroll department by email on the employee's first day. Effect: unauthorised individuals could be added to the payroll, increasing the risk of fictitious employees. Recommendation: all new employees should have a joiner form authorised by HR before being added to the payroll.","Deficiency: overtime reports are reviewed quarterly, after the overtime has been paid. Effect: employees could be paid for overtime not worked, increasing payroll costs. Recommendation: all overtime should be authorised by a responsible official before payment is made.","Deficiency: standing data is reviewed regularly but no checks are performed over the monthly payroll calculation. Effect: system errors would not be identified and wages could be over or underpaid. Recommendation: a senior member of staff should select a sample and recalculate the gross to net pay, comparing it to the payroll records.","Deficiency: bonuses are determined by the HR manager on his own judgement and entered by payroll clerks, with no independent review (in 20X5 the amounts paid did not agree to the confirmations). Effect: inappropriate bonuses could be paid, increasing payroll costs. Recommendation: bonuses should be determined by the production director in accordance with a written policy and, where material, formally agreed by the board of directors.","Deficiency: the internet banking log-in password and security token are stored in a shared file which all payables staff can access. Effect: unauthorised payments could be made, resulting in fraud. Recommendation: access should be restricted to authorised staff only and passwords should be changed regularly.","Deficiency: the finance director only investigates reconciling items when the amounts are significant. Effect: errors and fraud would not be identified on a timely basis. Recommendation: bank reconciliations should be reviewed monthly by a responsible officer and all reconciling items investigated, regardless of the amounts involved."],"keywords":[["joiner form","fictitious","authoris"],["overtime","authoris","before payment"],["recalculat","gross to net","check"],["bonus","production director","board"],["internet banking","password","access"],["reconcil","monthly","significant"]]},
{"id":316,"points":8,"type":"case","category":"IC","title":"Cosmic Co — Multi-cycle: 8 deficiencies","caseText":"Scenario (Cosmic Co, household appliances, y/e 30 Sept 20X5): website takes orders not integrated into inventory system; credit limits entered and not reviewed; supplier statement reconciliations stopped; supplier master file changes by purchase clerks and supervisors; invoices approved 60 days after receipt with no formal finance director review; high-value items in secure areas with one uniform four-digit code across all sites; monthly counts sometimes missed; internal audit only physically verified 20% of assets; HR delegated setting up new employees to payroll; wage rate increase notified by email; bank reconciliations every two months. (b) Identify and explain EIGHT deficiencies in internal controls and provide a recommendation for each. (16 marks)","question":"Identify and explain EIGHT deficiencies in internal control and provide a recommendation to address each deficiency.","modelAnswer":["Deficiency: the website takes customer orders but is not integrated with the inventory system. Effect: the company may accept orders for goods which are not in stock, resulting in lost sales and damage to customer goodwill. Recommendation: the website should be interfaced to the inventory system.","Deficiency: credit limits are not reviewed once they have been set. Effect: out-of-date limits can result in irrecoverable debts or lost sales. Recommendation: credit limits should be reviewed regularly by a responsible official.","Deficiency: supplier statement reconciliations are no longer performed. Effect: errors would not be identified on a timely basis. Recommendation: supplier statement reconciliations should be performed monthly and reviewed by a responsible official.","Deficiency: both purchase clerks and their supervisor are able to amend the supplier master file. Effect: unauthorised changes and incorrect payments would not be identified. Recommendation: master file amendments should be restricted to senior staff and the monthly exception report of changes should be reviewed.","Deficiency: invoices are authorised 60 days after receipt and there is no formal review by the finance director. Effect: the company could miss early settlement discounts or pay incorrect amounts. Recommendation: invoices should be paid more promptly, with the finance director authorising payment and agreeing amounts to supporting documentation.","Deficiency: the same four-digit access code is used across all sites. Effect: unauthorised individuals could enter the high value area, resulting in inventory being stolen. Recommendation: each site should have a unique access code, which is changed regularly.","Deficiency: internal audit only physically verified 20% of assets. Effect: assets could have been stolen, or obsolete assets could remain in the asset register. Recommendation: all assets should be physically verified annually and agreed to the asset register.","Deficiency: HR has delegated the set-up of new employees to the payroll department, and pay increases are only notified by email. Effect: there is a lack of segregation of duties, which could result in fictitious employees and unauthorised pay increases. Recommendation: all new employees should be approved by the HR director, and pay increases should be proposed by HR and agreed by the board.","Deficiency: bank reconciliations are only performed every two months. Effect: errors would not be identified on a timely basis. Recommendation: bank reconciliations should be prepared and reviewed monthly.","Deficiency: overtime is reviewed quarterly by the finance director after payment, so overtime is not authorised before payment. Effect: employees could be paid for work not done or at incorrect amounts, increasing payroll costs. Recommendation: all overtime should be authorised in writing by a responsible official, such as the employees' line manager, before payment."],"keywords":[["website","interfac","inventory system"],["credit limit","reviewed"],["supplier statement","reconcil","monthly"],["supplier master file","senior","exception report"],["60 days","settlement discount","authoris"],["access code","unique","regularly"],["physically verified","asset register","20%"],["segregation","hr director","board"],["bank reconcil","monthly","two months"],["overtime","authoris","quarterly"]]},
{"id":317,"points":8,"type":"case","category":"IC","title":"Harper Co — Multi-cycle: 10 deficiencies (official sample exam)","caseText":"Scenario (Harper Co, home furnishings retailer): daily sales reports reconciled to cash/credit card takings only every Friday; new corporate customers sometimes not credit checked; Sam Turner posts bank receipts, updates customer accounts and prepares the bank reconciliation; purchase orders below $5,000 not authorised; deliveries checked against the supplier delivery note but not the PO; only warehouse and finance can view completed GRNs; payables clerk uses document count controls only; payroll calculations not checked as the system is computerised; all payroll staff can change standing data; overtime reviewed quarterly by the FD after payment. (b) Identify and explain EIGHT deficiencies and provide a recommendation for each. (16 marks)","question":"Identify and explain EIGHT deficiencies and provide a recommendation for each. (16 marks)","modelAnswer":["Deficiency: the daily sales reports from each store are only agreed to cash and credit card receipts once a week, on Friday. Effect: the reconciliation is too infrequent, so errors or missing cash would not be identified on a timely basis and the risk of fraud is increased. Recommendation: the daily sales reports should be reconciled to cash and credit card receipts daily by the finance department, with differences followed up immediately and reviewed and signed by a responsible official.","Deficiency: new corporate customers are not always subject to a credit check. Effect: goods may be sold on credit to customers with poor credit ratings, resulting in irrecoverable receivables. Recommendation: all new corporate customers must be credit checked and reviewed and signed by a responsible official, such as the sales manager or director, before a receivable account is opened.","Deficiency: Sam Turner alone records bank receipts, updates the list of customer accounts and prepares the bank reconciliation. Effect: there is a lack of segregation of duties, errors would not be identified on a timely basis and the risk of fraud is increased. Recommendation: these three tasks should be performed by different members of the finance department; if this is not possible, at least the bank reconciliation should be prepared by another member of the team.","Deficiency: purchase orders below $5,000 are not authorised. Effect: purchase clerks could make purchases which are not for business purposes, or purchase goods for their own use, increasing the risk of fraud. Recommendation: all purchase orders should be authorised by a responsible official, with a tiered authorisation threshold based on value.","Deficiency: goods received are checked only to the supplier's delivery note and not to the purchase order. Effect: suppliers may deliver goods which are not ordered or in different quantities, and the company could pay for goods not ordered. Recommendation: the warehouse should agree goods to both the purchase order and the delivery note, with a signature as evidence of the check.","Deficiency: only the warehouse and the finance department can view completed goods received notes (GRNs); the purchasing department has no access. Effect: purchasing cannot monitor whether orders have been fulfilled, which could result in stock-outs affecting deliveries to customers. Recommendation: the purchasing department should be given access to view GRNs and should review unfulfilled orders regularly and follow up with suppliers.","Deficiency: the payables ledger clerk only uses document count controls when entering invoices. Effect: document counts only confirm completeness, not accuracy, so suppliers could be paid late or incorrect amounts. Recommendation: in addition to completeness checks, application controls such as control totals (or hash totals) should be used.","Deficiency: payroll calculations are performed entirely by the system with no checks being performed. Effect: system errors would not be identified and wages could be over or underpaid, damaging employee relations. Recommendation: a senior member of the payroll team should select a sample and recalculate the gross to net pay, comparing it to the payroll records, and sign to approve payment.","Deficiency: all payroll staff are able to amend employee standing data. Effect: incorrect or unauthorised changes could be made, resulting in incorrect wage payments and an increased risk of fraud. Recommendation: only senior members should be able to access standing data, protected by passwords and multi-factor authentication; if all staff need access, amendments should require authorisation by a senior member, with the system generating an exception report for regular review by a responsible official.","Deficiency: overtime reports are reviewed quarterly by the finance director after payment, so overtime is not authorised before payment. Effect: employees could be paid for work not performed or at incorrect amounts, increasing payroll costs. Recommendation: all overtime should be authorised in writing by a responsible official, such as the employees' line manager, before payment; the finance director should also review overtime reports monthly before payment."],"keywords":[["daily","reconcil","weekly"],["credit check","corporate customer"],["segregation","bank reconcil","sam turner"],["5,000","authoris","purchase order"],["purchase order","delivery note","grn"],["grn","purchasing","access"],["document count","control totals","accuracy"],["payroll","recalculat","gross to net"],["standing data","senior","exception report"],["overtime","authoris","before payment"]]},
{"id":318,"points":4,"type":"case","category":"SP","title":"Pacific Co — Revenue: substantive analytical procedures (4 marks)","caseText":"It is 1 July 20X5. Pacific Co operates a chain of 14 retail stores across the country, selling its own range of cosmetic products. You are the audit supervisor of Caribbean & Co and the final audit is due to commence shortly for the year ended 31 May 20X5. Draft financial statements show revenue of $45.2m and profit before tax of $4.1m. The following three matters have been brought to your attention:\nRevenue: The company's revenue has increased by $3.9m during the year (20X4: total revenue $41.3m). The management accounts record information for revenue by key product line, of which there are eight, and also by store. In August 20X4, Pacific Co opened a new retail store, bringing the number of stores to 14. In addition, it launched a number of new products across most of the key product lines.","question":"Required: (a) Describe SUBSTANTIVE ANALYTICAL procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to Pacific Co's revenue. (4 marks)","modelAnswer":["Compare the overall level of revenue against prior years and discuss the reasons for the increase with management, agreeing the explanation to supporting documentation, for example the new store opened in August 20X4.","Compare the overall level of revenue against the budget for the year and investigate any significant fluctuations.","Compare the revenue by product line (eight product lines) against the budget and prior year and investigate any significant fluctuations, taking into account the impact of new products launched during the year.","Calculate the gross profit margin for Pacific Co and compare this to the prior year, investigating any significant fluctuations.","Perform a proof in total of revenue: use prior year's revenue adjusted for the new store and new products to build an expectation, compare this to the actual revenue recorded in the financial statements and investigate any significant differences."],"keywords":[["prior year","increase","supporting documentation"],["budget","fluctuation"],["product line","new product"],["gross profit margin"],["proof in total"]]},
{"id":319,"points":5,"type":"case","category":"SP","title":"Vega Vista Co — Charity income (5 marks)","caseText":"It is 1 July 20X5. You are an audit manager of Sagittarii & Co. Veda Vista Co and Canopus Co are both existing clients with a financial year ended 31 March 20X5. Vega Vista Co is a not-for-profit charitable organisation which raises funds for disadvantaged families.\nIncome: Vega Vista co generates income in a number of ways. The main source of income is via an annual food and music festival held in September every year. Tickets, which cost $35, are sold in the nine-month period prior to the event and can be purchased in advance online or on the day of the event for cash. Approximately 15,000 people attended the September 20X4 event and more are anticipated for 20X5. At the event there are a number of stalls selling food and the charity receives a fixed percentage of these sundry sales. Also, during the festival, volunteers of the charity sign up individuals to make monthly donations, and these are paid by bank transfer to the charity. During the audit planning, the completeness and cut-off of income was flagged as a key audit risk.","question":"(a) Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to Vega Vista Co's income. (5 marks)","modelAnswer":["Obtain a schedule of all Vega Vista Co's income and cast & agree the total amount with G/L, TB, F/S to ensure completeness and accuracy.","Compare the total income by individual category of income (ticket sales, share of stall takings and donations) against prior years and investigate any significant differences.","Discuss with management their procedures for ensuring advance ticket sales for the September 20X5 festival are excluded from income.","Select a sample of advance ticket sales made online, agree that the transaction has been excluded from income and follow through to inclusion in deferred income.","For a sample of online sales and new donors in the year, agree the amounts to the cash book and bank statements.","Obtain a breakdown of the income and agree to supporting documentation such as ticket records to ensure accuracy.","Recalculate the income by applying the contract rate to the volume sold (number of tickets sold x $35 and the agreed percentage of stall takings) to ensure the accuracy of income."],"keywords":[["cast","agree","schedule"],["category","ticket","donation"],["advance ticket","excluded"],["deferred income"],["cash book","bank statement"],["supporting documentation","ticket"],["recalculat","contract rate","volume"]]},
{"id":320,"points":5,"type":"case","category":"SP","title":"Granstan Co — Revenue: full substantive procedures (5 marks)","caseText":"Scenario: Granstan Co sells electronic kitchen appliances from 40 stores; both business and retail customers; online orders via website with delivery/collection from stores; invoicing based on matched online order and GDN; discounts via email barcode at cash tills; monthly management accounts analyse revenue by store, product and type of customer.\n(d) Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to Granstan Co's revenue. (5 marks)","question":"Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to Granstan Co's revenue. (5 marks)","modelAnswer":["Compare the overall level of (monthly) revenue against prior years and budget and investigate any significant fluctuations/differences.","Calculate the gross profit margin and compare this to the prior year, investigating any significant fluctuations.","Perform a proof in total calculation for revenue: use prior year's revenue to build an expectation, compare to the actual revenue and investigate any significant fluctuations.","Obtain a breakdown of revenue, cast and agree the total amount with the general ledger, trial balance and draft financial statements to ensure completeness and accuracy.","Select a sample of entries in the sales ledger and compare with the sales order, GDN and sales invoice to confirm occurrence.","Select a sample of sales invoices and agree the sales prices back to the price list; recalculate the income by contract rate and volume sold to ensure the accuracy of revenue.","Select a sample of GDN both pre and post year end, follow through to the correct accounting period to ensure that cut-off has been correctly applied; select a sample of credit notes raised, trace through to the original invoice and ensure the invoice was correctly removed from sales."],"keywords":[["compare","prior year","budget"],["gross profit margin"],["proof in total"],["cast","agree","breakdown"],["sales ledger","GDN","occurrence"],["price list","recalculate","accuracy"],["cut-off","credit note"]]},
{"id":321,"points":5,"type":"case","category":"SP","title":"Encore Co — Trade receivables: valuation / allowance (5 marks)","caseText":"It is 1 July 20X5. You are an audit supervisor with Velo & Co and you are working on the final audit of Encore Co for the year ended 30 April 20X5. Encore Co is a waste management company, supplying its services to a variety of governmental and business organisations. Encore Co's draft profit before tax is $5.3m (20X4: $4.6m) and total assets are $40.1m (20X4 $33.9m). You have been provided with the following information regarding the draft financial statements.\nTrade receivables: Encore Co's credit controller left the company in January 20x5 and has only recently been replaced. The trade receivables collection period increased from 49 days as at 31 December 20X4 to 66 days as at 30 April 20X5. Year-end trade receivables amounted to $9.1m (20X4: $7.1m) and an allowance for irrecoverable receivables of $182,000 (20X4: $142,000) has been made.\n(b) Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to the VALUATION of Encore Co's trade receivables. (5 marks)","question":"Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to the VALUATION of Encore Co's trade receivables. (5 marks)","modelAnswer":["Review the aged trade receivables report and discuss the status of these balances with the credit controller to assess whether they are likely to pay.","Review customer correspondence to identify if any balances are in dispute or unlikely to be paid and discuss with management whether an allowance is required.","Review whether there are any after-date cash receipts for slow-moving receivable balances to assess the reasonableness of the allowance.","Discuss with the finance director the rationale for maintaining the allowance at the same level, in light of the increase in the receivables collection period from 49 days to 66 days.","Discuss with management and review board minutes to identify whether there are any significant concerns in relation to payments by customers and assess whether these have been considered when determining the allowance.","Obtain a breakdown of the allowance for trade receivables, recalculate it and compare to any potential irrecoverable balances to assess if the allowance is adequate."],"keywords":[["aged","credit controller"],["correspondence","dispute"],["after-date cash receipts","after date"],["finance director","collection period","allowance"],["board minutes"],["recalculate","adequate"]]},
{"id":322,"points":4,"type":"case","category":"SP","title":"Triggerfish Co — Receivables circularisation: differences (8 marks)","caseText":"Triggerfish Co manufactures hair products and its year ended on 31 May 20X5. You are controlling the audit programmes for the forthcoming year-end audit.\nTriggerfish Co-Receivables: Triggerfish Co's draft year-end trade receivables are $3.85m (20x4: $2.45m) and revenue for the year is slightly increased on 20X4. Triggerfish Co has a large number of customers with balances ranging from $5,000 to $45,000. A positive receivables circularization has been undertaken based on the year-end balances.\nDue to the increase in receivables, Triggerfish Co has recently recruited an additional credit controller to chase outstanding receivables. As a result of the additional focus on chasing outstanding receivables the finance director thinks it is not necessary to continue to maintain a significant allowance for receivables and has reduced the closing allowance from $125,000 to $5,000.","question":"Required: Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to the allowance for receivables in the current year. (4 marks)","modelAnswer":["Albacore Co (no reply received): where no response is received, this should be followed up with a further letter or a telephone call to the customer.","Albacore Co: if there is still no response, the auditor should undertake the necessary alternative procedures, for example selecting a sample of the year-end balances and agreeing them to supporting documentation such as sales invoices, GDNs and sales orders, in order to confirm existence.","Flounder Co (difference of $5,850): review customer correspondence to identify whether any balances are in dispute or unlikely to be paid, and discuss with management whether an allowance is required.","Flounder Co: if the difference arises from a timing difference, for example cash in transit, agree the receipt to the after-date cash book; if it relates to goods in transit, agree the despatch to the pre-year-end GDN.","Menhaden Co (credit balance): discuss with the credit controller or the finance department the reason for the credit balance, in order to understand how a credit balance has arisen.","Menhaden Co: review the payables ledger to identify whether the customer is also a supplier; if so, a purchase invoice may have been posted in error to the receivables ledger rather than the payables ledger, and the balance should be reclassified."],"keywords":[["no response","further letter","telephone"],["alternative procedures","sales invoice","existence"],["correspondence","dispute","allowance"],["cash in transit","goods in transit","timing"],["credit balance","credit controller"],["payables ledger","reclassif"]]},
{"id":323,"points":6,"type":"case","category":"SP","title":"Latte Co — Receivables existence & valuation (no circularisation) (6 marks)","caseText":"It is 1 July 20X5. You are an audit supervisor with Macchiato & Co currently working on the final audit of Latte Co, a supplier of catering equipment, for the year ended 31 March 20X5. Latte Co is a listed company with total assets of $22.7m and profit before tax of $3.2m. You are responsible for finalising the audit fieldwork in respect of the following:\nTrade receivables\nLatte Co's net trade receivables balance is $5.1m which comprises trade receivables of $5.5m and an allowance for receivables of $0.4m at 31 March 20X5 (20X4: receivables of $4.4m and an allowance of $0.6m). As a result of a lack of responses in prior years, the audit engagement partner has decided that a trade receivables circularisation will not be performed this year. Instead, he has asked you to identify alternative substantive procedures to confirm the existence and valuation of trade receivables.\nRequired:","question":"(a) Describe substantive procedures the auditor should perform to obtain sufficient and appropriate evidence in relation to the EXISTENCE and VALUATION of Latte Co's trade receivables. (6 marks)","modelAnswer":["Existence：Select a sample of year-end receivable balances and agree back to valid supporting documentation of GDN and sales order to ensure existence.","Valuation：Review the aged trade receivables report and discuss the status of these balances with the credit controller to assess whether they are likely to pay.","Valuation：Review customer correspondence to identify any balances which are in dispute or unlikely to be paid and discuss with management whether an allowance is required.","Valuation：Review whether there are any after-date cash receipts for slow-moving receivable balances to assess the reasonableness of the allowance.","Valuation: discuss with the finance director why the allowance for receivables is decreasing while the receivables balance is increasing.","Valuation：Obtain a breakdown of the allowance for trade receivables, recalculate it and compare to any potential irrecoverable balances to assess if the allowance is adequate.","Analytical procedures：Calculate the average receivables collection period and compare this to the prior year, investigating any significant fluctuations.","Completeness/accuracy：Obtain a breakdown of customer balances, cast & agree the total amount with G/L, TB, F/S to ensure completeness and accuracy."],"keywords":[["GDN","sales order","existence"],["aged","credit controller"],["correspondence","dispute"],["after-date cash receipts","after date"],["allowance","decreas","receivables balance"],["recalculate","adequate"],["collection period"],["cast","agree"]]},
{"id":324,"points":4,"type":"case","category":"SP","title":"Pimento Co — Trade discount receivable (4 marks)","caseText":"Scenario (Pimento Co): a trade discount from the main supplier is linked to annual purchases, reclaimed after year end based on actual volumes; Pimento Co expects to recognise a receivable of $980,000 with a corresponding cost of sales entry. (c) Describe substantive procedures on the trade discounts receivable at 31 August 20X5. (4 marks)","question":"Describe substantive procedures the auditor should perform on the trade discounts receivable at 31 August 20X5. (4 marks)","modelAnswer":["Obtain details of the client's calculation of the $980,000 trade discounts receivable, recalculate the discount receivable and agree it to inclusion in the trial balance and financial statements.","Review the supplier contract to confirm the terms and conditions of the discount receivable and that Pimento Co does qualify for an annual trade discount.","From the client's calculation schedule, agree the individual components of the discount to supporting documentation — the % discount to the supplier contract and the level of purchases to date to the detailed purchases listing.","Agree the trade discount receivable to post-year-end bank statements, credit notes or supplier statements to confirm the adjustment has been made by the supplier.","Compare the level of the discount receivable to the previous year and discuss with management any significant fluctuations."],"keywords":[["recalculate","980,000","trial balance"],["contract","qualif","terms"],["% discount","purchases listing"],["post-year-end","credit note","supplier statement"],["compare","previous year"]]},
{"id":325,"points":6,"type":"case","category":"SP","title":"Purrfect Co — Inventory valuation: Vego Dog (6 marks)","caseText":"It is 1 July 20X5. Purrfect Co manufactures and sells a variety of food for dogs and cats. Your firm, Kirano & Co, has audited the company for a number of years. You are about to commence the final audit for the year ended 31 March 20X5 and the draft financial statements show profit before tax of $23.1m and total assets of $99.2m.\nVego Dog-inventory valuation: Purrfect Co launched a new brand of vegan dog food, Vego Dog, in December 20X4 but sales have been lower than expected and the directors are considering a discounted sales price. Vego Dog products are valued using a standard costing method and the standard cost comprises raw materials labour costs and production overheads. As at 31 March 20X5, Vego Dog products with a standard cost of $2.4m were included as finished goods in inventory.","question":"(a) Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to the matters identified regarding the inventory valuation of Vego Dog products. (6 marks)","modelAnswer":["For a sample of inventory items, obtain the relevant cost sheets and agree raw material costs to recent purchase invoices, labour costs to time sheets and confirm overheads are properly allocated.","Discuss with management the basis of the standard costs, and how often these are reviewed and updated, to assess their reasonableness.","Recalculate the cost calculation to confirm that the quantity multiplied by the standard cost agrees to the $2.4m included in finished goods.","Review post year-end sales invoices to verify whether net realisable value is below cost and whether an adjustment is required, taking into account the proposed reduction in the selling price.","Review the aged inventory report to identify any slow-moving Vego Dog products and discuss with management why these items have not been written down or whether an allowance is required.","Discuss with management the basis for the NRV and agree this amount to supporting documentation to confirm the value of inventory.","Cast the schedule of total inventory and agree to the trial balance and financial statements to ensure completeness and accuracy; compare inventory days to the prior year and investigate any significant differences."],"keywords":[["cost sheets","purchase invoices","time sheets"],["standard cost","reviewed","updated"],["recalculate","quantity","2.4m"],["post year-end","net realisable value","selling price"],["aged inventory report","slow-moving"],["basis","NRV","supporting documentation"],["cast","inventory days"]]},
{"id":326,"points":3,"type":"case","category":"SP","title":"Ironman Co — Inventory: unable to attend the year-end count (3 marks)","caseText":"It is 1 July 20X5, you are an audit manager in Spidey & Co. You are currently assigned to a new audit client, Ironman Co which has a year ended 31 March 20X5. The draught financial statements show total assets of $15 million and profit before tax of $3 million. The following matters have been brought to your attention\nInventory: Spidey & Co were appointed auditors after the end of the financial year of Iron Man co. Consequently, the auditors could not attend the year-end inventory count. Inventory is included the financial statements at a value of $700,000.","question":"Required: (a) Describe substantive procedures that auditors should perform to obtain sufficient and appropriate audit evidence in relation to inventory (3 marks)","modelAnswer":["Perform test counts on a sample of inventory items at the current date and trace these back to the year-end inventory count records, in order to evaluate the accuracy of the year-end records.","Cast the schedule of total inventory and agree the total to the trial balance and financial statements to ensure completeness and accuracy.","Compare the inventory days for the current year with the prior year and investigate any significant differences.","For a sample of inventory items, obtain the cost sheets and agree raw material costs to recent purchase invoices, labour costs to time sheets and confirm overheads are properly allocated.","Review the aged inventory report to identify any slow-moving goods and discuss with management whether an allowance is required; review any inventory count report from internal audit to assess the reliability of the count records."],"keywords":[["test count","trace","year-end record"],["cast","agree"],["inventory days","compare"],["cost sheets","purchase invoices"],["aged","slow-moving","internal audit"]]},
{"id":327,"points":9,"type":"case","category":"SP","title":"Oklahoma Co — Count attendance + WIP valuation (10 marks)","caseText":"It is 1 July 20X5. You are an audit manager of Tennessee & Co and you are in charge of the final audits, for two existing clients, which are due to commence shortly.\nOklahoma Co: Inventory. Oklahoma Co is forecasting a draft year-end inventory balance of $10.2m. The company undertakes continuous production and a year-end inventory count will be carried out on 31 July 20X5 at the company's factory and warehouse. No movements of inventory will be allowed on the day of the count.\nIt is expected that there will be significant work in progress (WIP) at the year end. WIP comprises partly manufactured components. A senior member of your team is responsible for the audit of WIP and will be attending the inventory count as well as the final audit. Oklahoma Co values WIP by applying the estimated percentage of completion to the standard cost of a completed component.","question":"Required: (b) Describe the audit procedures the auditor should perform as part of the audit of Oklahoma Co BEFORE and DURING the inventory count. (6 marks)\n(c) Describe substantive procedures the auditor should perform during the final audit to obtain sufficient and appropriate audit evidence in relation to the VALUATION of Oklahoma Co's WORK IN PROGRESS. (4 marks)","modelAnswer":["Before the count：Discuss with management whether any of the warehouses are new, whether any significant changes have occurred this year with regards to inventory items, or whether any warehouses have experienced significant control issues.","Before the count：Obtain a copy of the proposed inventory count instructions, review them to identify any control deficiencies and, if any are noted, discuss them with management prior to the count.","Before the count：Discuss with management how the percentage completions of WIP are assessed.","During the count：Observe the counting teams to confirm whether the inventory count instructions are being followed correctly.","During the count: select samples of inventory and perform test counts from the inventory sheets to the physical inventory and from the physical inventory to the inventory sheets.","During the count：Observe the procedures for movements of inventory during the count to confirm that all movements have ceased.","During the count：Obtain a copy of the completed sequentially numbered inventory sheets for follow-up testing at the final audit; observe the procedures carried out by staff in assessing the level of WIP and consider the reasonableness of the assumptions used.","WIP valuation：Discuss with management the basis of WIP valuation and assess its reasonableness; obtain a sample of WIP and perform an inventory count to assess the completion level; recalculate the WIP amount using the stage of completion to confirm accuracy.","WIP valuation：Discuss with management the basis of the standard costs and how often they are reviewed and updated; obtain a breakdown of the standard costs and agree a sample of these costs to actual invoices to assess reasonableness."],"keywords":[["discuss","warehouses","changes"],["count instructions","deficiencies"],["percentage completion","WIP"],["observe","counting teams"],["test count","sheets to physical","physical to sheets"],["movements","ceased"],["sequentially numbered","assumptions"],["recalculate","stage of completion"],["standard costs","actual invoices"]]},
{"id":328,"points":6,"type":"case","category":"SP","title":"Spinach Co — Multiple warehouses: count procedures (6 marks)","caseText":"It is 1 July 20X5. You are an audit supervisor with Sweetcorn & Co and are responsible for the final audit of your existing client Spinach Co, which is due to commence in September 20X5. Spinach Co is a listed company which manufactures garden furniture. Its draft financial statements for the year ending 31 July 20X5 show revenue of $65.1m and profit before tax of $18.2m. The following matters have been brought to your attention:\nInventory count: Spinach Co is forecasting a year-end inventory balance of $9.3m. The company undertakes continuous production and full year-end inventory counts will be carried out on 31 July 20X5. Spinach Co's raw materials and finished goods inventory are stored in its six warehouses which are located across the country. The company has one factory site and it is expected that there will be no significant work in progress held at the year end. Each inventory count will be supervised by a member of Spinach Co's internal audit department. There will be no movements of goods in and out of the warehouses during the counts. Sweetcorn & Co will only attend some of the counts.\nThe largest warehouse is located at the factory site and around 10% of this warehouse space is rented out to a third-party company, which stores its inventory of cleaning products there. The finance director has explained that the third-party inventory is located in one specific area of the warehouse.\n(b) Describe the audit procedures the auditor should perform as part of the audit of Spinach Co BEFORE and DURING the inventory count. (6 marks)","question":"Describe the audit procedures the auditor should perform as part of the audit of Spinach Co BEFORE and DURING the inventory count. (6 marks)","modelAnswer":["Before the count：Discuss with management whether there are any significant changes with regards to inventory items and their locations across the six warehouses.","Before the count：Decide which of the six warehouses the audit team members will attend, basing this on the materiality and risk of each site.","Before the count: discuss with management whether inventory belonging to third parties, such as the cleaning products held in one of the factory warehouses, is stored in any of the other warehouses, and confirm that it is segregated and clearly marked.","Before the count: consider the extent to which reliance can be placed on the work of the internal audit department, who will supervise the counts.","During the count：Observe the counting process to confirm whether the inventory count instructions are being followed correctly, and observe that movements of goods in and out have ceased during the counts.","During the count：Select samples of inventory and perform test counts from inventory sheets to physical inventory and from physical inventory to inventory sheets; perform a physical inspection to identify damaged or slow-moving items; obtain a copy of the completed sequentially numbered inventory sheets for follow-up testing at the final audit."],"keywords":[["discuss","changes"],["which","warehouses","attend","materiality"],["third part","segregat","clearly marked"],["internal audit","reliance","supervis"],["observe","instructions","movements ceased"],["test counts","damaged","slow-moving"]]},
{"id":329,"points":5,"type":"case","category":"SP","title":"Cookit Co — Inventory valuation: NRV (5 marks)","caseText":"It is 1 July 20X5. Cookit Co owns ten shops selling kitchen equipment. Your firm, Beeny & Co, is about to commence the final audit for the year ended 31 May 20X5.\nInventory: Cookit Co sells a range of cookery products endorsed by a famous TV chef, Remy Gusteau. In February 20X5, the TV company that produced his show cancelled the programme which led to a reduction in demand for Remy Gusteau products. Cookit Co stopped purchasing these goods in March 20X5. Total inventory in the draft financial statements for the year ended 31 May 20X5 is $4.25m. Cookit Co's system-generated inventory valuation report shows that this includes Remy Gusteau products at a cost of $1.7m. A member of the audit team attended the year-end inventory count of Cookit Co.","question":"(a) Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to the VALUATION of Cookit Co's inventory. (5 marks)","modelAnswer":["Calculate the inventory holding period and compare with the prior year, investigating any significant differences.","Compare the overall level of inventory against prior years and budget and investigate any significant fluctuations/differences.","Cast the schedule of total inventory and agree the total to the trial balance and financial statements to ensure completeness and accuracy.","Select a sample of inventory sheets (count sheets) and perform an inventory count to ensure all inventory recorded exists.","Select a sample of inventory at the year end and agree the cost from the records to the purchase invoice to ensure that the cost is correctly stated.","Review the aged inventory report to identify any slow-moving Remy Gusteau products and discuss with management why these items have not been written down or whether an allowance is required.","Review post year-end sales invoices to verify if NRV is lower than cost or if an adjustment is required; review board minutes for discussion on the impact of falling demand for Remy Gusteau products and whether an allowance is required."],"keywords":[["holding period","holding days"],["compare","prior years","budget"],["cast","agree"],["count sheets","exist"],["purchase invoice","cost"],["aged inventory report","slow-moving"],["post year-end sales invoices","post year end","board minutes"]]},
{"id":330,"points":5,"type":"case","category":"SP","title":"Heron Co — PPE additions & capitalisation (5 marks)","caseText":"It is 1 July 20X5. You are an audit supervisor of Owl & Co, responsible for the final audit of Heron Co for the year ended 31 May 20X5 which is due to commence shortly. Heron Co is a manufacturer of colour dyes used in the textile industry. Its draft financial statements show total assets of $65.4m and profit before tax of $8.9m. The following matters have been brought to your attention:\nAdditions to plant and equipment: Heron Co incurred significant capital expenditure in the year as it purchased a new manufacturing line. All costs incurred in the purchase and installation of the manufacturing line have been recognised as plant and equipment within non-current assets. The amount capitalised of $3.6m includes the purchase price of $2.7m, delivery and installation costs of $0.3m, refundable purchase tax of $0.5m and $0.1m incurred in training staff on how to operate the new plant and equipment.\nIn addition to the $3.6m capitalised, Heron Co incurred costs of $0.2m testing the quality of the dye being produced by the new manufacturing line. The finance director has also capitalised this cost within plant and equipment. Heron Co started using the new manufacturing line in December 20X4 and it has a useful life of eight years.","question":"Required: (a) Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to the matters identified regarding Heron Co's ADDITIONS to plant and equipment. (5 marks)","modelAnswer":["Obtain a list of additions to PPE, cast and agree the total amount with G/L, TB, F/S to ensure completeness and accuracy.","Select a sample from the asset register and perform a physical inspection to ensure the existence of the new manufacturing line.","Select a sample of additions and compare the purchase price of $2.7m and the delivery and installation costs of $0.3m to purchase invoices to confirm the cost is accurate.","Review the breakdown of the purchase price of $2.7m, installation costs of $0.3m and testing costs of $0.2m to confirm they have been capitalised rather than expensed.","Discuss with management the refundable purchase tax of $0.5m and the training costs of $0.1m, and request that they are expensed to profit or loss as they are not eligible for capitalisation.","Discuss with management the basis of the eight-year useful life and compare with the industry to confirm its reasonableness.","Recalculate the depreciation charge to confirm that depreciation only commenced from December 20X4 when the asset was brought into use."],"keywords":[["cast","agree","additions"],["physical inspection","existence"],["purchase price","installation","invoice"],["capitalis","testing cost"],["refundable purchase tax","training","expensed"],["useful life","eight-year"],["recalculate","depreciation","December 20X4"]]},
{"id":331,"points":6,"type":"case","category":"SP","title":"Everest Co — PPE: earthquake repairs / additions / disposals (6 marks)","caseText":"It is 1 July 20X5. You are an audit supervisor of Denali & Co and the final audit of Everest Co for the year ended 31 May 20X5 is due to commence. Everest Co manufactures garden furniture. Its draft financial statements show total assets of $32.2m and profit before tax of $1.3m. The following matters have been brought to your attention:\nProperty, plant and equipment (PPE): Everest Co has three factories located across the country, a head office and one central warehouse. In March 20X5 an earthquake occurred near the site of one of the factories. The factory was significantly damaged; however, the company's other properties and inventory were unaffected. The company spent $0.8m repairing the factory, of which $0.5m was recognised in PPE. It also purchased new plant and machinery costing $0.6m to replace items which had to be scrapped as they were damaged beyond repair.","question":"Required: (a) Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to the matters identified regarding Everest Co's property, plant and equipment. (6 marks)","modelAnswer":["Obtain a list of additions to PPE, cast and agree the total amount with G/L, TB, F/S to ensure completeness and accuracy.","Select a sample of additions from the assets register and perform a physical inspection to ensure existence.","Inspect the purchase price of the new plant and machinery of $0.6m and compare with the contract and invoices to confirm the cost is accurate.","Review a breakdown of the $0.5m of repair costs capitalised and inspect the nature of the costs to ensure they should be capitalised rather than expensed as repairs and maintenance.","Discuss with management the reason for capitalising $0.5m of the $0.8m repair costs to PPE and assess its reasonableness.","Review the non-current asset register to confirm that the assets disposed of during the year have been removed from the register.","Select a sample of PPE and recalculate the depreciation charge to ensure the non-current assets register is correct; review the disclosure of additions and disposals in the draft financial statements to ensure compliance with IAS 16."],"keywords":[["cast","agree"],["physical inspection","existence"],["0.6m","contract","invoice"],["0.5m","breakdown","capitalis"],["discuss","repair","reasonable"],["non-current asset register","dispos","removed"],["recalculate","depreciation","IAS 16"]]},
{"id":332,"points":6,"type":"case","category":"SP","title":"Encore Co — Vehicle trade-in: addition & disposal (6 marks)","caseText":"Vehicle additions and disposals. On 1 February 20X5, Encore Co replaced 20 of its recycling vehicles. The old vehicles had a carrying amount of $1.8m, as recorded in the non-current assets register and were given in part-exchange against new vehicles costing $4.6m. Cash consideration of $3.9m was also paid.","question":"Required: (a) Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to Encore Co's vehicle additions and disposals. (6 marks)","modelAnswer":["Cast the schedule of additions to vehicles and agree the total to the G/L, TB and F/S to ensure completeness and accuracy.","Obtain a list of new vehicles from the assets register and perform a physical inspection to ensure existence.","For a sample of new vehicles on the schedule of additions, agree the cost of $4.6m to the purchase invoice to confirm accuracy.","Agree the cash payment of $3.9m to the cash book and bank statement.","Recalculate the loss on disposal of $1.1m and agree it to the trial balance and statement of profit or loss; confirm the old vehicles with a carrying amount of $1.8m were removed from the non-current assets register.","Recalculate the depreciation expense, confirming depreciation was based on the old vehicles until 1 February 20X5 and on the cost of the new vehicles after that date; in light of the loss on disposal, review the depreciation rates on the remaining vehicles to establish their reasonableness."],"keywords":[["cast","additions","vehicles"],["physical inspection","existence"],["purchase invoice","4.6m"],["cash payment","3.9m","bank statement"],["loss on disposal","1.1m","removed"],["recalculate","depreciation","1 February","rates"]]},
{"id":333,"points":6,"type":"case","category":"SP","title":"Ironman Co — Depreciation not charged for several years (6 marks)","caseText":"It is 1 July 20X5. you are an audit manager in Spidey & Co. You are currently assigned to a new audit client, Ironman Co which has a year ended 31 March 20X5. The draught financial statements show total assets of $15 million and profit before tax of $3 million. The following matters have been brought to your attention\nDepreciation: Depreciation has not been provided on any non-current asset for a number of years. When asked why no depreciation is charged, the finance director gave the following response:\n'Property prices generally increase over time, so we don't depreciate buildings. Anyhow, if we had the buildings revalued, we would need to constantly amend the depreciation calculation to reflect the new valuation so it's easier and less time consuming not to bother with it at all. Other assets are not as significant in value and we usually sell them rather than scrap them so the losses on disposal are minimal and that's why we don't bothered appreciating those. Our previous auditors never questioned our approach so it can't be that much of a problem'.","question":"Required: (a) Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to depreciation (6 marks)","modelAnswer":["Discuss with management the rationale for why they have not charged depreciation and assess its reasonableness — IAS 16 requires all PPE with a finite useful life, including buildings, to be depreciated.","Review profits and losses on disposal of assets disposed of in the year to assess the reasonableness of the depreciation policies.","Using an appropriate depreciation rate, calculate the estimated depreciation for the current year and prior years to quantify the misstatement.","Discuss with management the basis of the useful lives of PPE and agree to supporting documentation.","Inspect any valuation report to assess whether the cost is significantly higher than the valuation, which may indicate impairment.","Select a sample from the asset register and compare the cost recorded to the purchase invoice to confirm the cost is accurate.","Physically inspect the assets for signs of damage which may indicate impairment; calculate the recoverable amount and compare with the carrying amount to determine whether the assets are impaired and should be written down."],"keywords":[["rationale","IAS 16","depreciat"],["disposal","profits and losses"],["calculate","prior years"],["useful life","supporting documentation"],["valuation report"],["purchase invoice","cost"],["impair","recoverable amount"]]},
{"id":334,"points":5,"type":"case","category":"SP","title":"Gooseberry Co — Change in depreciation estimate (5 marks)","caseText":"You are an audit manager of Cranberry & Co and you are currently responsible for the audit of Gooseberry Co, a company which develops and manufactures health and beauty products and distributes these to wholesale customers. Its draft profit before tax is $6.4m and total assets are $37.2m for the financial year ended 31 January 20X8. The final audit is due to commence shortly and the following matters have been brought to your attention:\nDepreciation: Gooseberry Co has a large portfolio of property, plant and equipment (PPE). In March 20X7, the company carried out a full review of all its PPE and updated the useful lives, residual values, depreciation rates and methods for many categories of asset. The finance director felt the changes were necessary to better reflect the use of the assets. This resulted in the depreciation charge of some assets changing significantly for this year.","question":"Required: (b) Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to the matters identified regarding depreciation of property, plant and equipment. (5 marks)","modelAnswer":["Discuss with management the rationale for the changes to PPE depreciation rates, useful lives and residual values, and ascertain how these changes were arrived at.","Confirm the reasonableness of these changes by comparing the revised depreciation rates, useful lives and methods applied to PPE to industry averages and the auditor's knowledge of the business.","Perform a proof in total calculation of depreciation and compare it to the actual charge, investigating any significant differences.","Select a sample of PPE and recalculate the depreciation charge to ensure that the non-current assets register is correct.","Review profits and losses on disposal of assets disposed of in the year to assess the reasonableness of the depreciation policies; review the disclosure of the change in accounting estimate in the financial statements."],"keywords":[["rationale","changes","rates"],["industry averages","reasonable"],["proof in total","depreciation"],["recalculate","sample"],["disposal","disclosure"]]},
{"id":335,"points":6,"type":"case","category":"SP","title":"Danube Co — Land & buildings: revaluation model (6 marks)","caseText":"The company has a large head office and 18 warehouses. You are an audit supervisor of Mississippi & Co and the final audit for the year ended 31 March 20X5 is due to commence shortly. The draft financial statements show total assets of $198.5m and profit before tax of $56.1m. The following three matters have been brought to your attention:\nLand and buildings: Danube Co historically recorded all property, plant and equipment (PPE) at cost less accumulated depreciation. However during the year, management decided to change the accounting policy for land and buildings from the cost model to the revaluation model. The finance director hired an external independent valuer to undertake the valuation of al land and buildings, and this took place in July 20X4. Depreciation is calculated monthly on a pro rata basis. Danube Co's year-end balance for PPE includes land and buildings of $79.2m (20X4: $64m).","question":"Requirement: (a) Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to Danube Co's land and buildings. (6 marks)","modelAnswer":["Discuss with management the reason for changing from the cost model to the revaluation model and assess its reasonableness.","Agree the revalued amounts to the valuation report and the financial statements to ensure all revalued amounts are accurate.","Review the assumptions and method adopted by the valuer in undertaking the revaluation to confirm their reasonableness.","Assess the reasonableness of the valuer, considering their experience, independence, scope of work and assumptions used.","Recalculate the total revaluation adjustment and agree it has been correctly recorded in the revaluation surplus.","Recalculate the depreciation charge for the year and confirm depreciation is based on cost before revaluation and on the revalued amount on a pro rata basis thereafter.","Obtain a schedule of all land and buildings, cast and agree to the trial balance and financial statements; for a sample of land and buildings from the non-current assets register, physically verify existence."],"keywords":[["cost model","revaluation model"],["valuation report","agree"],["assumptions","method","valuer"],["independence","experience"],["revaluation surplus","recalculate"],["depreciation","pro rata"],["cast","physical","exist"]]},
{"id":336,"points":5,"type":"case","category":"SP","title":"Pacific Co — Trade payables & accruals: completeness (5 marks)","caseText":"It is 1 July 20X5. Pacific Co operates a chain of 14 retail stores across the country, selling its own range of cosmetic products. You are the audit supervisor of Caribbean & Co and the final audit is due to commence shortly for the year ended 31 May 20X5. Draft financial statements show revenue of $45.2m and profit before tax of $4.1m. The following three matters have been brought to your attention:\nTrade payables and accruals: As part of the year-end process, Pacific Co's payables ledger is closed at the end of the day on 31 May. Any invoices received after this date, relating to goods received before the year end, are recorded in the goods received not invoiced (GRNI) accrual.\nThis year, the payables ledger was kept open in error until 1 June 20X5. As a result, a significant payment run for suppliers made by bank transfer on 1 June 20X5 was recorded in the 20X5 payables ledger. The finance director has confirmed that the year-end trade payables balance was corrected using a journal.","question":"Required: (a) Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to the COMPLETENESS of Pacific Co's trade payables and accruals. (5 marks)","modelAnswer":["Compare the total trade payables and list of accruals against the prior year and investigate any significant differences.","Discuss with management the process they have undertaken to quantify the overstatement of trade payables arising from the cut-off error.","Select a sample of purchase invoices received after the year end and review the related goods received notes (GRNs) to confirm that the goods are recorded in the correct period, i.e. the goods received not invoiced accrual.","Select a sample of payable balances and perform a trade payables external confirmation, following up any non-replies.","Obtain supplier statements and reconcile these to the purchase ledger balances, investigating any missing items.","Select a sample of GRNs before and after the year end and follow through to inclusion in the correct period's payables balance to ensure correct cut-off; review after-date payments from the cash book and, where they relate to the current year, follow through to the purchase ledger or accrual listing."],"keywords":[["compare","prior year","accruals"],["cut-off","overstat","quantif"],["purchase invoice","grn","goods received not invoiced"],["confirmation","non-replies"],["supplier statements","reconcile"],["cut-off","after-date payments","cash book"]]},
{"id":337,"points":5,"type":"case","category":"SP","title":"Cookit Co — Trade payables: completeness (no circularisation) (5 marks)","caseText":"It is 1 July 20X5. Cookit Co owns ten shops selling kitchen equipment. Your firm, Beeny & Co, is about to commence the final audit for the year ended 31 May 20X5.\nInventory: Cookit Co sells a range of cookery products endorsed by a famous TV chef, Remy Gusteau. In February 20X5, the TV company that produced his show cancelled the programme which led to a reduction in demand for Remy Gusteau products. Cookit Co stopped purchasing these goods in March 20X5. Total inventory in the draft financial statements for the year ended 31 May 20X5 is $4.25m. Cookit Co's system-generated inventory valuation report shows that this includes Remy Gusteau products at a cost of $1.7m. A member of the audit team attended the year-end inventory count of Cookit Co.\n(b) Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to the COMPLETENESS of Cookit Co's trade payables. (5 marks)","question":"Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to the COMPLETENESS of Cookit Co's trade payables. (5 marks)","modelAnswer":["Calculate trade payables days and compare to prior years, investigating any significant difference, in particular the decrease from 72 days to 53 days.","Compare the total trade payables and list of accruals against the prior year and investigate any significant differences.","Obtain a listing of trade payables, cast the total and agree to the G/L, TB and F/S to ensure completeness.","Obtain supplier statements and reconcile these to the purchase ledger balances, investigating any missing items.","Select a sample of GRNs before and after the year end and follow through to inclusion in the correct period's payables balance to ensure correct cut-off.","Review after-date payments from the cash book; where they relate to the current year, follow through to the purchase ledger or accrual listing to ensure they are recorded in the correct period."],"keywords":[["payable days","72","53"],["compare","prior year"],["cast","agree","listing"],["supplier statements","reconcile"],["GRN","cut-off"],["after-date payments","accrual listing"]]},
{"id":338,"points":3,"type":"case","category":"SP","title":"Airsoft Co — Directors remuneration (3 marks)","caseText":"Airsoft Co is a listed company which manufactures stationery products. The company's profit before tax for the year ended 31 December 20X6 is $16.3m and total assets as at that date are $66.8m. You are an audit supervisor of Biathlon & Co and you are currently finalising the audit programmes for the year-end audit of your existing client Airsoft Co. You attended a meeting with your audit manager where the following matters were discussed:\nDirectors' remuneration: Airsoft Co's board is comprised of eight directors. Their overall remuneration consists of two elements: an annual salary, paid monthly; and a significant annual discretionary bonus, which is paid in a separate payment run on 20 December. All remuneration paid to directors is included within wages and salaries. Local legislation requires disclosure of the overall total of directors' remuneration broken down by element and by director","question":"Required: (d) Describe substantive procedures the auditor should perform to confirm the directors' remuneration included in the financial statements at the year end. (3 marks)","modelAnswer":["Obtain a schedule of directors' remuneration, split by salary and by the bonus paid in December, and cast the schedule, agreeing the total to the G/L, TB and F/S to ensure accuracy.","Obtain a written representation from management confirming the completeness of directors' remuneration including the bonus.","Confirm the amount of salary and bonus paid by agreeing the payments to the cash book and bank statements.","Recalculate the salary and bonus and compare with supporting documentation such as service contracts and board minutes to ensure accuracy.","Review the disclosures made in relation to directors' remuneration and assess whether they comply with the requirements of local legislation, including disclosure by category and by individual director."],"keywords":[["schedule","salary","bonus","cast"],["written representation","completeness"],["cash book","bank statement"],["recalculate","service contract","board minutes"],["disclos","legislation","director"]]},
{"id":339,"points":5,"type":"case","category":"SP","title":"Heron Co — Bank balance (5 marks)","caseText":"It is 1 July 20X5. You are an audit supervisor of Owl & Co, responsible for the final audit of Heron Co for the year ended 31 May 20X5 which is due to commence shortly. Heron Co is a manufacturer of colour dyes used in the textile industry. Its draft financial statements show total assets of $65.4m and profit before tax of $8.9m. The following matters have been brought to your attention:\nBank balances: The bank figure included in Heron Co's draft financial statements comprises four bank account balances: an overdraft of $2.4m which is the company's main current account and a total of $0.6m relating to three savings accounts. The finance director has informed the audit team that all four accounts have been reconciled as at the year end.","question":"Required: Describe substantive procedures the auditor should perform to obtain sufficient and appropriate audit evidence in relation to Heron Co's bank balances. (5 marks)","modelAnswer":["Obtain a bank confirmation letter directly from the banks for all four accounts and check the accuracy of the balances confirmed.","Trace all of the outstanding deposits to the pre year-end cash book and the post year-end bank statement.","Trace all outstanding/unpresented cheques through to the pre year-end cash book and the post year-end bank statement.","Verify the reconciliations' balance per cash book to the year-end cash book and agree the balance per bank statement to the bank confirmation letter.","Examine the bank confirmation letter for details of any security provided by Heron Co; enquire whether the bank overdraft of $2.4m can be renewed; review the financial statements to ensure the balances are classified appropriately between current assets and current liabilities."],"keywords":[["bank confirmation","four accounts"],["outstanding deposits","cash book","bank statement"],["unpresented cheque","outstanding"],["reconciliation","balance per"],["security","overdraft","renewed","classif"]]},
