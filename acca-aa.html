{"id":204,"type":"template","category":"SP","title":"Level: Inventory — complete substantive procedures template (7 procedures)","caseText":"","question":"Recall the complete template of substantive procedures for Inventory.","labels":["1. AP — trend analysis","2. Cast the total","3. Inventory count — Existence","4. Initial amount — Cost","5. NRV — impairment","6. Slow-moving items / ageing","7. WIP — work in progress"],"modelAnswer":["Compare the inventory holding days for the current year with the prior year and investigate any significant differences.","Cast the schedule of total work in progress and finished goods and agree the total to the trial balance and the financial statements, to confirm completeness and accuracy.","Select a sample of items from the inventory count sheets and perform test counts at the inventory count, to confirm that all inventory recorded in the accounting records actually exists.","For a sample of inventory items, obtain the relevant cost sheets and agree the raw material costs to recent purchase invoices and the labour costs to time sheets, and confirm that overheads have been properly allocated (a manufacturer). Alternatively, select a sample of inventory at the year end and agree the cost per the records to purchase invoices, to confirm that cost is correctly stated (a retailer).","Discuss with management how they assess scrap value and agree this amount to current market prices, to assess the reasonableness of the estimate. In addition, review post year-end sales invoices to verify whether net realisable value is below cost and whether an adjustment is required.","Review the aged inventory report to identify any slow-moving goods and discuss the position with management, to verify whether net realisable value is below cost and whether an adjustment is required.","Percentage of completion: discuss with management the basis on which work in progress is valued and assess its reasonableness; obtain a sample of work in progress, perform inventory count procedures and assess the level of completion. Standard costs: discuss with management the basis of the standard costs and how often these are reviewed and updated; obtain a breakdown of the standard costs and agree a sample of these costs to actual invoices."],"keywords":[["holding days","prior year"],["cast","wip","trial balance"],["count","exist"],["cost sheet","purchase invoice","time sheet"],["nrv","post year","market price"],["aged","slow-moving"],["wip","completion","standard cost"]]},
{"id":205,"type":"template","category":"SP","title":"Level: Trade Receivables — complete substantive procedures template (4 procedures)","caseText":"","question":"Recall the complete template of substantive procedures for Trade Receivables.","labels":["1. AP — ratio analysis","2. Cast the total","3. Confirmation — Existence (including alternative procedures)","4. Allowance for receivables"],"modelAnswer":["Calculate the average trade receivables days and compare this to the prior year, and investigate any significant differences.","Obtain a list of trade receivables balances, cast the list and agree the total to the sales ledger control account and the trial balance, to confirm completeness.","Select a representative sample of year-end balances and perform a positive trade receivables confirmation; for any non-replies, send a reminder letter to follow up. Alternative procedures where the response rate is low: select a sample of year-end receivable balances and agree them back to valid supporting documentation such as goods despatch notes and sales orders, to confirm existence.","Review the aged trade receivables report and discuss the status of the outstanding balances with the credit controller, to assess whether they are likely to be paid. Review customer correspondence to identify any balances which are in dispute or unlikely to be paid, and discuss with management whether an allowance is required. Review whether there have been any after-date cash receipts in respect of slow-moving balances, to assess the reasonableness of the allowance. Obtain a breakdown of the allowance, recalculate it and compare it to potential irrecoverable balances, to assess whether the allowance is adequate."],"keywords":[["receivable days","prior year"],["cast","control account","trial balance"],["confirmation","reminder","gdn"],["aged","allowance","after date","recalculate"]]},
{"id":206,"type":"template","category":"SP","title":"Level: Exceptions on receivables confirmations (3 types of exception)","caseText":"","question":"Recall the procedures for dealing with the three types of exception arising on the trade receivables confirmation exercise.","labels":["1. No reply","2. Reply with a difference (confirmed balance below the recorded balance)","3. Credit balance"],"modelAnswer":["Follow up the non-reply with a further letter or a telephone call. If there is still no response, the auditor should undertake the necessary alternative procedures, for example agreeing the balance to supporting documentation such as goods despatch notes and sales orders.","Disputed amount: review customer correspondence to identify whether any balances are in dispute or unlikely to be paid, and discuss with management whether an allowance is required. Timing difference: for cash in transit, agree the amount to post year-end cash receipts in the cash book; for goods in transit, agree the item to a pre year-end goods despatch note.","Discuss the reason for the credit balance with the credit controller or the finance department, to understand how the credit balance has arisen. Review the payables ledger to identify whether the customer is also a supplier; if so, a purchase invoice may have been posted in error to the receivables ledger rather than the payables ledger, and a transfer should be made."],"keywords":[["letter","phone","alternative"],["dispute","cash in transit","goods in transit"],["credit balance","payables ledger","supplier"]]},
{"id":207,"type":"template","category":"SP","title":"Level: PPE — complete substantive procedures template (8 procedures)","caseText":"","question":"Recall the complete template of substantive procedures for Property, Plant and Equipment.","labels":["1. Cast the total","2. Physical inspection — Existence","3. Initial cost — Accuracy","4. Capitalisation","5. Repairs and maintenance","6. Depreciation — reasonableness","7. Depreciation — accuracy","8. Disposal"],"modelAnswer":["Obtain a list of additions to property, plant and equipment, cast the list and agree the total amount to the general ledger, the trial balance and the financial statements, to confirm completeness and accuracy.","Select a sample of assets from the non-current asset register and physically inspect them at the client's premises, to confirm existence and to assess their condition.","Select a sample of additions from the asset register and agree the cost recorded to the supplier's purchase invoice, to confirm that cost is accurately stated.","Review the breakdown of the costs incurred to confirm that expenditure which should be capitalised has been capitalised rather than expensed, and equally that revenue expenditure has been expensed rather than capitalised, in accordance with IAS 16.","Review the contract to confirm the total cost, the period which it relates to and the services which are covered. Discuss the treatment with the finance director and confirm that amounts relating to future periods are recorded as a prepayment rather than expensed in full.","Discuss the useful economic lives of the assets with management and compare them with the industry average, to assess the reasonableness of the depreciation charge. Review the profits and losses arising on disposals and the depreciation rates applied to existing assets, to establish whether they are reasonable.","Select a sample of assets and recalculate the depreciation charge, to confirm that the non-current asset register is correct. Confirm that depreciation commenced only from the date on which the asset was brought into use. Perform a proof in total calculation of depreciation, compare the result to the actual charge, and investigate any significant difference.","Select a sample of disposals and agree the sale proceeds to the cash book and the bank statement. Recalculate the accumulated depreciation on the assets disposed of and confirm that they have been removed from the asset register. Recalculate the profit or loss on disposal and agree it to the statement of profit or loss."],"keywords":[["cast","addition","general ledger"],["physical inspection","assets register","existence"],["purchase invoice","cost","accurate"],["capitalised","expensed"],["contract","prepayment"],["useful life","reasonableness","disposal"],["recalculate","proof in total","depreciation"],["proceeds","cash book","profit or loss"]]},
{"id":208,"type":"template","category":"SP","title":"Level: Trade Payables — complete substantive procedures template (8 procedures)","caseText":"","question":"Recall the complete template of substantive procedures for Trade Payables. Hint on circularisation: for existence select large or high balances; for completeness select small, zero or high-volume balances.","labels":["1. AP — trend analysis","2. AP — ratio analysis","3. Cast the total","4. Confirmation — Completeness","5. Supplier statement reconciliation","6. Cut-off","7. Late close-off (overstatement)","8. Early close-off (understatement)"],"modelAnswer":["Obtain a list of trade payables and compare the balance to prior years and to the budget, and investigate any significant fluctuations or differences.","Calculate the trade payables days and compare this to the prior year, and investigate any significant fluctuations.","Obtain a listing of trade payables, cast the total and agree it to the general ledger, the trial balance and the financial statements, to confirm completeness.","Select a sample of payable balances and perform a trade payables external confirmation. The sample should focus on small or zero balances and on suppliers with a high volume of transactions rather than only the largest balances, because the objective here is completeness. Follow up any non-replies.","Obtain supplier statements and reconcile these to the balances in the purchase ledger, and investigate any items which appear on the statement but not in the purchase ledger, as these may represent unrecorded liabilities.","Select a sample of goods received notes issued before and after the year end and follow them through to inclusion in the correct period's payables balance, to confirm that cut-off is correct. Review after-date payments in the cash book; where these relate to the current year, follow them through to the purchase ledger.","Discuss with management the process they have undertaken to quantify the overstatement of trade payables caused by the cut-off error. Select a sample of purchase invoices received in the period shortly after the year end and confirm that they are recorded in the correct period.","Discuss with management the process they have undertaken to quantify the understatement of trade payables caused by the cut-off error. Select a sample of purchase invoices received between the close-off date and the year end and review the related goods received notes, to confirm that they are recorded in the correct period."],"keywords":[["compare","prior year","fluctuation"],["payable days"],["cast","general ledger"],["confirmation","follow up","completeness"],["supplier statement","reconcile"],["grn","cut-off","after date"],["overstatement","after the year end","correct period"],["understatement","grn","correct period"]]},
{"id":209,"type":"template","category":"SP","title":"Level: Provisions — complete substantive procedures template (6 procedures)","caseText":"","question":"Recall the complete template of substantive procedures for Provisions. Note: a provision does not arise from routine trading transactions, so analytical procedures must NOT be used.","labels":["1. Present obligation","2. Probability of an outflow","3. Cast the total + completeness","4. Accuracy","5. Specific types (restructuring / redundancy / legal claims)","6. Disclosure"],"modelAnswer":["Review the board minutes and discuss with management to establish the details of the event, and assess whether a present obligation has arisen as a result of a past event.","Review the correspondence with the lawyers and the board minutes, to confirm the existence of the obligation and the probability of the payment being required.","Obtain a schedule of provisions, cast the schedule to confirm its accuracy, and agree the total to the trial balance and the draft financial statements to confirm completeness. Obtain a written representation from management confirming the completeness of provisions and contingent liabilities.","Review after-date payments and compare the actual amounts paid to the amounts recorded, to assess whether the provision is reasonable.","Restructuring: for the costs included within the provision, agree the amounts to supporting documentation such as purchase invoices or contracts, to confirm the accuracy of the provision. Redundancy: recalculate the redundancy provision and agree it to supporting documentation such as the employee contracts, to confirm accuracy. Legal claims: review the correspondence with the lawyers to establish the likelihood and the amount of the potential payment.","Review the disclosure of the provision to ensure that it is in accordance with the requirements of IAS 37 on provisions, contingent liabilities and contingent assets. Note: a provision does not arise from routine trading transactions, so analytical procedures are not appropriate as a substantive procedure for provisions."],"keywords":[["board minutes","present obligation"],["lawyer","probability"],["cast","written representation","completeness"],["after date","compare","reasonable"],["restructur","redundancy","legal"],["disclosure","ias 37","contingent"]]},
{"id":301,"points":7,"type":"case","category":"IC","title":"Hummingbird Scents Co — Sales system: 7 deficiencies + recommendations (14 marks)","caseText":"It is 1 July 20X5. Hummingbird Scents Co (Hummingbird) manufactures and sells luxury toiletries; the company has been trading for over 20 years and its year end is 30 April 20X5. Hummingbird sells products to trade customers via its own website; this represents 60% of revenue. Remaining revenue is generated by contracts to supply toiletries to hotels. Below is a description of the sales system.\nHotel revenue\nThe hotel revenue is made up of four key customers. Hummingbird has one sales clerk, Brenda, who maintains all aspects of this revenue stream; Brenda receives customer orders, raises sales invoices and processes payments. In raising invoices, the sales system automatically inserts the online trade customer prices for products. However, each hotel customer has contracted prices which are lower than the online prices and hence Brenda manually edits the invoices prior to despatch.\nOnline revenue\nNew trade customers are set up in the sales ledger master file, upon passing suitable credit checks, and the finance director sets a credit limit at this stage. Customers place online orders up to their pre-set credit limit; they receive an email confirmation and the sales order interfaces into the despatch system. The order number is linked to the customer account number. Goods are despatched daily with a goods despatched note which is referenced to the sales order number but are not sequentially numbered. Hummingbird used to despatch goods via a reliable national courier company. However, to reduce costs they have changed to a cheaper local courier and some orders have been delivered to customers late.\nTrade customers' sales invoices are automatically generated by the system on the day the online order is placed. The prices are inserted in accordance with the website rates. Occasionally Hummingbird makes special offers or discounts sales; when this occurs, the master file data has to be amended to ensure that the correct prices are used on invoices. This task is usually performed by a senior sales ledger clerk.\nRevenue and receivables records\nOn a monthly basis statements are sent to the hotel customers; a number of trade customers have been requesting monthly statements and Hummingbird is considering this request. The company only reconciles the sales ledger control account at the end of April in order to verify the year-end balance.\nAs the external auditor of Hummingbird Co, write a report to management in respect of the sales system described above which:","question":"(i) Identifies and explains SEVEN deficiencies in the sales system; and\n(ii) Provides a recommendation to address each of these deficiencies. (14 marks)","modelAnswer":["Deficiency: Brenda receives customer orders, raises sales invoices and processes payments, so there is a lack of segregation of duties. Effect: errors will not be identified on a timely basis and the risk of fraud is increased. Recommendation: the responsibilities for receiving orders, raising invoices and processing payments should be split between different individuals.","Deficiency: Brenda manually amends invoices in order to apply the contracted hotel prices. Effect: invoices may be raised at incorrect prices, resulting in a loss of revenue or of customer goodwill. Recommendation: the contracted hotel prices should be pre-loaded into the sales system and invoices should not be amended manually.","Deficiency: credit limits are set by the finance director only when a new customer is created and are not reviewed subsequently. Effect: credit limits become out of date, which can result in irrecoverable debts or lost sales. Recommendation: credit limits should be reviewed regularly and updated by a responsible official.","Deficiency: neither sales orders nor goods despatch notes (GDNs) are sequentially numbered, because order numbers are linked to the customer account. Effect: it is difficult to identify missing orders, leading to unfulfilled orders and reduced customer satisfaction. Recommendation: both orders and GDNs should be sequentially numbered and the sequence checked on a regular basis.","Deficiency: since changing to a cheaper local courier, some orders have been delivered late. Effect: loss of customer goodwill and possible loss of sales. Recommendation: set delivery timeliness targets, monitor performance against them and, if necessary, revert to a reliable courier.","Deficiency: sales invoices are generated automatically on the day the customer places the order, that is before the goods are despatched. Effect: revenue is recognised early. Recommendation: the system should only raise the invoice once the goods have been despatched and a GDN has been produced.","Deficiency: during promotions a senior sales ledger clerk is able to amend prices in the sales ledger master file. Effect: prices could be amended incorrectly or without authorisation, resulting in invoicing errors and an increased risk of fraud. Recommendation: restrict master file amendment rights to supervisory staff and generate an exception report for regular review by a responsible official.","Deficiency: statements are only sent monthly to hotel customers and the sales ledger control account is only reconciled once a year. Effect: disputed invoices and errors are not identified promptly. Recommendation: send monthly statements to all customers and have the control account reconciled monthly by a responsible official."],"keywords":[["segregation","different individuals","fraud"],["pre-loaded","manually"],["credit limit","reviewed regularly"],["sequentially numbered","sequence"],["courier","late"],["despatch","early"],["master file","exception report"],["monthly statements","control account"]]},
{"id":302,"points":3,"type":"case","category":"IC","title":"Granstan Co — Sales cycle: direct controls + tests of control","caseText":"Scenario: Granstan Co sells electronic kitchen appliances from 40 stores. Sales: Granstan Co has both business and retail customers. Business customers can apply for a credit account through Granstan Co's central credit control department. After performing necessary checks, the credit control department sets a credit limit which is authorised and then regularly reviewed by the finance director. As well as purchasing in store, business customers can purchase goods via the company's website and collect them from their nearest store or have them delivered. As part of the invoicing process, a member of the finance team matches the details on the online order with the goods dispatched note (GDN) before the sales invoice is raised based on these documents. Each store charges the same prices for goods but customers who are on the mailing list receive weekly emails with discount offers. To claim the discount customers must show this email at the cash tills (cash registers) and have the discount barcode within the email scanned. The system then deducts the discount from the price charged. Granstan Co's monthly management accounts analyse revenue by store, product and type of customer. Percentage movements in each of the categories are reported, with comparison to the previous month and the previous year. On a monthly basis, the sales director reviews this information, investigates any unexpected movements and completes a report which is presented at the next board meeting.","question":"(b) In respect of the SALES system of Granstan Co: (i) Identify and explain THREE DIRECT CONTROLS which the auditor may seek to place reliance on; and (ii) Describe a TEST OF CONTROL the auditor should perform to assess if each of these direct controls is operating effectively. Note: The marks will be split equally between each part. (6 marks)","modelAnswer":["Control: credit limits are set by the credit control department and are authorised and regularly reviewed by the finance director. Explanation: regular review ensures that credit limits are not out of date, which reduces the risk of irrecoverable debts and lost sales. Test of control: inspect a sample of credit limit listings and new customer files to confirm that the limits were reviewed regularly by the finance director.","Control: before raising the sales invoice, a member of the finance team agrees the details of the online order to the goods despatch note (GDN). Explanation: this ensures that customers are only invoiced for goods actually despatched to them and prevents revenue being overstated or recognised early. Test of control: inspect a sample of orders to confirm they were agreed to the GDN before invoicing, or inspect a sample of invoices for GDN support.","Control: to obtain a discount, customers must show the promotional email at the till and have the discount barcode scanned. Explanation: this ensures that discounts are only given to authorised customers, reducing the risk of misstatement of price and revenue. Test of control: inspect the price list to confirm all discounts are supported by a discount email; attempt to manually input a discount without the email — the system should reject it.","Control: the sales director reviews a monthly analysis of revenue by store, product and customer type, investigates unexpected movements and reports to the board. Explanation: investigating unusual movements in revenue enables fraud and error to be identified on a timely basis, preventing revenue being overstated or understated. Test of control: review the monthly analysis report for evidence that the sales director investigated the unexpected movements."],"keywords":[["credit limit","finance director","reviewed"],["GDN","invoice","order"],["barcode","discount","email"],["sales director","investigat","monthly"]]},
{"id":303,"points":7,"type":"case","category":"IC","title":"Swift Co — Purchases & payroll: key controls + tests of control","caseText":"It is 1 July 20X5. Swift Co prints books which it sells online and supplies to retailers across the country. The company's year end is 30 September 20X5. You are an audit supervisor with Toucan & Co, preparing the draft audit programmes and reviewing the internal controls documentation in preparation for the interim audit.\nPurchases\nThe company has a purchasing department based at its head office. When raw materials are required, the production supervisors submit a requisition form to the purchasing department. A multi-part purchase order is generated and the purchasing manager authorises all orders up to $5,000. Orders over $5,000 are authorised by the purchasing director.\nThe warehouse team processes goods received from suppliers. They agree the goods received to the purchase order and check the quantity and the quality of the goods. On completion of those checks a goods received note (GRN) is produced. One copy of the GRN is then signed and filed in the warehouse. Another copy of the GRN is sent to the finance department.\nA payables ledger clerk logs the purchase invoices in batches of 20 into the purchase day book utilising control totals. A batch control sheet is completed for each set of 20 invoices and the clerk signs to evidence the checks undertaken.\nSupplier statement reconciliations are performed on a monthly basis. All differences are fully investigated, and the financial controller reviews these reconciliations. Invoices are paid in accordance with the supplier's credit terms. The finance director authorises the bank transfer payment list for suppliers having first agreed the amounts to be paid to supporting documentation and having reviewed the list for duplicate payments.","question":"[Required — in respect of the internal control system of Swift Co: (i) Identify and explain SEVEN KEY CONTROLS which the auditor may seek to place reliance on; and (ii) Describe a TEST OF CONTROL the auditor should perform to assess if each of these key controls is operating effectively. Note: The marks will be split equally between each part. (14 marks)]","modelAnswer":["Control: purchase orders are authorised by value band — below $5,000 by the purchasing manager and $5,000 and above by the purchasing director. Test of control: select a sample of purchase orders and inspect them for evidence of authorisation by the appropriate level of staff.","Control: on receipt, goods are agreed to the purchase order and checked for both quantity and quality before a goods received note (GRN) is raised. Test of control: observe the goods received process and inspect a sample of GRNs for evidence that the check was carried out and signed for.","Control: purchase invoices are entered in batches of 20 using control totals, and a batch control sheet is completed and signed by the clerk. Test of control: observe the inputting of purchase invoices and inspect batch control sheets for evidence that control totals were used and signed off.","Control: supplier statement reconciliations are prepared monthly, all differences are investigated and the reconciliations are reviewed by the finance director. Test of control: review the file of supplier statement reconciliations to confirm they were prepared monthly and reviewed by the finance director.","Control: before authorising the payment list, the finance director agrees the amounts to the supporting documentation and checks for duplicate payments. Test of control: obtain a sample of bank transfer payment lists and inspect them for evidence of the finance director's authorisation and of the duplicate payment check.","Control: new employees can only be added to the payroll once HR has completed a joiner form containing a unique employee number, and the system will not allow an employee to be added without one. Test of control: inspect a sample of joiner forms for a unique employee number, or attempt to add an employee without a number — the system should reject this.","Control: a monthly exception report of changes to payroll standing data is generated and reviewed and signed by the payroll manager. Test of control: select a sample of monthly exception reports and inspect them for evidence of review by the payroll manager.","Control: the payroll supervisor selects a sample of payslips, re-performs the gross to net pay calculation, investigates any differences and signs as evidence. Test of control: review a sample of payslips for evidence of the supervisor's signature following the recalculation."],"keywords":[["authoris","purchase order","5,000"],["GRN","quantity","quality"],["control totals","batch"],["supplier statement","reconcil","monthly"],["finance director","payment","duplicate"],["unique employee number","joiner"],["exception report","standing data"],["re-perform","gross to net","sign"]]},
{"id":304,"points":4,"type":"case","category":"IC","title":"Granstan Co — Purchases cycle: 4 deficiencies","caseText":"Scenario: Purchases. Granstan Co has a central purchasing department. A monthly exception report of any changes made to the supplier master file data is automatically generated, printed and then filed. When goods are ordered, a purchase order is generated within the purchase ordering module, authorised by the relevant individual and sent to the supplier. The purchasing and finance departments as well as the stores are able to access the ordering module to view orders. Goods are delivered directly to the relevant store where a store employee checks the quantity supplied to the supplier's delivery note and the purchase order. On completion of the checks, an electronic goods received note (GRN) is produced. Only the stores and the finance department have access rights to view the completed GRNs within the module. Due to staff shortages in the finance department, supplier statement reconciliations are no longer performed.\n(c) Identify and explain FIVE DEFICIENCIES in Granstan Co's PURCHASES and PAYROLL systems and provide a control recommendation to address each of these deficiencies. (10 marks) [；]","question":"Identify and explain FOUR deficiencies in the purchases system and provide a recommendation to address each deficiency.","modelAnswer":["Deficiency: the monthly exception report of changes to the supplier master file is automatically generated, printed and then filed without being reviewed. Effect: fictitious suppliers could be added and unauthorised changes would not be detected on a timely basis, leading to incorrect payments and increased costs. Recommendation: the monthly exception report of changes should be reviewed by a responsible official on a regular basis and any unusual changes investigated.","Deficiency: when goods are delivered the store employee checks only the quantity to the supplier's delivery note and the purchase order; the quality of the goods is not checked. Effect: damaged goods may not be returned to suppliers promptly, increasing the risk of overpayment to suppliers, or defective goods may be sold to customers, damaging customer satisfaction. Recommendation: goods should be inspected for both quantity and quality on receipt.","Deficiency: only the stores and finance departments have access rights to view completed goods received notes (GRNs); the purchasing department cannot view them. Effect: the purchasing department cannot monitor the status of orders, resulting in a significant level of unfulfilled orders or repeated purchasing. Recommendation: the GRN should be produced in three parts, with one copy to the purchasing department, one to the finance department and one for the warehouse.","Deficiency: supplier statement reconciliations are no longer performed because of staff shortages. Effect: errors may not be identified on a timely basis and suppliers could be under or overpaid. Recommendation: supplier statement reconciliations should be performed on a monthly basis and reviewed by a responsible official."],"keywords":[["exception report","review","fictitious"],["quality","damaged","quantity"],["GRN","purchasing","three"],["supplier statement","reconcil","monthly"]]},
{"id":305,"points":3,"type":"case","category":"IC","title":"Petra Co — Payroll cycle: direct controls + tests of control","caseText":"It is 1 July 20X5. Petra Co is a company listed on a stock exchange. It manufactures handbags which it supplies to retailers across the country. The company's year end is 30 September 20X5. You are an audit supervisor with Babylon & Co, preparing the draft audit programmes and reviewing the internal controls documentation in preparation for the forthcoming interim audit.\nPayroll\nPetra Co employs factory staff, who are paid based on the number of hours worked. They are paid in cash on a weekly basis due to commercial reasons. These staff each have a unique clock card which they use to enter and exit the factory at the beginning and end of their shift, and this process is supervised by security staff. The clock card system and the payroll system are linked.\nThe payroll system automatically calculates the gross and net pay along with relevant deductions and generates employee payslips. The payroll supervisor selects a sample of the payslips, reperforms the gross to net pay calculations and investigates any discrepancies. The sampled payslips are then signed as evidence of this review.\nFactory staff receive an annual inflation-based pay increase every April. The revised hourly wage rates are communicated to the payroll department. The revised pay rates are entered into the system in April by a payroll clerk and each entry is checked by a senior clerk for input errors prior to processing that week's wages. The senior clerk signs a payroll listing of factory staff employees, which includes the revised hourly wage rates as evidence of undertaking this review.\nTwo members of the payroll department produce the cash pay packets. One member is responsible for preparing the pay packets by reference to the payslips generated by the system. The second member recounts the contents of the finished pay packets and confirms that this agrees to the payslips. Both members of staff are required to sign the weekly payroll listing on completion of this task.","question":"[Required: (a) In respect of the PAYROLL system of Petra Co: (i) Identify and explain THREE DIRECT CONTROLS which the auditor may seek to place reliance on; and (ii) Describe a TEST OF CONTROL the auditor should perform to assess if each of these key controls is operating effectively. Note: The marks will be split equally between each part. (6 marks)]","modelAnswer":["Control: each employee clocks in and out using a unique clock card, and the process is supervised by a security guard. Explanation: this prevents one employee clocking in for another (buddy clocking), reducing the risk of paying for hours not worked. Test of control: observe the clocking in and out process to confirm it is supervised by a responsible official or security guard.","Control: the payroll supervisor selects a sample of payslips, re-performs the gross to net pay calculation, investigates any differences and signs as evidence. Explanation: this identifies system errors and prevents wages being over or underpaid. Test of control: review a sample of payslips for evidence of the supervisor's signature following the recalculation.","Control: amended hourly wage rates are entered by payroll clerks, and each entry is checked for input errors by a senior clerk before payment and signed on the payroll listing. Explanation: this reduces input errors and prevents wages being overstated or understated. Test of control: review the April payroll listing for evidence of the senior clerk's review and signature of the amended wage rates.","Control: cash pay packets are prepared by two members of staff — one makes up the packets and the other checks them, and both sign the weekly payroll listing. Explanation: segregation of duties reduces the risk of fraud and error in cash wages. Test of control: inspect the weekly payroll listing for evidence of both signatures."],"keywords":[["clock","supervised","buddy"],["re-perform","gross to net","payslip"],["wage rate","senior","sign"],["pay packet","two","sign"]]},
{"id":306,"points":7,"type":"case","category":"IC","title":"Carter Co — Payroll: 7 deficiencies + recommendations + ToC (21 marks)","caseText":"You are the audit senior of Carter Co (Carter), a company that manufactures high class furniture.\nCarter employs 200 weekly-paid employees comprising upholsters, carpenters, joiners, and general labourers. All employees are paid directly by bank transfer.\nThe payroll is processed using a desktop computer that stores the payroll programme, standing (master) file and transactions data relating to employees. On completion of payroll processing, the data is copied onto a removable hard drive that is stored in one of the filing cabinets in the accountant's office.\nHours worked are recorded on electronic clock cards. Each card is embossed with the employee's name, department, employee number and photo. The card contains a chip for storing data and requires a unique PIN to be entered each time the card is used. Employees clock in and out on arrival and departure from the premises. The process is not supervised. At the end of each week, the factory manager, Mr Wilkinson, gives the account supervisor, Mrs McCaw, the clock cards for that week and collects processed clock cards, prepared by Mrs McCaw, for the following week.\nFrom the clock cards, Mrs McCaw prints out a detailed summary showing, for each employee, the hours worked (split between basic and overtime) with departmental subtotals and factory total. The printout is then passed to Miss Jones, the payroll clerk, who enters the individual employee hours into the computer. The figures for gross and net pay are calculated by the programme and the following reports are generated:\nPayroll: Details per employee of gross pay, deductions and net pay; departmental and factory totals thereof and total hours split between basic and overtime;\nSummary: Cumulative details to date per employee;\nPay slips: Details of gross pay, deductions and net pay;\nPayment list: Bank account details, net pay per employee and total net pay.\nThe finance director, Mr Dagg, signs the payroll bank transfer after agreeing it to the total net pay on the payment list and passes the transfer to the managing director, Mr Lomu, who countersigns it.\nMr Wilkinson gives a list detailing starters and leavers to Miss Jones, who enters these changes into the computer as and when the situation arises. She uses the same password as for payroll preparation, even though there is a facility within the software for hierarchal passwords. Miss Jones then files the list with the personnel records in her filing cabinet.\nYour inquiries about the system indicate that there are no relevant procedures or controls other than those described above.\nRequired:\n(a) In respect of the internal control of Carter Co:","question":"(i) identify and explain SEVEN deficiencies.\n(ii) recommend a control to address each of the deficiencies; and\n(iii) describe a test of control that the auditor would perform to assess whether each of these controls, if implemented, is operating effectively.\nNote: the total marks will be split equally between each part. (21 marks)","modelAnswer":["Deficiency: the back-up removable hard drive is kept in a filing cabinet in the office. Effect: if the data were lost or stolen, payroll could be over or underpaid. Recommendation: the back-up should be stored in a fireproof safe located outside the office. Test of control: observe the location where the back-up is stored.","Deficiency: the clocking in and out process is not supervised. Effect: employees could clock in for each other (buddy clocking), resulting in wages being paid for hours not worked. Recommendation: the clocking in and out process should be supervised by a responsible official. Test of control: observe the clocking in and out process to confirm it is supervised.","Deficiency: overtime hours are not authorised. Effect: employees may be paid for unauthorised overtime, resulting in increased payroll costs. Recommendation: all overtime should be authorised by a responsible official, who should also assess whether it is reasonable. Test of control: review overtime summaries for evidence of authorisation.","Deficiency: payroll clerks enter the hours worked and there is no independent review of the hours entered. Effect: input errors would not be identified, resulting in payroll being misstated. Recommendation: hours entered should be reviewed and signed by a responsible official. Test of control: review the payroll detail for evidence of the reviewer's signature.","Deficiency: the finance director signs only the total net pay figure rather than a detailed list of employees. Effect: fictitious employees could be added or genuine employees omitted without detection, resulting in payroll being misstated. Recommendation: the finance director should review and authorise a detailed list of employees and payments before authorisation. Test of control: obtain a sample of payment lists and inspect them for evidence of review of the detailed listing.","Deficiency: starters and leavers are entered into the payroll system without any authorisation. Effect: fraudulent payments could be made to fictitious employees or to employees who have left. Recommendation: a responsible official should authorise and sign the list of starters and leavers before it is processed. Test of control: select a sample of starters and leavers and inspect them for evidence of authorisation.","Deficiency: the same password is used by all payroll staff even though the software has a hierarchical password facility. Effect: unauthorised individuals could amend standing data, resulting in incorrect wage payments. Recommendation: the hierarchical password facility should be used and passwords should be changed regularly. Test of control: attempt to access the payroll standing data using an out-of-date password — the system should reject it."],"keywords":[["back-up","fireproof","outside"],["clocking","supervised","buddy"],["overtime","authoris"],["review","hours","sign"],["fictitious","detailed","authoris"],["starters","leavers","authoris"],["hierarchical password","standing data","changed regularly"]]},
{"id":307,"points":3,"type":"case","category":"IC","title":"Granstan Co — Payroll cycle: 3 deficiencies","caseText":"Scenario: Payroll. Granstan Co has separate human resources (HR) and payroll departments. The HR department is responsible for setting up employee records for new employees. As part of this process an authorised joiner form, including all relevant details, is sent to the payroll department so that the new employees can be added to the payroll. However, when temporary employees are required at short notice joiner forms are not completed. Instead, the relevant store manager notifies the payroll department by email on the day the new employee starts work. All permanent employees are paid on a monthly basis by bank transfer. The payroll for each store is passed to the store manager for review and approval two days before the payment date. The store manager is required to report back to the payroll department only if any errors are identified. Temporary employees are paid in cash and pay packets are prepared and distributed by the payroll department. When employees collect their pay packets, they are only required to state their name. They then count the cash in the pay packet and sign for it.\n(c) Identify and explain FIVE DEFICIENCIES in Granstan Co's PURCHASES and PAYROLL systems and provide a control recommendation to address each of these deficiencies. (10 marks) []","question":"Identify and explain THREE deficiencies in the payroll system and provide a recommendation to address each deficiency.","modelAnswer":["Deficiency: temporary employees engaged at short notice do not complete joiner forms; the store manager simply notifies the payroll department by email on the employee's first day. Effect: without an HR-authorised joiner form there is an increased risk of fictitious individuals being added to the payroll. Recommendation: all new employees, including temporary staff, should complete a joiner form authorised by HR before being added to the payroll.","Deficiency: store managers review and approve the payroll before payment but only report back to the payroll department if errors are identified. Effect: if the store manager forgets to report back, errors are not identified and payroll costs would be misstated. Recommendation: store managers should report back to the payroll department whether or not any errors were identified.","Deficiency: temporary employees collect cash pay packets merely by stating their name; no identification is required. Effect: one individual could collect the wages of several employees, increasing payroll costs, or wages could be paid to the wrong person. Recommendation: employees should be required to show identification before collecting their wages."],"keywords":[["joiner","fictitious","authoris"],["report back","store manager","error"],["identification","cash","collect"]]},
{"id":308,"points":8,"type":"case","category":"IC","title":"Silver Co — Inventory count: 8 deficiencies (16 marks)","caseText":"It is 1 July 20X5. You are an audit senior with Golden & Co and you are in the process of reviewing the inventory count arrangements for your audit client, Silver Co, in preparation for attendance at the full year-end inventory count on 30 September 20X5. The company manufactures household furniture such as tables, sofas and beds and has a factory and a large warehouse which are located on a single site.\nInventory count arrangements\nThe company manufactures goods 24 hours a day, seven days a week to meet customers' demands. Production will still be continuing during the inventory count as it is not possible for the company to stop producing goods. Movements of goods in and out of the factory and warehouse will also have to continue for operational reasons.\nThe count will be undertaken by 20 teams of two counters from the warehouse, and the warehouse supervisor will be overseeing the inventory count. Each team will be given a specific area of the warehouse to count using sequentially numbered inventory sheets which detail the items of inventory and quantities held at the date of the count as per the inventory system. It has been left to the individuals within each team to decide how to allocate the responsibilities between them.\nAll goods present in the warehouse on 30 September 20X5 will be allocated into separate warehouse bays (designated areas of the warehouse) in preparation for counting. When a warehouse bay has been counted, it is crossed out on the warehouse map which is held in the office by the warehouse supervisor. As the warehouse supervisor is confident that the 20 teams are familiar with the warehouse and the location of the inventory, he has said that each bay only needs to be counted by one team. One area of the warehouse, which includes a large quantity of spare parts left over from production, will be segregated so that this inventory will not be counted, as the warehouse supervisor has stated that these items are unusable.\nA numerical sequence check of the sheets will be carried out by the warehouse supervisor once the count is finished. The inventory sheets will then be passed to a warehouse assistant to update the inventory records to reflect the inventory physically present as per the inventory sheets.\nWork in progress valuations have previously been carried out by an external inventory valuer. However, the warehouse supervisor has suggested that he undertakes this valuation this year as he is familiar with the company's products. The directors have agreed to this on the basis that it will save costs.\nLast week the company agreed to store 30 sofas belonging to a third party in its warehouse for the next four months as the third party's storage facilities became flooded. For convenience, these sofas have been stored alongside similar products which belong to Silver Co.","question":"Required:\nAuditors have a responsibility under ISA 265 Communicating Deficiencies in Internal Control to Those Charged with Governance and Management to communicate significant deficiencies in internal controls to those charged with governance.\n(b) Identify and explain EIGHT deficiencies in Silver Co's inventory count arrangements and provide a control recommendation to address each of these deficiencies. (16 marks)","modelAnswer":["Deficiency: production continues and goods are still being moved during the inventory count. Effect: goods may be missed or double counted. Recommendation: production and goods movements should stop during the count; if this is not possible, goods produced should be stored separately and counted at the end as finished goods.","Deficiency: the count is carried out by warehouse staff and supervised by the warehouse supervisor, so there is no independence. Effect: there is a lack of segregation between holding and checking inventory, so errors and fraud could be hidden. Recommendation: the counting teams should be independent of the warehouse department.","Deficiency: the inventory sheets show the quantities recorded in the inventory system. Effect: the counting teams may be pre-judged by the recorded quantities, resulting in errors in the count. Recommendation: count sheets should be sequentially numbered and contain product codes and descriptions but no quantities.","Deficiency: the two-person counting teams have no clear split of responsibilities. Effect: responsibilities for counting and recording are unclear, so errors and fraud would not be identified on a timely basis. Recommendation: the roles should be split so that one individual counts and the other records the results.","Deficiency: each bay is counted only once by a single team and the count is only recorded on a map in the office. Effect: it is difficult to identify counting errors, resulting in inventory being misvalued. Recommendation: a supervisor should carry out sample checks of the counts and bays should be marked on site as they are counted.","Deficiency: a large number of surplus spare parts are excluded from the count because they are unusable. Effect: inventory is understated, as unusability affects valuation, not quantity. Recommendation: all inventory, including unusable items, should be counted and then separately assessed for valuation.","Deficiency: the count sheets are passed to the warehouse assistant who updates the inventory records immediately, without investigating differences. Effect: errors or fraud within the differences would not be identified and records would be updated incorrectly. Recommendation: all differences should be investigated before the inventory records are updated.","Deficiency: work in progress (WIP) is now valued by the warehouse supervisor rather than by an external valuer. Effect: the warehouse supervisor may lack the expertise to assess the stage of completion, resulting in WIP being over or understated. Recommendation: a specialist should be engaged to value the WIP.","Deficiency: 30 sofas belonging to a third party are stored together with the company's own identical inventory. Effect: third-party goods could be counted as the company's inventory, resulting in inventory being overstated. Recommendation: third-party inventory should be segregated and clearly marked to avoid it being counted."],"keywords":[["goods movements","missed","double counted"],["segregation","independent","warehouse"],["quantities","pre-judg","no quantities"],["one counts","one record","responsibilit"],["sample checks","bays","on site"],["unusable","understated","valuation"],["investigat","differences","update"],["work in progress","specialist","value"],["third part","segregat","clearly marked"]]},
{"id":309,"points":3,"type":"case","category":"IC","title":"JJE Co — Inventory count: deficiencies + recommendations + ToC (9 marks)","caseText":"It is 1 July 20X5. You are an audit supervisor with Odie & Co, currently in charge of two clients, Jon's Junction Electrics Co and Lazlo Co.\nIt is 1 July 20X5. Jon's Junction Electrics Co (JJE) is a manufacturer of electrical equipment. The company's year end is 30 September 20X5. You are currently reviewing notes in relation to the internal controls in place at JJE.\nInventory count\nJJE is planning to undertake a full inventory count at the year end of its raw materials, work in progress and finished goods and you will be attending this count.\nThe count will be undertaken by 10 teams of two counters from the warehouse department with a senior official from JJE's finance department providing overall supervision. Each team of two will be allocated a number of aisles within the warehouse to count and they will be provided with sequentially numbered inventory sheets which contain information from the inventory records (product codes and quantities). The counters will move through each allocated aisle counting the inventory and confirming that it agrees with the inventory sheets. Where a difference is found, they will note this on the sheet.\nThe warehouse is large and some of the aisles have been rented out to third parties with similar operations; these are scattered throughout the warehouse. For completeness, the counters have been asked to count the inventory for all aisles noting the third party inventories on separate blank inventory sheets, and the finance department will make any necessary adjustments.\nSome of JJE's finished goods are high in value and are stored in a locked area of the warehouse and all the counting teams will be given the code to access this area. There will be no despatches of inventory during the count and it is not anticipated that there will be any deliveries from suppliers.\nRequired:\n(a) In respect of the INVENTORY COUNT procedures for JJE:","question":"(i) Identify and explain THREE deficiencies;\n(ii) Recommend a control to address each of these deficiencies; and\n(iii) Describe a TEST OF CONTROL the external auditors would perform to assess if each of these controls, if implemented, is operating effectively.\n(9 marks)","modelAnswer":["Deficiency: the inventory count teams are made up of staff from the warehouse department. Effect: there is a lack of segregation of roles between holding and checking inventory, so errors and fraud could be hidden. Recommendation: the counting teams should be independent of the warehouse; hence a department other than the warehouse should undertake the inventory count. Test of control: review the job descriptions of the inventory count teams to confirm the count is allocated to a department other than the warehouse.","Deficiency: the two-person counting teams have no clear split of duties. Effect: there are no clear responsibilities within the team for counting and recording, so errors and fraud could not be identified on a timely basis. Recommendation: the roles of the team members should be split so that one individual is responsible for counting and one for recording the results. Test of control: observe the counting teams to assess if one counts and the other then double checks the quantities counted.","Deficiency: the inventory sheets are pre-printed with the quantities per the inventory system. Effect: there is a risk that the counting teams may pre-judge the quantities, resulting in errors in the inventory count. Recommendation: the count sheets should be sequentially numbered and contain product codes and descriptions but no quantities. Test of control: inspect a sample of the inventory sheets being used by the counting teams to ensure that inventory quantities are not included.","Deficiency: inventory belonging to third parties is counted at the same time and is only removed afterwards by means of a finance adjustment. Effect: there is a risk that these goods are not correctly removed from the inventory count sheets, resulting in inventory being overstated. Recommendation: all inventories belonging to third parties should be separated from the company's inventory and clearly marked, so that they are not counted. Test of control: inspect the counting sheets to ensure that inventory owned by third parties is not included on any pre-printed forms.","Deficiency: the access code to the high value inventory area has been given to all members of the counting teams. Effect: any member of the counting team could access the high value inventory, which could result in inventory being stolen. Recommendation: only senior members of the team should be given the access code to count the high value inventory, and the code should be changed regularly. Test of control: enquire of a member of the counting team without the access code and ask them to attempt to enter the high value inventory area — they should be rejected."],"keywords":[["segregation","independent","job description"],["one counts","one record","observe"],["pre-printed","quantities","not included"],["third part","segregat","overstat"],["access code","senior","rejected"]]},
{"id":310,"points":5,"type":"case","category":"IC","title":"Slattery Co — Inventory (DIY retail): 5 deficiencies","caseText":"You are an audit supervisor of Anderson & Co and are currently preparing for the forthcoming audit of Slattery Co. Slattery Co owns 15 stores selling DIY products such as paint, wood and tools.\nEach evening, the computerised inventory system generates a list of items with less than one week's average sales. Each store manager reviews the list and selects the items to be ordered. The store manager sends the list to head office where it is reviewed against the inventory balances for each store by the purchasing manager before the order is placed with the appropriate supplier. The computer system automatically generates a sequentially pre-numbered order. A copy of the order, which details the quantities of goods ordered for each store, is sent to each store manager.\nOrders are normally fulfilled by suppliers within two days. The computer system performs a sequence check on a weekly basis, and generates an exception report of any missing orders which is reviewed by the purchasing manager. The purchasing manager contacts the relevant supplier to follow up on any outstanding orders.\nDeliveries of goods are received daily. All items are delivered direct to individual stores from either the manufacturer or a wholesaler. Goods received are agreed to the supplier's delivery note. Items received are recorded on a goods received note (GRN) which is initialled by a Slattery Co employee to confirm the quantities of goods are accurately recorded on the GRN and the goods are not damaged. GRNs are not sequentially pre-numbered. The store's inventory system is updated from the GRN immediately by a different member of staff.\nInventory is placed either into inventory or directly onto the shelves for purchase by customers. Each evening, the inventory levels in the store are reviewed and where levels are low, inventory is taken from the inventory store and placed on the shelves. Due to the problem of finding inventory (it may be on the shelves, in the inventory store or being moved by employees), physical inventory counts are only carried out once a year. Customers visit a Slattery Co store, select the products they require and pay for the items at the checkout before leaving the store. Customers can pay for their purchases at either a self-service checkout or an attended checkout.\nSelf-service checkouts are used to purchase small items. The customer scans the barcode attached to each item with a barcode reader. The reader makes a sound to confirm the item has been scanned and the inventory system is automatically updated. Product details are not displayed on the screen at this time. Product details are shown on the itemised receipt produced after payment has been made.\nSelf-service checkouts are not monitored. Staff only attend the self-service checkouts if customers are having difficulty using the scanners. Alternatively, customers can go to a checkout where a member of Slattery Co staff will scan each item. Inventory records are updated for sales made at the point of sale. Every customer receives an itemised receipt after paying for the items purchased. Customers are encouraged to ensure that their receipt is correct and shows the items purchased before they leave the store. If there are differences, for example incorrect items or duplicated items, customers are directed to the customer service desk. The customer service staff issue refunds for any discrepancies or returns within the company's return policy. A copy of the refund receipt is kept and the returned inventory is recorded in the system in the following morning.\nRequired:","question":"16.(a) Identify and explain FIVE DEFICIENCIES in Slattery Co's system and provide a recommendation to address each of these deficiencies. (10 marks)","modelAnswer":["Deficiency: goods received are only checked to the supplier's delivery note, not to the purchase order. Effect: the company could pay for goods which were not ordered. Recommendation: goods received should be agreed to an authorised purchase order, with a signature as evidence of the check.","Deficiency: goods received notes (GRNs) are not sequentially pre-numbered. Effect: GRNs could be misplaced or lost, resulting in the records of goods received being incomplete. Recommendation: GRNs should be sequentially pre-numbered and the sequence checked on a regular basis.","Deficiency: the physical inventory count is only performed once a year. Effect: inventory which has been stolen or lost would not be identified promptly. Recommendation: physical inventory counts should be performed more frequently, such as monthly, at each store.","Deficiency: at the self-service checkouts the item details are not shown on the screen when goods are scanned, and the checkouts are not monitored. Effect: goods may not be scanned, resulting in sales and inventory being understated. Recommendation: item details should be displayed on the screen when goods are scanned, and the self-service checkouts should be supervised by an employee or by CCTV.","Deficiency: returns and returned inventory are only entered into the system the following morning. Effect: inventory records are not updated promptly, and refunds could be given for goods which were not returned. Recommendation: refunds and returned inventory should be entered into the system immediately as they arise."],"keywords":[["purchase order","delivery note"],["grn","sequentially","pre-numbered"],["once a year","monthly","frequent"],["self-service","scan","supervis"],["returns","immediately","refund"]]},
{"id":311,"points":5,"type":"case","category":"IC","title":"Slattery Co — Direct controls + tests of control","caseText":"You are an audit supervisor of Anderson & Co and are currently preparing for the forthcoming audit of Slattery Co. Slattery Co owns 15 stores selling DIY products such as paint, wood and tools.\nEach evening, the computerised inventory system generates a list of items with less than one week's average sales. Each store manager reviews the list and selects the items to be ordered. The store manager sends the list to head office where it is reviewed against the inventory balances for each store by the purchasing manager before the order is placed with the appropriate supplier. The computer system automatically generates a sequentially pre-numbered order. A copy of the order, which details the quantities of goods ordered for each store, is sent to each store manager.\nOrders are normally fulfilled by suppliers within two days. The computer system performs a sequence check on a weekly basis, and generates an exception report of any missing orders which is reviewed by the purchasing manager. The purchasing manager contacts the relevant supplier to follow up on any outstanding orders.\nDeliveries of goods are received daily. All items are delivered direct to individual stores from either the manufacturer or a wholesaler. Goods received are agreed to the supplier's delivery note. Items received are recorded on a goods received note (GRN) which is initialled by a Slattery Co employee to confirm the quantities of goods are accurately recorded on the GRN and the goods are not damaged. GRNs are not sequentially pre-numbered. The store's inventory system is updated from the GRN immediately by a different member of staff.\nInventory is placed either into inventory or directly onto the shelves for purchase by customers. Each evening, the inventory levels in the store are reviewed and where levels are low, inventory is taken from the inventory store and placed on the shelves. Due to the problem of finding inventory (it may be on the shelves, in the inventory store or being moved by employees), physical inventory counts are only carried out once a year. Customers visit a Slattery Co store, select the products they require and pay for the items at the checkout before leaving the store. Customers can pay for their purchases at either a self-service checkout or an attended checkout.\nSelf-service checkouts are used to purchase small items. The customer scans the barcode attached to each item with a barcode reader. The reader makes a sound to confirm the item has been scanned and the inventory system is automatically updated. Product details are not displayed on the screen at this time. Product details are shown on the itemised receipt produced after payment has been made.\nSelf-service checkouts are not monitored. Staff only attend the self-service checkouts if customers are having difficulty using the scanners. Alternatively, customers can go to a checkout where a member of Slattery Co staff will scan each item. Inventory records are updated for sales made at the point of sale. Every customer receives an itemised receipt after paying for the items purchased. Customers are encouraged to ensure that their receipt is correct and shows the items purchased before they leave the store. If there are differences, for example incorrect items or duplicated items, customers are directed to the customer service desk. The customer service staff issue refunds for any discrepancies or returns within the company's return policy. A copy of the refund receipt is kept and the returned inventory is recorded in the system in the following morning.\nRequired:","question":"17.(b) In respect of the internal control system of Slattery Co: (i) Identify and explain FIVE DIRECT CONTROLS which the auditor may seek to place reliance on; and (ii) Describe a TEST OF CONTROL the auditor should perform to assess if each of these key controls is operating effectively. (10 marks)","modelAnswer":["Control: the store managers' order lists are reviewed by the head office purchasing manager against each store's inventory balances before orders are placed. Explanation: errors are identified before the order is placed, reducing unnecessary purchases. Test of control: select a sample of orders placed with head office and inspect for evidence of review by the purchasing manager.","Control: the system automatically generates sequentially pre-numbered purchase orders, and a weekly sequence check is performed producing an exception report for review by the purchasing manager. Explanation: missing orders are identified and followed up, reducing unfulfilled orders. Test of control: inspect the file of purchase orders to confirm they are sequentially pre-numbered and inspect a sample of weekly exception reports for evidence of review.","Control: goods are checked for damage on receipt and the employee signs the goods received note (GRN) to confirm the check. Explanation: damaged goods are identified and returned to suppliers promptly, reducing overpayment. Test of control: inspect a sample of GRNs for evidence of the damage check and the employee's signature.","Control: the inventory records are updated from the GRN by a different member of staff. Explanation: segregation of duties reduces the risk of errors and fraud in the inventory records. Test of control: observe the updating process and trace a sample of GRNs through to the inventory records.","Control: all customers receive an itemised till receipt and are encouraged to check it before leaving the store; differences are handled by the customer service desk under the returns policy and a copy of the refund note is retained. Explanation: sales errors are identified and corrected promptly. Test of control: observe the checkout process and inspect a sample of retained refund notes."],"keywords":[["purchasing manager","review"],["pre-numbered","exception report"],["damage","grn","sign"],["different member of staff","grn"],["receipt","refund"]]},
{"id":312,"points":3,"type":"case","category":"IC","title":"Francisco Co — Multi-cycle: direct controls + tests of control (6 marks)","caseText":"It is 1 July 20X5. You are an audit supervisor with Canyon & Co, preparing the draft audit programmes and reviewing extracts from the internal control documentation in preparation for the audit of your client, Francisco Co. The company's year-end is 30 September 20X5, and it is a wholesale food operator with 18 distribution depots and one central warehouse.\nPayroll\nFrancisco Co employs distribution depot staff who are paid monthly based on the number of hours worked. Each employee has a staff identity card which they use to sign in and out of the depot at the beginning and end of each shift to record their hours worked, and this process is supervised by security staff as well as CCTV cameras. The hours worked per employee are automatically transferred from the signing-in system into the payroll system. The hourly wage rate is pre-set, and the payroll system automatically calculates the gross and net pay along with relevant statutory deductions and produces pay slips which are immediately emailed to employees.\nAccess to employees' standing data in the payroll system is restricted to payroll managers through the use of a password, which the system requires to be changed on a monthly basis.\nDistribution depot employees are paid by bank transfer on a monthly basis. The senior payroll manager reviews the list of bank payments and agrees this to the payroll records. If any discrepancies are noted, these are investigated by the senior payroll manager who then makes the required adjustment in the payroll records.\nPurchases\nFrancisco Co has a central purchasing department based at its head office. When goods are required, a production supervisor submits a request to the purchasing department. A multi-part purchase order is then generated. The purchasing manager authorises all orders below $3,000 and the purchasing director authorises orders of $3,000 and above.\nOn receipt of goods, the quality and quantities received are checked by a warehouse team member against the supplier's delivery note, and a goods received note (GRN) is produced. A copy of the GRN is sent to both the finance and purchasing departments.\nWhen purchase invoices are received from the suppliers, they are logged into an invoices received file and the accounting system assigns each invoice a unique number based on the supplier's code and date of input. The finance clerk then matches the invoices to a copy of the relevant purchase order and passes those two documents to the finance director for authorisation prior to the invoice being input into payables.\nNon-current assets\nFrancisco Co owns approximately 55% of its distribution depots and the remainder are leased premises, which have been confirmed as correctly capitalised in line with relevant accounting standards. The lease agreements and ownership documents are held in the finance department. Earlier in the year, members of the company's internal audit department undertook a review of the lease agreements and ownership documents but were unable to locate a number of the relevant documents.\nEach distribution depot is set up as a separate cost centre and is given an annual capital expenditure budget, but some cost centres have already significantly exceeded their annual budgets. When new equipment is purchased, the finance manager classifies the purchase order as capital or revenue expenditure. The classification is made with reference to formal company policy established by the finance director, who sample checks that the capital or revenue expenditure allocation has been correctly applied and then evidences this review by way of signature.\nRequired:\nISA 265 Communicating Deficiencies in Internal Control to Those Charged with Governance and Management, provides guidance on communicating significant deficiencies in internal control.","question":"(b) In respect of the system of internal control of Francisco Co: (i) Identify and explain THREE DIRECT CONTROLS which the auditor may seek to place reliance on; and (ii) Describe a TEST OF CONTROL the auditor should perform to assess if each of these direct controls is operating effectively. Note: The marks will be split equally between each part. (6 marks)","modelAnswer":["Control: employees clock in and out using an identity card and the process is supervised by a security guard and CCTV cameras. Explanation: this prevents one employee clocking in for another, reducing the risk of paying for hours not worked. Test of control: observe the clocking in and out process to confirm it is supervised.","Control: access to payroll standing data is restricted by password to the payroll manager and the system requires the password to be changed monthly. Explanation: this prevents unauthorised amendment of standing data, reducing the risk of incorrect wage payments. Test of control: attempt to access payroll standing data using an out-of-date password — the system should reject it.","Control: purchase orders are authorised by value band — below $3,000 by the purchasing manager and $3,000 and above by the purchasing director. Explanation: this prevents personal or unauthorised purchases and reduces unnecessary costs. Test of control: select a sample of purchase orders and inspect them for evidence of authorisation at the appropriate level.","Control: the finance manager classifies expenditure as capital or revenue in accordance with a formal policy set by the finance director, who reviews a sample and signs as evidence. Explanation: this reduces the risk of expenditure being misclassified. Test of control: review the purchase orders for evidence of the finance director's review and signature."],"keywords":[["clocking","supervised","identity card"],["standing data","password","monthly"],["purchase order","authoris","3,000"],["capital","revenue","review"]]},
{"id":313,"points":5,"type":"case","category":"IC","title":"Francisco Co — Multi-cycle: 5 deficiencies + recommendations (10 marks)","caseText":"It is 1 July 20X5. You are an audit supervisor with Canyon & Co, preparing the draft audit programmes and reviewing extracts from the internal control documentation in preparation for the audit of your client, Francisco Co. The company's year-end is 30 September 20X5, and it is a wholesale food operator with 18 distribution depots and one central warehouse.\nPayroll\nFrancisco Co employs distribution depot staff who are paid monthly based on the number of hours worked. Each employee has a staff identity card which they use to sign in and out of the depot at the beginning and end of each shift to record their hours worked, and this process is supervised by security staff as well as CCTV cameras. The hours worked per employee are automatically transferred from the signing-in system into the payroll system. The hourly wage rate is pre-set, and the payroll system automatically calculates the gross and net pay along with relevant statutory deductions and produces pay slips which are immediately emailed to employees.\nAccess to employees' standing data in the payroll system is restricted to payroll managers through the use of a password, which the system requires to be changed on a monthly basis.\nDistribution depot employees are paid by bank transfer on a monthly basis. The senior payroll manager reviews the list of bank payments and agrees this to the payroll records. If any discrepancies are noted, these are investigated by the senior payroll manager who then makes the required adjustment in the payroll records.\nPurchases\nFrancisco Co has a central purchasing department based at its head office. When goods are required, a production supervisor submits a request to the purchasing department. A multi-part purchase order is then generated. The purchasing manager authorises all orders below $3,000 and the purchasing director authorises orders of $3,000 and above.\nOn receipt of goods, the quality and quantities received are checked by a warehouse team member against the supplier's delivery note, and a goods received note (GRN) is produced. A copy of the GRN is sent to both the finance and purchasing departments.\nWhen purchase invoices are received from the suppliers, they are logged into an invoices received file and the accounting system assigns each invoice a unique number based on the supplier's code and date of input. The finance clerk then matches the invoices to a copy of the relevant purchase order and passes those two documents to the finance director for authorisation prior to the invoice being input into payables.\nNon-current assets\nFrancisco Co owns approximately 55% of its distribution depots and the remainder are leased premises, which have been confirmed as correctly capitalised in line with relevant accounting standards. The lease agreements and ownership documents are held in the finance department. Earlier in the year, members of the company's internal audit department undertook a review of the lease agreements and ownership documents but were unable to locate a number of the relevant documents.\nEach distribution depot is set up as a separate cost centre and is given an annual capital expenditure budget, but some cost centres have already significantly exceeded their annual budgets. When new equipment is purchased, the finance manager classifies the purchase order as capital or revenue expenditure. The classification is made with reference to formal company policy established by the finance director, who sample checks that the capital or revenue expenditure allocation has been correctly applied and then evidences this review by way of signature.\nRequired:\nISA 265 Communicating Deficiencies in Internal Control to Those Charged with Governance and Management, provides guidance on communicating significant deficiencies in internal control.","question":"(c) Identify and
