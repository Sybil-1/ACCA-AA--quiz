<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCA AA Practice Bank · MCQs & Templates & Written Questions & Notebooks</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #14171c;
    --card: #1e242c;
    --card2: #232a33;
    --border: #2e3742;
    --text: #dce3ea;
    --muted: #8b98a5;
    --accent: #4f8cff;
    --green: #34c77b;
    --green-bg: rgba(52,199,123,.12);
    --red: #e5534b;
    --red-bg: rgba(229,83,75,.12);
    --orange: #e0a34a;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.7;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 28px 18px 80px; transition: max-width .2s ease; }
  /* Written（主观题）板块：全屏宽布局，仅此板块加宽 */
  .wrap.wide { width: 95vw; max-width: 1600px; padding: 28px 26px 80px; }

  .app-header { text-align: center; margin-bottom: 24px; }
  .app-header h1 { font-size: 23px; font-weight: 700; letter-spacing: 1px; }
  .app-header p { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .big-tabs { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .big-tab {
    flex: 1; min-width: 130px; padding: 14px 6px; border-radius: 14px; border: 1px solid var(--border);
    background: var(--card); color: var(--muted); font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all .18s; text-align: center;
  }
  .big-tab:hover { border-color: var(--accent); color: var(--text); }
  .big-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .cat-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .cat-btn {
    padding: 9px 18px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--card); color: var(--muted); font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all .18s;
  }
  .cat-btn:hover { color: var(--text); border-color: var(--accent); }
  .cat-btn.active { background: var(--card2); color: var(--accent); border-color: var(--accent); }
  .cat-progress { font-size: 12px; opacity: .75; margin-left: 4px; }

  .level-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 680px) { .level-grid { grid-template-columns: 1fr; } }
  @media (min-width: 1400px) { .level-grid { grid-template-columns: 1fr 1fr 1fr; gap: 16px; } }
  .level-card {
    position: relative; text-align: left; padding: 18px 20px; border-radius: 14px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    cursor: pointer; transition: all .18s; font-size: 14px; font-weight: 600; line-height: 1.6;
  }
  .level-card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .level-card .meta { display: block; margin-top: 6px; font-size: 12px; font-weight: 400; color: var(--muted); }
  .level-card.done { opacity: .45; border-color: var(--green); }
  .level-card.done:hover { opacity: .7; }
  .done-badge { position: absolute; top: 12px; right: 14px; color: var(--green); font-size: 18px; font-weight: 700; }

  .back-btn { background: none; border: none; color: var(--muted); font-size: 14px; cursor: pointer; margin-bottom: 16px; padding: 6px 0; }
  .back-btn:hover { color: var(--accent); }
  .q-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px 30px; }
  .q-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .q-case {
    background: var(--card2); border-left: 4px solid var(--accent); border-radius: 0 10px 10px 0;
    padding: 16px 18px; font-size: 14px; color: #b9c4cf; margin-bottom: 18px; white-space: pre-line;
  }
  .q-question { font-size: 15px; font-weight: 600; color: var(--accent); margin-bottom: 20px; white-space: pre-line; }
  .multi-hint { font-size: 12px; color: var(--orange); margin: -12px 0 16px; }
  .points-hint { font-size: 12px; color: var(--muted); margin: -12px 0 16px; }

  .opt-row {
    display: flex; gap: 12px; align-items: flex-start; padding: 13px 16px; margin-bottom: 10px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--bg);
    cursor: pointer; transition: all .15s; font-size: 14px;
  }
  .opt-row:hover { border-color: var(--accent); }
  .opt-row.sel { border-color: var(--accent); background: rgba(79,140,255,.12); }
  .opt-letter {
    flex: none; width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px;
    color: var(--muted); background: var(--card);
  }
  .opt-row.sel .opt-letter { background: var(--accent); color: #fff; border-color: var(--accent); }
  .opt-row.correct { border-color: var(--green); background: var(--green-bg); cursor: default; }
  .opt-row.correct .opt-letter { background: var(--green); color: #062b18; border-color: var(--green); }
  .opt-row.wrong { border-color: var(--red); background: var(--red-bg); cursor: default; }
  .opt-row.wrong .opt-letter { background: var(--red); color: #fff; border-color: var(--red); }
  .opt-row.locked { cursor: default; }
  .opt-row.locked:hover { border-color: var(--border); }
  .opt-row.correct:hover { border-color: var(--green); }
  .opt-row.wrong:hover { border-color: var(--red); }

  /* ------- 作答输入框（加大，支持多行） ------- */
  .point-row { margin-bottom: 24px; }
  .point-label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
  .point-row textarea, .subj-row textarea, .point-row input, .subj-row input {
    width: 100%; display: block; box-sizing: border-box;
    padding: 16px 18px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text);
    font-size: 15px; line-height: 1.85; font-family: inherit; resize: vertical;
  }
  .point-row textarea:focus, .subj-row textarea:focus,
  .point-row input:focus, .subj-row input:focus { outline: none; border-color: var(--accent); }
  .point-input { min-height: 84px; }
  .subj-input { min-height: 140px; }
  .subj-row { margin-bottom: 18px; display: flex; align-items: flex-start; gap: 12px; }
  .subj-row .num {
    flex: none; margin-top: 14px; width: 32px; height: 32px; border-radius: 8px; background: var(--card2);
    border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: var(--accent);
  }

  /* ------- 主观题：左案例(40%) / 右作答(60%)，大屏左右分栏、小屏上下排列 ------- */
  .split-layout {
    display: grid; grid-template-columns: 40fr 60fr; gap: 24px;
    align-items: stretch; min-height: 80vh;
  }
  @media (max-width: 980px) {
    .split-layout { grid-template-columns: 1fr; min-height: 0; }
    .split-left .q-card { position: static; max-height: none; }
  }
  /* ------- Written 解析：采分点卡片 ------- */
  .pt-card {
    border: 1px solid var(--border); border-radius: 14px; background: var(--card2);
    margin-bottom: 18px; overflow: hidden;
  }
  .pt-card.hit { border-left: 4px solid var(--green); }
  .pt-card.miss { border-left: 4px solid var(--orange); }
  .pt-card.alt { border-left: 4px solid var(--muted); opacity: .92; }
  .pt-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 18px; background: var(--card); border-bottom: 1px solid var(--border);
    font-size: 13.5px; font-weight: 700;
  }
  .pt-head .pt-no { letter-spacing: .3px; }
  .pt-badge { font-size: 12px; padding: 3px 11px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
  .pt-card.hit  .pt-badge { background: var(--green-bg); color: var(--green); }
  .pt-card.miss .pt-badge { background: rgba(224,163,74,.14); color: var(--orange); }
  .pt-card.alt  .pt-badge { background: rgba(139,152,165,.16); color: var(--muted); }
  .pt-block { padding: 14px 18px; }
  .pt-block + .pt-block { border-top: 1px dashed var(--border); }
  .pt-label { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 8px; letter-spacing: .4px; }
  .pt-block.user  .pt-text { font-size: 15px; line-height: 1.85; white-space: pre-wrap; word-break: break-word; }
  .pt-block.model .pt-text { font-size: 16.5px; line-height: 1.95; white-space: pre-wrap; word-break: break-word; }
  .pt-empty { color: var(--muted); font-style: italic; }
  .pt-kws { padding: 0 18px 14px; display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
  .pt-kws .cap { font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .kw-hit, .kw-miss { border-radius: 4px; padding: 0 3px; font-weight: 700; }
  .kw-hit  { color: var(--green);  background: var(--green-bg); }
  .kw-miss { color: var(--orange); background: rgba(224,163,74,.13); }

  .split-left, .split-right { display: flex; flex-direction: column; min-height: 80vh; }
  .split-left .q-card, .split-right .q-card { flex: 1; }
  .split-left .q-card {
    position: sticky; top: 18px; max-height: calc(100vh - 48px); overflow-y: auto;
  }
  .split-left .q-case { max-height: none; }
  .split-right .q-card { padding: 24px 26px; }
  .split-empty { color: var(--muted); font-size: 13px; }
  .point-tip {
    display: block; margin-top: 6px; font-size: 11.5px; color: var(--muted); font-weight: 400;
  }

  textarea.note-area {
    width: 100%; min-height: 90px; resize: vertical; border-radius: 12px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    padding: 16px; font-size: 14px; line-height: 1.8; font-family: inherit;
  }
  textarea.note-area:focus { outline: none; border-color: var(--accent); }

  .submit-btn {
    display: block; width: 100%; margin-top: 22px; padding: 14px; border: none; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; transition: all .18s;
  }
  .submit-btn:hover { filter: brightness(1.12); }

  .judge-banner {
    text-align: center; padding: 16px; border-radius: 14px; margin-bottom: 18px;
    font-size: 17px; font-weight: 700; border: 1px solid transparent;
  }
  .judge-banner.right { background: var(--green-bg); border-color: rgba(52,199,123,.4); color: var(--green); }
  .judge-banner.wrong { background: var(--red-bg); border-color: rgba(229,83,75,.5); color: var(--red); }
  .score-banner {
    text-align: center; padding: 18px; border-radius: 14px; margin-bottom: 20px;
    background: var(--card); border: 1px solid var(--border); font-size: 16px; font-weight: 700;
  }
  .score-banner .num { color: var(--accent); font-size: 24px; }

  .explain-box {
    background: var(--green-bg); border-left: 4px solid var(--green); border-radius: 0 12px 12px 0;
    padding: 18px 20px; margin-bottom: 20px; font-size: 14px;
  }
  .explain-box .ex-title { font-weight: 700; color: var(--green); margin-bottom: 8px; }
  .explain-box .ex-item { color: var(--text); margin-bottom: 8px; white-space: pre-line; }

  /* Written-question result page: three blocks */
  .block-title {
    font-size: 15px; font-weight: 700; color: var(--text); margin: 26px 0 14px;
    padding-left: 12px; border-left: 4px solid var(--accent);
  }
  .my-answer-box { background: var(--card2); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; }
  .my-answer-item { font-size: 14px; padding: 8px 0; border-bottom: 1px dashed var(--border); white-space: pre-wrap; word-break: break-word; }
  .my-answer-item:last-child { border-bottom: none; }
  .my-answer-item .n { color: var(--accent); font-weight: 700; margin-right: 8px; }

  .ref-card {
    background: var(--card2); border: 1px solid var(--border); border-left: 4px solid var(--green);
    border-radius: 0 12px 12px 0; padding: 18px 22px; margin-bottom: 14px;
  }
  .ref-card .ref-head { font-size: 13px; font-weight: 700; color: var(--green); margin-bottom: 10px; }
  .ref-card .ref-text { font-size: 18px; line-height: 1.9; color: #eef3f8; font-weight: 500; white-space: pre-line; }

  .cmp-card { border-radius: 12px; padding: 16px 20px; margin-bottom: 12px; border: 1px solid transparent; }
  .cmp-card.hit { background: var(--green-bg); border-color: rgba(52,199,123,.4); }
  .cmp-card.miss { background: rgba(224,163,74,.10); border-color: rgba(224,163,74,.45); }
  .cmp-card .cmp-head { font-weight: 700; margin-bottom: 8px; font-size: 14px; }
  .cmp-card.hit .cmp-head { color: var(--green); }
  .cmp-card.miss .cmp-head { color: var(--orange); }
  .cmp-card .cmp-user { font-size: 13px; color: var(--muted); margin-top: 8px; white-space: pre-wrap; word-break: break-word; }
  .kw-chip {
    display: inline-block; padding: 2px 9px; border-radius: 6px; font-size: 12px; font-weight: 600;
    margin: 3px 5px 0 0;
  }
  .kw-chip.hit { background: rgba(52,199,123,.22); color: var(--green); }
  .kw-chip.miss { background: rgba(229,83,75,.2); color: var(--red); border: 1px dashed rgba(229,83,75,.6); }

  .result-item { border-radius: 12px; padding: 16px 20px; margin-bottom: 14px; font-size: 14px; border: 1px solid transparent; }
  .result-item.hit { background: var(--green-bg); border-color: rgba(52,199,123,.4); }
  .result-item.miss { background: var(--red-bg); border-color: rgba(229,83,75,.5); }
  .result-item .r-head { font-weight: 700; margin-bottom: 8px; }
  .result-item.hit .r-head { color: var(--green); }
  .result-item.miss .r-head { color: var(--red); }
  .result-item .r-answer { color: var(--text); line-height: 1.8; white-space: pre-line; }
  .result-item .r-user { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 13px; color: var(--muted); white-space: pre-wrap; word-break: break-word; }

  .note-box { background: var(--card2); border: 1px dashed var(--border); border-radius: 12px; padding: 18px 20px; margin: 24px 0 4px; }
  .note-box .note-title { font-size: 14px; font-weight: 700; color: var(--orange); margin-bottom: 10px; }
  .note-save-btn {
    margin-top: 12px; padding: 10px 22px; border: none; border-radius: 10px;
    background: var(--orange); color: #2b1d05; font-size: 14px; font-weight: 700; cursor: pointer; transition: all .18s;
  }
  .note-save-btn:hover { filter: brightness(1.1); }
  .note-save-btn:disabled { opacity: .45; cursor: default; }
  .note-saved-tip { font-size: 13px; color: var(--green); margin-top: 10px; font-weight: 600; }

  .result-actions { display: flex; gap: 14px; margin-top: 24px; }
  .act-btn { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all .18s; }
  .act-btn.pass { background: var(--green); color: #062b18; }
  .act-btn.retry { background: var(--red); color: #fff; }
  .act-btn:hover { filter: brightness(1.12); }

  .nb-group { margin-bottom: 26px; }
  .nb-group-title { font-size: 15px; font-weight: 700; color: var(--accent); margin-bottom: 12px; padding-left: 12px; border-left: 4px solid var(--accent); }
  .nb-entry { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; margin-bottom: 12px; }
  .nb-entry-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .nb-entry-title { font-size: 13px; font-weight: 700; color: var(--text); }
  .nb-entry-time { font-size: 11px; color: var(--muted); flex: none; }
  .nb-entry-text { font-size: 14px; color: #b9c4cf; white-space: pre-wrap; word-break: break-word; }
  .nb-del { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; font-size: 11px; padding: 3px 10px; cursor: pointer; margin-top: 10px; }
  .nb-del:hover { color: var(--red); border-color: var(--red); }
  .nb-empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 14px; }

  .reset-link { display: block; text-align: center; margin-top: 40px; color: var(--muted); font-size: 12px; background: none; border: none; cursor: pointer; width: 100%; }
  .reset-link:hover { color: var(--red); }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="app-header">
    <h1>📚 ACCA AA Practice Bank</h1>
    <p>MCQs × Templates × Written Questions × 2 Notebooks · Progress auto-saved</p>
  </div>
  <div id="app"></div>
  <button class="reset-link" onclick="resetProgress">Clear all pass records</button>
</div>

<!-- Fallback: a script error must never leave the page blank -->
<script>
window.addEventListener("error", function (e) {
  var el = document.getElementById("app");
  if (el && !el.innerHTML) {
    el.innerHTML = '<div class="nb-empty" style="color:#e5534b;text-align:left;white-space:pre-wrap">'
      + '⚠️ Script error: ' + (e && (e.message || e.type) || "unknown") + '</div>';
  }
});
</script>

<script>
const questionBank = [
{"id":1,"type":"objective","category":"IC","title":"Case 1: Petra Co — control objective of the sales system (MJ23)","caseText":"Petra Co is a listed company which manufactures handbags. The company is undertaking an internal control audit of its sales system.","question":"Which of the following is a control objective of the sales system?","options":["To ensure that all sales invoices are recorded accurately","To ensure that cash receipts are banked promptly","To ensure that purchase orders are properly authorised","To ensure that payroll calculations are free from error"],"correct":["A"],"modelAnswer":["Correct answer: A. A control objective of the sales system is to ensure that all sales invoices are recorded accurately.","Further control objectives of the sales system include: only orders for goods which are in stock are accepted; orders are recorded completely and accurately; goods are not supplied to customers with poor credit; and goods are despatched on a timely basis.","B is a control objective of the cash receipts cycle, C relates to the purchases cycle and D relates to the payroll cycle."]},
{"id":2,"type":"objective","category":"IC","title":"Case 2: Granstan Co — direct controls (SD24)","caseText":"Granstan Co sells electronic kitchen appliances through 40 stores nationwide. The auditor is evaluating the direct controls within the sales system.","question":"Which of the following constitutes a direct control within the sales system?","options":["The credit control department sets customer credit limits","Credit limits are authorised by the finance director and reviewed regularly","Sales orders are entered into the system by sales staff","Sales invoices are raised by the finance department"],"correct":["B"],"modelAnswer":["Correct answer: B. A direct control is one which directly addresses a specific risk of material misstatement at the assertion level. The authorisation and regular review of credit limits directly reduces the risk of irrecoverable debts and lost sales, so it is a direct control.","Direct controls usually involve a documented review, authorisation, reconciliation or segregation of duties that can be tested by inspecting evidence of its operation.","A and C merely describe who performs a task, and D is a processing step. None of them directly prevents or detects a misstatement."]},
{"id":3,"type":"objective","category":"IC","title":"Case 3: The five components of internal control — ISA 315 (SD24)","caseText":"","question":"ISA 315 defines five components of internal control. Which of the following falls within information system and communication?","options":["Management's attitude and awareness towards internal control","The company's process for identifying and assessing risks","The processes used to record and process transactions, assets and liabilities","Segregation of duties and authorisation of transactions"],"correct":["C"],"modelAnswer":["Correct answer: C. The information system and communication component comprises the processes and records that initiate, record, process and report transactions, and that maintain accountability for assets and liabilities.","The five components are: the control environment; the entity's risk assessment process; the information system and communication; control activities; and monitoring of controls.","A is part of the control environment, B is the entity's risk assessment process and D is a control activity."]},
{"id":4,"type":"objective","category":"IC","title":"Case 4: Petra Co — test of control over pay rate input in the payroll cycle (MJ23)","caseText":"Petra Co's payroll system automatically calculates gross and net pay. Employees' hourly pay rates are entered into the system by the HR department.","question":"Which of the following is a valid test of control over the input of pay rates in the payroll cycle?","options":["Recalculate the total payroll expense and agree it to the payroll","Inspect evidence that pay rates were entered and reviewed by an appropriately authorised official","Select a sample of wages and agree them to the bank statement","Analyse the variance between monthly payroll costs and budget"],"correct":["B"],"modelAnswer":["Correct answer: B. A test of control is designed to test how the control was applied, the consistency with which it was applied during the period and by whom it was applied. Inspecting evidence of authorisation and review of pay rate inputs does exactly that.","Typical tests of control include inspection of documentation, observation of a process, enquiry of staff, re-performance of the control and, for automated controls, using audit software to test the configuration.","A, C and D are substantive procedures, since they test the amounts recorded rather than the operation of the control."]},
{"id":5,"type":"objective","category":"IC","title":"Case 5: Petra Co — sales department does not receive a copy of the sales order (MJ23)","caseText":"Petra Co has identified the following issue: the sales department does not receive a copy of the sales order.","question":"What risk arises because the sales department does not receive a copy of the sales order?","options":["Revenue is understated","The sales department cannot monitor the status of orders, which may result in unfulfilled orders","Credit limits are abused","Invoice amounts are inaccurate"],"correct":["B"],"modelAnswer":["Correct answer: B. If the sales department does not receive a copy of the sales order it cannot monitor the status of orders, and unfulfilled orders may therefore go undetected.","The recommended control is that the sales order should be prepared in several copies, with one copy retained by the sales department, one sent to the warehouse and one to the finance department.","The missing copy does not directly affect the value of revenue recorded, the operation of credit limits or the accuracy of invoice prices."]},
{"id":6,"type":"objective","category":"SP","title":"Case 6: Distinguishing tests of control from substantive procedures (MJ23 · Petra Co)","caseText":"","question":"Which of the following is a substantive procedure rather than a test of control?","options":["Inspecting evidence that pay rates were entered by an authorised official","Selecting a sample of wages and agreeing them to the payroll records","Observing whether the clocking in process is supervised","Inspecting evidence that overtime has been authorised"],"correct":["B"],"modelAnswer":["Correct answer: B. Agreeing a sample of wages to the payroll records re-performs the processing of the amount and therefore tests the figure recorded, which is a substantive procedure.","Substantive procedures comprise tests of details of transactions, balances and disclosures, together with substantive analytical procedures.","A, C and D all test whether a control operated, so they are tests of control."]},
{"id":7,"type":"objective","category":"SP","title":"Case 7: Petra Co — substantive procedures for purchases (MJ23)","caseText":"The auditor is performing substantive procedures in respect of purchases and expenses at Petra Co.","question":"Which of the following is a correct substantive procedure for purchases?","options":["Selecting a sample of payables balances and agreeing them to supplier statements","Selecting a sample of goods received notes and tracing them to the purchases day book, to confirm the completeness of recorded purchases","Inspecting purchase orders for evidence of authorisation","Observing the goods received process for evidence of quality checks"],"correct":["B"],"modelAnswer":["Correct answer: B. Tracing from goods received notes to the purchases day book tests whether goods received have been recorded, which tests the completeness of purchases.","Completeness is tested by starting from an independent source document and following it into the accounting records, whereas occurrence is tested by vouching from the records back to the source document.","C and D are tests of control, not substantive procedures. A is a substantive procedure over the payables balance rather than over the purchases figure itself."]},
{"id":8,"type":"objective","category":"SP","title":"Case 8: Assertions — understatement of trade payables (mixed)","caseText":"","question":"The auditor is concerned that trade payables are understated. Which assertion is primarily affected?","options":["Existence","Completeness","Accuracy, valuation and allowance","Rights and obligations"],"correct":["B"],"modelAnswer":["Correct answer: B. Understatement means that liabilities which exist have not been recorded, so the completeness assertion is affected.","Completeness: liabilities, transactions and events which should have been recorded have been recorded, and all related disclosures have been included.","Existence addresses overstatement, accuracy addresses the amount at which the balance is recorded, and rights and obligations addresses whether the entity has a genuine obligation."]},
{"id":9,"type":"objective","category":"SP","title":"Case 9: Cut-off testing (mixed)","caseText":"","question":"Which of the following is a correct cut-off test?","options":["Selecting a sample of sales invoices raised before and after the year end and tracing them to goods despatch notes, to confirm recording in the correct accounting period","Selecting a sample of receivable balances and agreeing them to customer confirmations","Inspecting sales invoices for evidence of authorisation","Analysing the gross profit margin against the prior year"],"correct":["A"],"modelAnswer":["Correct answer: A. Cut-off testing confirms that transactions are recorded in the correct accounting period, which is achieved by selecting invoices either side of the year end and agreeing them to despatch documentation.","For sales, the critical document is usually the goods despatch note; for purchases, it is the goods received note.","B tests existence, C is a test of control and D is an analytical procedure."]},
{"id":10,"type":"objective","category":"SP","title":"Case 10: Selecting balances for confirmation — completeness of trade payables (mixed)","caseText":"","question":"The auditor wishes to test the completeness of trade payables. Which suppliers should be selected for confirmation?","options":["Suppliers with large year-end balances","Suppliers with small or zero year-end balances but a high volume of transactions during the year","Newly established suppliers","Related party suppliers"],"correct":["B"],"modelAnswer":["Correct answer: B. Where the objective is completeness, the auditor is looking for liabilities which have been omitted, so suppliers with small or nil balances but significant transaction volumes are the most likely to reveal unrecorded amounts.","Conversely, where the objective is existence or valuation of recorded payables, the auditor selects the larger year-end balances.","The age or related party status of a supplier does not by itself determine which assertion is being tested."]},
{"id":11,"type":"objective","category":"SP","title":"Case 11: Bell Co — substantive procedures for depreciation expense (MJ26)","caseText":"Bell Co is a food manufacturing company. The financial statements show a depreciation charge of $230,000 (prior year $290,000). The finance director has advised that depreciation rates were amended several times during the year and that surplus equipment was sold at a loss of $120,000.","question":"Which TWO of the following are substantive procedures in respect of the depreciation charge for the year ended 20X5?","options":["Selecting a sample of assets and recalculating the depreciation charge using Bell Co's new policy, and investigating any differences","Recalculating the loss on disposal of $120,000 and confirming that it has been properly recorded","Reviewing the board minutes to confirm that the change in depreciation policy was authorised","Reviewing the reasonableness of the depreciation policy, given the loss on disposal of $120,000 in the year"],"correct":["A","D"],"modelAnswer":["Correct answers: A and D. A is a test of detail which recalculates the charge using the new policy, and D is a substantive review of the reasonableness of the depreciation policy and rates applied in the year.","Because the rates were amended several times and the disposal resulted in a loss, the auditor is concerned with both the accuracy and the reasonableness of the depreciation charge.","B is a substantive procedure over the disposal rather than over the depreciation charge itself, and C is a test of control over the authorisation of the policy change."]},
{"id":12,"type":"objective","category":"SP","title":"Case 12: Bell Co — audit procedures for a legal claim provision (MJ26)","caseText":"Bell Co discovered that the ingredients label on its new Zeta sauce product was incorrect. A customer became ill after eating the product due to an allergy to one of the ingredients. Bell Co is being sued by the customer. The directors believe the company will lose the case and have recognised a provision of $200,000 in the financial statements.","question":"Which TWO audit procedures would provide sufficient appropriate audit evidence in respect of the legal claim provision?","options":["Inspecting Bell Co's correspondence with customers to confirm whether there are any other claims which require a provision","Comparing this year's provision with the prior year and discussing the difference with management","Obtaining confirmation from Bell Co's lawyers regarding the likely outcome of the case","Circularising Bell Co's customers to confirm the amount of the claim"],"correct":["A","C"],"modelAnswer":["Correct answers: A and C. Inspecting customer correspondence (A) provides evidence of whether any other claims exist and therefore of the completeness of provisions, and a letter of enquiry to the entity's lawyers (C) provides independent external evidence of both the likelihood and the amount of the payment.","Under ISA 501 the auditor should request a letter of enquiry from the entity's external lawyers where litigation and claims are material.","B is an analytical procedure, and analytical procedures are not appropriate for a provision because it does not arise from routine trading transactions. D would not provide reliable evidence, since the customer is the claimant and has an incentive to overstate the amount."]},
{"id":13,"type":"objective","category":"SP","title":"Case 13: Bell Co — net realisable value of inventory (MJ26)","caseText":"At the year end, Bell Co still holds a significant quantity of the incorrectly labelled Zeta sauce. In order to sell the product it will need to be relabelled and sold at a reduced price.","question":"Which audit procedure would determine whether the inventory write-down of Zeta sauce is appropriate?","options":["Selecting a sample of goods despatch notes for Zeta sauce before the year end, to ensure the related goods are excluded from inventory","Agreeing the total quantity of Zeta sauce per the final inventory listing to the inventory count sheets","Confirming the sales price of Zeta sauce by agreeing it to post year-end sales invoices, and comparing this to cost","Agreeing recent raw material purchase invoices to confirm that they are in the name of Bell Co"],"correct":["C"],"modelAnswer":["Correct answer: C. Net realisable value is the estimated selling price in the ordinary course of business less the estimated costs of completion and sale, so agreeing the actual post year-end selling price and comparing it to cost directly tests whether the write-down to NRV is appropriate under IAS 2.","Reviewing post year-end sales invoices is one of the most reliable ways of obtaining evidence about the NRV of inventory held at the year end.","A tests cut-off, B tests the existence and quantities of inventory counted, and D tests rights and obligations."]},
{"id":14,"type":"objective","category":"SP","title":"Case 14: Bell Co — ranking the reliability of audit evidence (MJ26)","caseText":"The directors of Bell Co receive an annual bonus based on profit before tax. An accrual of $75,000 has been recognised in the financial statements in respect of the bonus. Four items of evidence are available: (1) the board minutes approving the basis of calculation of the directors' bonus for the year; (2) a calculation of the bonus accrual prepared and reviewed by the finance director; (3) a discussion between the audit assistant and the payroll clerk regarding the basis of calculation of the bonus; and (4) an audit working paper prepared by the audit assistant recalculating the bonus accrual and agreeing it to the directors' service contracts.","question":"Rank the evidence in order of relevance and reliability, starting with the most relevant and reliable.","options":["(4) → (2) → (1) → (3)","(2) → (4) → (3) → (1)","(1) → (4) → (2) → (3)","(4) → (1) → (2) → (3)"],"correct":["A"],"modelAnswer":["Correct answer: A — (4) → (2) → (1) → (3). The auditor's own recalculation agreed to the external service contracts (4) is the most relevant and reliable, because it is generated by the auditor and corroborated by external contractual terms.","General rules on reliability: evidence obtained from external sources is more reliable than that generated internally; evidence generated by the auditor is more reliable than that obtained from the entity; documentary evidence is more reliable than oral evidence; and original documents are more reliable than copies.","The board minutes (1) confirm authorisation of the basis but not the amount, and the oral discussion with the payroll clerk (3) is the least reliable of the four."]},
{"id":15,"type":"objective","category":"OTHER","title":"Case 15: Doge & Co — limited assurance versus reasonable assurance (MJ22)","caseText":"Doge & Co is considering accepting four new client engagements. One of these is a limited assurance review of the financial statements of Bradgate Co.","question":"Which TWO of the following are procedures performed in a limited assurance review?","options":["Enquiring of management regarding significant and unusual items in the financial statements","Performing analytical procedures to understand the relationships between financial statement items","Performing tests of control to obtain an understanding of the company's internal control","Performing extensive tests of detail on all balances"],"correct":["A","B"],"modelAnswer":["Correct answers: A and B. A review engagement consists primarily of enquiry of management and analytical procedures, and provides limited (moderate) assurance that the financial statements are free from material misstatement.","A review provides a negative form of conclusion: nothing has come to the auditor's attention which suggests that the financial statements are not prepared, in all material respects, in accordance with the applicable framework.","Tests of control (C) and extensive tests of detail (D) are procedures performed in a reasonable assurance audit, which gives a positive form of opinion."]},
{"id":16,"type":"objective","category":"OTHER","title":"Case 16: Trimp Transport — three-party relationship in an assurance engagement (MJ22)","caseText":"The board of Trimp Transport Co has asked Doge & Co to assess the company's key performance indicators (KPIs) and to report to the board on whether the KPIs have been achieved. The board will provide the books and records relating to the KPIs.","question":"Which element required by the assurance framework is missing from this engagement?","options":["A three-party relationship","A suitable subject matter","The ability to gather sufficient appropriate evidence","A written report containing a formed conclusion"],"correct":["A"],"modelAnswer":["Correct answer: A. An assurance engagement requires a three-party relationship comprising the practitioner, the responsible party and the intended users. Here the board is both the responsible party and the only intended user, so no separate user group exists and the three-party relationship is missing.","The five elements of an assurance engagement are: a three-party relationship; a suitable subject matter; suitable criteria; sufficient appropriate evidence; and a written assurance report.","The KPIs are suitable subject matter, the books and records provide a basis for evidence, and a written report to the board is contemplated."]},
{"id":17,"type":"objective","category":"OTHER","title":"Case 17: Signal Co — end of the subsequent events review period under ISA 560 (MJ24)","caseText":"Signal Co is an oil exploration company. The audit fieldwork will be completed on 7 July, the financial statements will be approved by the board on 15 July, the auditor's report will be signed on 17 July, and the financial statements will be issued to shareholders on 30 July.","question":"ISA 560 Subsequent Events requires the auditor to perform procedures to identify subsequent events. For Signal Co, what is the end date of this review period?","options":["7 July (audit fieldwork completed)","15 July (financial statements approved by the board)","17 July (auditor's report signed)","30 July (financial statements issued to shareholders)"],"correct":["C"],"modelAnswer":["Correct answer: C — 17 July, the date the auditor's report is signed. Under ISA 560 the auditor's active subsequent events review procedures cover the period from the date of the financial statements to the date of the auditor's report.","After the auditor's report is signed, the auditor has no obligation to perform further procedures, but must consider any facts which become known before the financial statements are issued.","Fieldwork completion (A) and board approval (B) occur earlier, and the issue date to shareholders (D) falls after the report is signed."]},
{"id":18,"type":"objective","category":"OTHER","title":"Case 18: Signal Co — refinery fire and going concern (MJ24)","caseText":"A major refinery of Signal Co was damaged by a fire on 30 April, destroying assets with a carrying amount of $40 million. The refinery has continued to experience production problems since the fire. The year end is 31 March. Three procedures are proposed: (1) enquire whether Signal Co has recognised a provision in the 20X5 financial statements for the replacement of the assets and confirm the basis of the calculation; (2) review the cash flow forecast for the year ending 31 March 20X6 to assess the impact of replacing the assets; and (3) discuss with the directors the continuing impact on Signal Co's production activities and their assessment of when production will resume.","question":"Which procedures should the auditor perform in respect of the refinery fire?","options":["(1) and (2)","(1) and (3)","(2) and (3)","(1), (2) and (3)"],"correct":["C"],"modelAnswer":["Correct answer: C — (2) and (3). The fire occurred after the reporting date, so it is a non-adjusting event: no provision for the replacement of the assets should be recognised in the 20X5 financial statements, and procedure (1) is therefore inappropriate.","Reviewing the cash flow forecast (2) and discussing the continuing impact and expected resumption of production with the directors (3) are the appropriate procedures for assessing whether the going concern basis remains appropriate and whether the non-adjusting event is adequately disclosed.","Where a material non-adjusting event occurs, the entity should disclose the nature of the event and an estimate of its financial effect under IAS 10."]},
{"id":19,"type":"objective","category":"OTHER","title":"Case 19: Adventure Time Co — overdue audit fees and the self-interest threat (SD24)","caseText":"The western office of Green & Co audits Adventure Time Co. Adventure Time Co has not paid a significant instalment of the prior year's audit fee.","question":"What threat is created by the overdue fee and what is the most appropriate safeguard?","options":["Self-review threat — change the audit partner","Self-interest threat — obtain payment of the overdue fee before the audit report is issued","Familiarity threat — perform an independent review","Intimidation threat — decline the audit engagement"],"correct":["B"],"modelAnswer":["Correct answer: B. Overdue fees create a self-interest threat, because the firm may be perceived as having a financial interest in the client which could influence its judgement, for example a reluctance to issue a modified report while money is owed.","The appropriate safeguard is for the firm to obtain payment of the overdue fee before the audit report is issued, and, where relevant, to have an appropriate reviewer who was not involved in the audit review the work.","A self-review threat arises where the auditor audits its own work, familiarity from a long or close relationship, and intimidation from actual or perceived pressure. None of these is created by overdue fees alone."]},
{"id":20,"type":"objective","category":"OTHER","title":"Case 20: Signal Co — classification of subsequent events under IAS 10 (MJ24)","caseText":"During the audit fieldwork of Signal Co the following subsequent events were identified. Customer liquidation: a customer owing Signal Co $930,000 at the year end went into liquidation on 15 April, and the liquidator has indicated that the amount is unlikely to be recovered. Dividends: on 30 April Signal Co declared a significant final dividend in respect of the year ended 31 March.","question":"In accordance with IAS 10 Events after the Reporting Period, which of the following correctly classifies these two events?","options":["Customer liquidation: adjusting event; dividend: non-adjusting event requiring disclosure","Customer liquidation: non-adjusting event requiring disclosure; dividend: non-adjusting event with no disclosure required","Customer liquidation: adjusting event; dividend: adjusting event","Customer liquidation: non-adjusting event with no disclosure required; dividend: adjusting event"],"correct":["A"],"modelAnswer":["Correct answer: A. The customer's liquidation provides further evidence of the recoverability of a receivable which existed at the reporting date, so it is an adjusting event and the receivables balance should be written down. A dividend declared after the reporting period is a non-adjusting event, but because of its significance it must be disclosed.","Adjusting events are those which provide evidence of conditions which existed at the end of the reporting period; non-adjusting events are those which are indicative of conditions which arose after the reporting period.","The dividend does not represent a liability at the year end because it had not been declared or approved at that date."]},
{"id":21,"type":"objective","category":"OTHER","title":"Case 21: Adventure Time Co — contingent fees (SD24)","caseText":"The directors of Adventure Time Co have asked Green & Co to prepare the company's tax return and to provide some routine administrative services. These services would be provided by the eastern office of Green & Co. The fees for this work would be charged on a contingent basis and could be significant to the firm. Two services are proposed: (1) preparation of the tax return and (2) routine administrative services.","question":"In respect of these additional services, which one could Green & Co accept on a contingent fee basis?","options":["(1) only","(2) only","Both (1) and (2)","Neither (1) nor (2)"],"correct":["D"],"modelAnswer":["Correct answer: D — neither (1) nor (2). Green & Co is the external auditor of Adventure Time Co, and a firm must not charge a contingent fee for professional services provided to an audit client, as this creates a significant self-interest threat to objectivity and independence.","A contingent fee is a fee calculated on a predetermined basis relating to the outcome or result of a transaction, such as a percentage of the tax saving achieved.","Charging a contingent fee is prohibited for an assurance engagement, and the prohibition also extends to other services such as tax and routine administrative work provided to an audit client."]},
{"id":22,"type":"objective","category":"OTHER","title":"Case 22: Albatross Co — the audit risk model (MJ26)","caseText":"","question":"Which of the following is the correct definition of inherent risk?","options":["The risk arising from the nature of the company's business","The susceptibility of an assertion about a class of transaction, account balance or disclosure to a material misstatement, before consideration of any related controls","The risk that the auditor fails to detect a material misstatement","The risk that internal control fails to prevent, or detect and correct, a material misstatement"],"correct":["B"],"modelAnswer":["Correct answer: B. Inherent risk is the susceptibility of an assertion to a material misstatement before consideration of any related controls.","Audit risk is a function of the risks of material misstatement and detection risk, where the risk of material misstatement comprises inherent risk and control risk. Audit risk = inherent risk × control risk × detection risk.","A is too vague to be a definition, C describes detection risk, and D describes control risk."]},
{"id":23,"type":"objective","category":"OTHER","title":"Case 23: Kamari Co — outsourcing internal audit (MJ23)","caseText":"Kamari Co is considering establishing an internal audit department. The directors have asked whether Thira & Co could provide the internal audit service. They plan that the first assignment of the internal audit team would be to review the processing of sales orders and sales invoices, as a new system is in use.","question":"Which TWO of the following are potential disadvantages to Kamari Co of outsourcing internal audit to Thira & Co?","options":["The internal audit team will bring a wider range of experience","A self-review threat may be created in respect of the external audit","A conflict of interest may arise with the review of financial forecasts","The internal audit team will have a lesser understanding of the company's business"],"correct":["B","D"],"modelAnswer":["Correct answers: B and D. Outsourcing to the external auditor creates a self-review threat if the internal audit work is then relied upon in the external audit (B), and external staff will have a lesser understanding of Kamari Co's business than an in-house team (D).","Other common disadvantages include a lower level of commitment to the entity, the risk that the service is not tailored to the entity's needs, and the potential fee level.","A is an advantage of outsourcing, and C is not relevant as no engagement to review financial forecasts is being provided."]},
{"id":101,"type":"template","category":"IC","title":"Level: IC internal control answer template (three-column all-purpose structure)","caseText":"","question":"Recall the three-column structure for answering IC deficiency questions (Deficiency / Recommendation / Test of control).","labels":["Deficiency — how to write it (state the issue + cause + effect)","Recommendation — how to write it","Test of control — how to write it"],"modelAnswer":["Deficiency: state the issue found in the scenario (0.5 marks) + explain the cause (for example the sales clerk is not senior enough / there is no segregation of duties / documents are not sequentially numbered) + state the effect (for example the risk of irrecoverable debts / loss of revenue / increased fraud risk) (0.5 marks).","Recommendation: propose an improvement that addresses the specific problem identified. It must be a complete sentence, not a phrase. Correct: \"The approved price should be pre-loaded, so that there would be no manual amendment of invoices.\" Wrong: \"Price should be pre-loaded.\"","Test of control: action (Inspect / Review / Observe / Enquire / Reattempt / Perform) + evidence (a sample of XXX documents) + purpose (to ensure / to confirm that the key control point is operating)."],"keywords":[["deficiency","cause","effect"],["complete sentence","recommendation"],["inspect","sample","to confirm"]]},
{"id":102,"type":"template","category":"IC","title":"Level: Sales cycle — complete internal control template (12 deficiencies)","caseText":"","question":"Recall the full wording of the 12 common internal control deficiencies in the sales cycle (effect + recommendation + test of control).","labels":["1. No segregation of duties: one person orders, invoices and collects cash","2. Credit check performed by someone insufficiently senior: a sales clerk sets credit limits","3. Credit limits not reviewed and updated regularly","4. Excessive master file access: a clerk can amend the master file","5. Manual amendment of prices: sales staff can manually change invoice prices","6. Sales orders not sequentially numbered: numbered by salesperson ID","7. GDNs use the same numbering sequence as sales orders","8. GDNs sent to finance too slowly: only every two weeks or weekly","9. Automatic invoicing: the invoice is raised as soon as the order is placed","10. Slow collections: customer service or sales only chase payment after 90 days","11. No customer statements are produced","12. Cashier, bookkeeping and bank reconciliation all done by the same person"],"modelAnswer":["Effect: there is a lack of segregation of duties, so errors will not be identified on a timely basis and the risk of fraud is also increased. Recommendation: the key roles of receiving customer orders, raising sales invoices and processing payments should be split between different individuals. Test of control: review the job descriptions of the staff who receive customer orders, raise sales invoices and process payments, to confirm that responsibilities are split.","Effect: sales ledger clerks are not sufficiently senior and may set credit limits too high, leading to irrecoverable debts, or too low, leading to a loss of sales. Recommendation: credit limits should be set by a senior member of the sales department and should be regularly reviewed by a responsible official. Test of control: inspect a sample of new customer files and review the authorisation of the credit limit to confirm it was set by a senior member of staff.","Effect: the credit limit is out of date and may be too high, leading to irrecoverable debts, or too low, leading to a loss of sales. Recommendation: customer credit limits should be reviewed regularly by a responsible official and should reflect the current spending pattern of customers. Test of control: inspect a sample of customer files and review the authorisation of the credit limit to confirm it is reviewed regularly.","Effect: the receivables ledger clerks are not senior enough to be given access to make changes to master file data, as this could increase the risk of error. Recommendation: only senior members of staff should be able to access the master data file to add new customers or make amendments, and the exception report of any changes should be reviewed regularly by a responsible official. Test of control: enquire of a sales clerk and ask them to attempt to access the master data file to make an amendment — the system should reject this.","Effect: as the sales clerk is not senior enough, manually amending the price may increase the risk of error and result in a loss of revenue. Recommendation: the approved price should be pre-loaded, so that there would be no manual amendment of invoices. Test of control: enquire of a sales clerk and ask them to attempt to amend the price on an invoice — the system should reject this.","Effect: these numbers are not sequential, making it difficult to identify missing orders and resulting in unfulfilled orders and customer dissatisfaction. Recommendation: sales orders should be sequentially numbered, and a sequence check of orders should be undertaken on a regular basis to identify any missing orders. Test of control: inspect a sample of sales orders to ensure that they are sequentially numbered.","Effect: as GDNs may not be raised in the same sequence as sales orders, it is difficult to identify whether any GDNs are missing, which will lead to unfulfilled orders. Recommendation: GDNs should be sequentially numbered using a sequence which is different from that of the order number, with a regular check undertaken to identify any missing documents. Test of control: inspect a sample of GDNs raised by the warehouse to ensure that they are sequentially numbered.","Effect: if the finance department does not receive GDNs promptly, this could result in dispatched goods being invoiced late and understating receivables. Recommendation: the copies of the GDNs should be sent to the finance department on a more frequent basis, such as daily. Test of control: observe the despatch process to ensure that GDNs are sent daily.","Effect: if goods are not despatched straight away, customers could be invoiced in advance of receipt of their goods. This is likely to lead to the early recognition of revenue and a loss of customer goodwill. Recommendation: the system should be amended so that it links into the despatch system; sales invoices should not be raised until after the goods have been despatched. Test of control: inspect a sample of invoices to ensure that all of them are supported by GDNs, or attempt to enter an online order which has not been dispatched — the invoicing system should reject it.","Effect: chasing payment is not the focus of the client service manager or the sales managers, which will result in irrecoverable debts. Recommendation: a credit controller should be appointed to chase any outstanding sales invoices which are more than 30 days old. Test of control: observe the cash collection process to confirm that a credit controller has been appointed.","Effect: if statements are not sent regularly, errors and any disputed invoices are not identified on a timely basis. Recommendation: the company should produce and send customer statements monthly for all customers. Test of control: review the file of, or a sample of, customer statements to confirm that they are being produced and sent each month.","Effect: there is a lack of segregation of duties, so errors will not be identified on a timely basis and the risk of fraud is also increased. Recommendation: the key roles of posting bank receipts, updating the sales ledger and performing bank reconciliations should be split between different individuals. Test of control: review the job descriptions for the posting of bank receipts and the updating of the cash book and sales ledger to confirm that responsibilities are split."],"keywords":[["segregation","split"],["senior","credit limit"],["reviewed regularly","credit limit"],["master","senior","exception report"],["pre-loaded","price"],["sequentially numbered","sequence"],["gdn","different","sequentially"],["daily","gdn","understat"],["despatch","early recognition","invoice"],["credit controller","30 days"],["statement","monthly"],["segregation","reconciliation","split"]]},
{"id":103,"type":"template","category":"IC","title":"Level: Purchases cycle — complete internal control template (10 deficiencies)","caseText":"","question":"Recall the full wording of the 10 common internal control deficiencies in the purchases cycle (effect + recommendation + test of control).","labels":["1. Small orders not authorised: no authorisation required below $**","2. Excessive master file access: everyone in purchasing can amend it","3. Goods received checked for quantity only, not agreed to the PO","4. Goods received checked for quantity but not quality","5. GRNs not sent to the purchasing department, only to finance","6. GRNs sent to finance too slowly: only once every two months","7. Invoices not agreed to the GRN: no matching before posting","8. Document count controls only: only a document count when entering invoices","9. Payment authorised on the summary total only: the FD reviews only the total","10. No monthly supplier statement reconciliations"],"modelAnswer":["Effect: it is possible for a clerk to buy personal (unauthorised) goods below $**, which could cause the company to pay additional costs. Recommendation: all purchase orders should be authorised by a responsible official. Test of control: select a sample of purchase orders and review them for evidence of authorisation by a responsible official.","Effect: all members of the purchasing department could amend the master file data and, as the exception report is not reviewed, unauthorised amendments would not be identified, resulting in incorrect payments. Recommendation: the ability to make amendments to master file data should be restricted to senior members of staff, and the monthly exception report of changes should be reviewed by a responsible official. Test of control: enquire of a member of staff who has no right to change the master file and ask them to attempt to amend it — the system should reject this.","Effect: goods are confirmed for quantities but not agreed to the original purchase order; this may lead to the company paying for goods which were not ordered. Recommendation: goods received should be agreed to the authorised purchase order, and the purchase order should be signed as evidence of the check. Test of control: inspect a sample of GRNs and confirm that they were compared with the purchase order and signed as evidence.","Effect: without checking quality, damaged goods may not be returned to suppliers immediately, which would increase the risk of overpayment to suppliers. Recommendation: all goods should be checked for damage on receipt and the GRN produced after the checking process. Test of control: inspect a sample of GRNs for the employee's signature confirming that the goods have been checked for damage, or observe the checking process to ensure that all goods are checked for damage.","Effect: this means the purchasing department cannot monitor the status of orders, resulting in a significant level of unfulfilled orders. Recommendation: the GRN should be created in three parts, with one copy to the purchasing department, one to the finance department and one for the warehouse. Test of control: select a sample of GRNs and review them to confirm they are created in three parts, or that a copy is sent to the purchasing department.","Effect: sending GRNs to finance only once every two months could result in delays in payment to suppliers and lead to supplier dissatisfaction. Recommendation: all GRNs should be sent to the accounts department on a more regular basis, such as daily. Test of control: discuss with the accounts clerk the frequency with which GRNs are received, to assess whether they are being sent promptly.","Effect: this could result in invoices being paid for goods which were not received, leading to an overpayment to suppliers for goods not received. Recommendation: all purchase invoices should be raised after the GRN and matched to both the purchase order and the related GRN. Test of control: select a sample of invoices and inspect them to confirm they have been matched to the relevant purchase order and GRN.","Effect: document count controls can confirm the completeness of input but not its accuracy, which will lead to over or underpayment. Recommendation: the purchase ledger clerk should apply application controls such as control totals, rather than just completeness checks, to ensure both completeness and accuracy. Test of control: observe the inputting of purchase invoices and identify what application controls are used by the clerk.","Effect: without looking at the detail of the payments list, there is a risk that suppliers could be paid an incorrect amount. Recommendation: the finance director should authorise the detail rather than the summary, and should agree the amounts to be paid to supporting documentation and review the supplier names. Test of control: inspect a sample of payments for evidence that the detail was authorised before payment was made.","Effect: without performing a reconciliation each month, errors may not be identified on a timely basis. Recommendation: supplier statement reconciliations should be performed on a monthly basis for all suppliers and should be reviewed by a responsible official. Test of control: review a sample of reconciliations to ensure that they are being performed on a regular basis."],"keywords":[["authoris","responsible official"],["senior","exception report","reject"],["purchase order","agreed","signed"],["damage","quality","grn"],["three","copy","purchase department"],["daily","regular","promptly"],["grn","match","overpay"],["control totals","accuracy","completeness"],["detail","finance director","supporting documentation"],["reconciliation","monthly","supplier statement"]]},
{"id":104,"type":"template","category":"IC","title":"Level: Cash cycle — complete internal control template (4 deficiencies)","caseText":"","question":"Recall the full wording of the 4 common internal control deficiencies in the cash cycle (effect + recommendation + test of control).","labels":["1. No segregation of duties: cashier, bookkeeping and bank reconciliation done by the same person","2. Reconciliation only reviewed when differences are significant","3. Bank reconciliations performed too infrequently: every two months or annually","4. Petty cash: no receipts required, no requirement to return receipts after use"],"modelAnswer":["Effect: there is a lack of segregation of duties and errors will not be identified on a timely basis. There is also an increased risk of fraud. Recommendation: the key roles of posting bank receipts, updating the sales ledger and performing bank reconciliations should be split between different individuals. Test of control: review the job descriptions for the posting of bank receipts and the updating of the cash book and sales ledger to confirm that responsibilities are split.","Effect: since some reconciliations are not being reviewed, errors or fraud may not be identified on a timely basis. Recommendation: all bank reconciliations should be reviewed by a responsible officer on a monthly basis. Test of control: review the file of, or a sample of, bank reconciliations to confirm that all of them are reviewed each month.","Effect: if the bank account is not reconciled regularly enough, this reduces the effectiveness of the control and errors may not be identified on a timely basis. Recommendation: all bank reconciliations should be performed and reviewed monthly rather than every two months. Test of control: review the file of, or a sample of, bank reconciliations to confirm that they are being performed on a regular basis.","Effect: with no requirement to return receipts for petty cash, sundry purchases could be made for non-business items, or the cash could be stolen. Recommendation: a petty cash book should be maintained recording the amount borrowed, the date and the employee name, and employees should be required to return a receipt for sundry purchases. Test of control: review the petty cash book to confirm that all cash issued has been accounted for and supported by receipts from employees."],"keywords":[["segregation","reconciliation","split"],["reviewed","monthly","reconciliation"],["monthly","regular"],["petty cash","receipt","book"]]},
{"id":105,"type":"template","category":"IC","title":"Level: Payroll cycle — complete internal control template (10 deficiencies)","caseText":"","question":"Recall the full wording of the 10 common internal control deficiencies in the payroll cycle (effect + recommendation + test of control).","labels":["1. Payroll department sets up new employees","2. Clocking in and out is not supervised","3. Overtime is not authorised before payment","4. Production supervisors determine employee bonuses","5. Pay increases are not approved: HR applies them directly","6. Payroll calculations are not checked: no review after the system calculates them","7. Payment authorisation is not segregated: the payroll manager amends records and authorises payment","8. The finance director reviews only the summary total","9. No variance analysis: monthly management accounts do not analyse wage variances","10. Cash wages are distributed by supervisors"],"modelAnswer":["Effect: this is a lack of segregation of duties, which will lead to an increased risk of fictitious employees being set up. Recommendation: the HR director should approve all new additions to the payroll. Note: temporary employees must also be authorised and approved by HR. Test of control: select a sample of new joiner forms and inspect them for evidence that they were signed by the HR director, or review the job descriptions of the HR and payroll departments to confirm the segregation of roles.","Effect: without supervision, one individual may clock in for multiple employees, increasing payroll costs. Recommendation: the clocking in and out procedures should be supervised by a responsible official, to prevent one individual clocking in for multiple employees. Test of control: observe the clocking in and clocking out process for evidence that it is supervised by a responsible officer.","Effect: this will result in unauthorised overtime being paid and will increase payroll costs. Recommendation: all overtime should be authorised by a responsible official before the payment is processed by the payroll department. Test of control: review the overtime reports for evidence that authorisation by a responsible official was obtained before payment.","Effect: production supervisors should not determine bonuses, as they could pay extra bonuses to friends or family members, resulting in additional payroll costs. Recommendation: the bonus should be determined by a responsible official, such as the production director, and should be formulated on the basis of a written policy. If significant in value, the bonus should be formally agreed by the board of directors. Test of control: review the written bonus policy and inspect evidence that bonuses are determined by a responsible official.","Effect: as payroll can be a significant expense for a business, pay increases applied by HR may increase payroll costs. Recommendation: all increases in pay should be proposed by the HR department and then formally agreed by the board of directors. Test of control: review the board minutes to confirm that the increase in pay was approved by the board.","Effect: there is a risk that any system errors would not be identified. This could result in wages being over or underpaid. Recommendation: a senior member of the payroll team should recalculate the gross to net pay workings for a sample of employees and compare them with the payroll system. Test of control: review a sample of monthly payments for evidence that the review of the calculations has been undertaken.","Effect: there is a lack of segregation of duties between amending the payroll records and authorising the payment, so the payroll manager could increase the amounts paid to certain employees. Recommendation: the authorisation of the bank transfer listing should be undertaken by an individual outside the payroll department, such as the finance director. Test of control: inspect a sample of payments for evidence that they were authorised by the finance director before payment.","Effect: without checking the detail, employees could be omitted or fictitious employees added, so there could be fraudulent or incorrect payments. Recommendation: the finance director should be given a detailed list and should confirm that the payments are correct before authorising them. Test of control: obtain a sample of payment lists and review them for the finance director's signature as evidence that the control is operating correctly.","Effect: without variance analysis, the cost of wages could increase and this would impact the profitability of the company. Recommendation: the monthly management accounts should be amended to include an analysis of wages and salaries compared with the budgeted costs. Test of control: inspect a sample of variance analysis reports for evidence that they are performed each month.","Effect: the supervisor could adjust pay packets to increase those of close friends whilst reducing others, causing employee dissatisfaction. Recommendation: all pay packets should be distributed by the payroll department directly to employees, and employees should sign when they receive the payment. Test of control: observe the payment process to confirm that the payroll department distributes payments to employees directly."],"keywords":[["segregation","fictitious"],["supervised","clocking"],["overtime","authorised","before payment"],["bonus","production director","written policy"],["pay","proposed","board"],["recalculat","gross to net","senior"],["segregation","finance director","outside"],["detail","fictitious","signature"],["variance","budget","management accounts"],["pay packets","distributed","sign"]]},
{"id":106,"type":"template","category":"IC","title":"Level: Inventory cycle (count) — complete internal control template (6 deficiencies)","caseText":"","question":"Recall the full wording of the 6 common internal control deficiencies in the inventory cycle / count (effect + recommendation + test of control).","labels":["1. Production continues during the count: inventory keeps moving in and out","2. Count sheets include the book quantity","3. Complex inventory quantities are estimated by the warehouse manager","4. Surplus inventory sheets are not numbered","5. Damaged inventory is left in place: only noted on the count sheets","6. Some inventory is never counted under the perpetual count programme"],"modelAnswer":["Effect: during the count, movements of raw materials and finished goods in and out of the warehouse continue, which could result in the count records being inaccurate. Recommendation: movements of inventory should cease during the count. If this is not possible, movements should be carefully controlled and recorded separately. Test of control: observe the procedures for movements of inventory during the count, to confirm that all movements have ceased or are separately recorded.","Effect: if the count sheets include the book quantity, the counters may simply agree to the recorded quantity rather than performing an independent count. Recommendation: count sheets should not include book quantities; counters should count the actual quantities and record them independently. Test of control: inspect a sample of the count sheets used during the inventory count to confirm that they do not include book quantities.","Effect: the quantities of complex inventory items have been approximated by the raw materials warehouse manager rather than involving a specialist, which may lead to the inventory quantities being inaccurate. Recommendation: for complex inventory, a specialist should be engaged to assess the quantities rather than the warehouse manager estimating them. Test of control: discuss with management the process for counting complex inventory and obtain evidence that a specialist was involved.","Effect: the surplus inventory sheets are not numbered, which means they could be lost and result in inventory being unrecorded. Recommendation: surplus inventory sheets should be sequentially numbered and controlled, in the same way as the main count sheets. Test of control: inspect a sample of surplus inventory sheets and review them to confirm that they are sequentially numbered.","Effect: damaged goods identified during the count are left where they are, which may lead to them being counted twice or overlooked. Recommendation: all damaged goods should be clearly flagged and moved to a designated central location during the count. Test of control: observe whether damaged inventory is clearly flagged and moved to a designated central location.","Effect: since some goods may not be counted, the inventory records may be incorrect. Recommendation: the programme of perpetual counts should be reviewed to ensure that all inventory lines are counted at least once during the year. Test of control: inspect the perpetual count programme and the records of counts performed, and confirm that all inventory has been counted."],"keywords":[["ceased","movements"],["book quantit","independent"],["specialist","complex"],["surplus","sequentially numbered"],["flagged","central location","damaged"],["perpetual","counted","programme"]]},
{"id":201,"type":"template","category":"SP","title":"Level: Assertions framework (5 for SFP balances + 5 for P/L transactions)","caseText":"","question":"Recall the Assertions framework: 5 assertions for balances (statement of financial position) and 5 for transactions (profit or loss), including whether each one tests for overstatement or understatement.","labels":["Balance (SFP) ① — tests overstatement","Balance (SFP) ② — tests understatement","Balance (SFP) ③ — amount overstated / understated","Balance (SFP) ④ — ownership","Balance (SFP) ⑤ — classification","Transaction (P/L) ① — tests overstatement","Transaction (P/L) ② — tests understatement","Transaction (P/L) ③ — amount","Transaction (P/L) ④ — accounting period","Transaction (P/L) ⑤ — classification"],"modelAnswer":["Existence (balance — SFP): the item is recorded in the accounting records but does not actually exist. This assertion tests for overstatement.","Completeness (balance — SFP): the item exists but has not been recorded in the accounting records. This assertion tests for understatement.","Accuracy, valuation and allowance (balance — SFP): the amount at which the balance is recorded is overstated or understated, for example an incorrect valuation or an inadequate allowance.","Rights and obligations (balance — SFP): the entity holds or controls the rights to the asset, or the liability is a genuine obligation of the entity.","Classification (balance — SFP): the balance is recorded in the appropriate category, for example as a non-current asset rather than a current asset.","Occurrence (transaction — P/L): the recorded transaction actually took place and relates to the entity. This assertion tests for overstatement.","Completeness (transaction — P/L): all transactions that occurred have been recorded. This assertion tests for understatement.","Accuracy (transaction — P/L): the amounts and other data relating to the transaction have been recorded appropriately, so the amount can be overstated or understated.","Cut-off (transaction — P/L): the transaction has been recorded in the correct accounting period, so the balance can be overstated or understated.","Classification (transaction — P/L): the transaction has been recorded in the appropriate account in the general ledger."],"keywords":[["existence","overstatement"],["completeness","understatement"],["valuation","allowance","accuracy"],["rights","obligation"],["classification","category"],["occurrence","overstatement","took place"],["completeness","understatement"],["accuracy","amount"],["cut-off","cut off","period"],["classification","account"]]},
{"id":202,"type":"template","category":"SP","title":"Level: SP all-purpose answer framework (three steps)","caseText":"","question":"Recall the three-step all-purpose framework for substantive procedures: AP → Cast & Agree → Test of Details.","labels":["Step 1: Analytical procedures (AP)","Step 2: Cast & Agree","Step 3: Test of details"],"modelAnswer":["Step 1 — Analytical procedures: (i) Trend analysis: compare XXX against prior years and against the budget, and investigate any significant fluctuations; (ii) Ratio analysis: calculate the XX ratio (for example gross profit margin or trade receivables days) and compare it to the prior year; (iii) Proof in total: perform a proof in total calculation of XXX and compare the result to the actual figure.","Step 2 — Cast & Agree: obtain a breakdown or schedule of XXX, cast the schedule and agree the total to the general ledger, the trial balance and the financial statements, to confirm completeness and accuracy.","Step 3 — Test of details: action (Obtain / Select a sample of *** / Review / Inspect / Recalculate / Discuss with management) + the evidence inspected + the purpose (to ensure that ***). Useful sentence patterns: Obtain a sample of ***, review *** and agree *** to ***; For a sample of ***, obtain *** and recalculate ***; Perform a proof in total calculation of *** and compare the result to the actual ***."],"keywords":[["trend","ratio","proof in total"],["cast","agree","trial balance"],["sample","ensure","recalculate"]]},
{"id":203,"type":"template","category":"SP","title":"Level: Revenue — complete substantive procedures template (7 procedures)","caseText":"","question":"Recall the complete template of substantive procedures for Revenue. Hint: revenue = volume [Occurrence / Completeness] × amount [Accuracy].","labels":["1. AP — trend analysis","2. AP — ratio analysis","3. Cast the total","4. Deferred income — risk of early revenue recognition","5. Volume — Occurrence","6. Amount — Accuracy","7. Cut-off"],"modelAnswer":["Compare the overall level of monthly revenue against prior years and against the budget, and investigate any significant fluctuations or differences.","Calculate the gross profit margin and compare it to the prior year, and investigate any significant fluctuations.","Obtain a breakdown of revenue, cast the schedule and agree the total amount to the general ledger, the trial balance and the financial statements, to confirm completeness and accuracy.","Discuss with management the procedures they have adopted to ensure that goods not yet dispatched are excluded from revenue. Alternatively, select a sample of cash receipts from the cash book and trace them to goods despatch notes; where the goods have not been dispatched, confirm that the amount is recorded as deferred income rather than as revenue.","Select a sample of entries in the sales ledger and agree them back to the underlying sales orders, goods despatch notes and sales invoices, to confirm that the revenue recorded relates to genuine sales that have been dispatched.","Select a sample of sales invoices and agree the prices charged back to the authorised price list, to confirm the accuracy of invoicing. Alternatively, recalculate the income using the contract rate and the volume sold, to confirm the accuracy of revenue.","Select a sample of goods despatch notes issued both before and after the year end and follow them through to the sales ledger, to confirm that entries are recorded in the correct accounting period and that cut-off has been correctly applied. In addition, select a sample of credit notes raised after the year end, trace them to the original invoices and confirm that the related sales have been correctly removed."],"keywords":[["compare","prior year","fluctuation"],["gross profit margin"],["cast","breakdown","general ledger"],["deferred income","despatch note","cash book"],["sales order","gdn","sales ledger"],["price list","recalculate","accuracy"],["cut-off","pre and post","credit note"]]},
